name: Deploy documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: zudo-diagram-gen-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.CF_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Cloudflare secret bootstrap
        id: bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Cloudflare deploy skipped: set both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          node-version: 24.13.0
      - run: pnpm install --frozen-lockfile
        if: steps.bootstrap.outputs.ready == 'true'
      - run: pnpm build
        if: steps.bootstrap.outputs.ready == 'true'
      - name: Deploy reviewed main commit
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:cloudflare
      - name: Smoke production
        if: steps.bootstrap.outputs.ready == 'true'
        run: pnpm smoke:cloudflare
