name: Maintenance snapshot

on:
  push:
    branches: [maintenance/plugin-release-20261014]

permissions:
  contents: read

jobs:
  align-workspace-peer:
    if: github.repository == 'Takazudo/zudo-diagram-gen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/plugin-release-20261014
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
      - name: Align only the retained ZFB workspace peer graph
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm install --frozen-lockfile --strict-peer-dependencies
          cp pnpm-lock.yaml "$RUNNER_TEMP/lock-before.yaml"
          pnpm dedupe
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parse } from './node_modules/.pnpm/yaml@2.9.1/node_modules/yaml/dist/index.js';
          const expected = parse(readFileSync(`${process.env.RUNNER_TEMP}/lock-before.yaml`, 'utf8'));
          const actual = parse(readFileSync('pnpm-lock.yaml', 'utf8'));
          expected.importers['packages/diagram-gen'].dependencies['@takazudo/zfb'].version = '4.5.0';
          for (const section of ['packages', 'snapshots']) {
            for (const key of Object.keys(expected[section])) {
              if (/^@takazudo\/zfb(?:-[^@]+)?@4\.3\.1$/.test(key)) delete expected[section][key];
            }
          }
          assert.deepEqual(actual, expected, 'Dedupe changed more than the reviewed ZFB peer graph');
          NODE
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm exec mdx-formatter --write README.md docs/maintenance/2026-10-14.md src/content/docs/changelog/2026-10-14-zudo-dependencies.mdx src/content/docs/getting-started/plugin-downloads.mdx
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test
          node --test test/plugin-release.node.mjs
          pnpm build
          node scripts/check-built-links.mjs
      - name: Commit scoped lockfile and formatting changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml README.md docs/maintenance/2026-10-14.md src/content/docs/changelog/2026-10-14-zudo-dependencies.mdx src/content/docs/getting-started/plugin-downloads.mdx
          git diff --exit-code
          git commit -m 'chore: align the workspace ZFB peer with the validated 4.5.0 stack'
          test "$(git ls-remote origin refs/heads/maintenance/plugin-release-20261014 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/maintenance/plugin-release-20261014
      - name: Save exact change evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/maintenance-result"
          git diff HEAD --binary > "$RUNNER_TEMP/maintenance-result/uncommitted.patch"
          git diff "$GITHUB_SHA" --binary > "$RUNNER_TEMP/maintenance-result/update.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/maintenance-result/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/maintenance-result/head.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maintenance-result
          path: ${{ runner.temp }}/maintenance-result/
          retention-days: 3
          if-no-files-found: error
