name: Zudo dependency install
on:
  push:
    branches: [maintenance/zudo-deps-sidebar-20261015]
    paths: [.github/workflows/zudo-deps-recon.yml]
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'Takazudo/zudo-diagram-gen' && github.ref == 'refs/heads/maintenance/zudo-deps-sidebar-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
      - name: Apply reviewed dependency and sidebar changes
        run: node .maintenance/apply-sidebar-deps.mjs
      - name: Normal strict installation
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies
      - name: Format changed sources and remove temporary maintenance helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z | xargs -0 -r pnpm exec prettier --write --ignore-unknown
          pnpm exec prettier --write scripts/check-section-sidebars.mjs src/sidebars.ts
          pnpm exec mdx-formatter --write AGENTS.md IMPLEMENTATION-CONTRACT.md README.md docs/CODEX-HANDOFF.md docs/documentation-structure.md packages/create-zudo-diagram-gen/README.md packages/diagram-gen/README.md src/content/docs/reference/architecture.mdx src/content/docs/changelog/2026-10-15-section-sidebar.mdx
          node scripts/sync-scaffold.mjs
          rm .maintenance/apply-sidebar-deps.mjs .github/workflows/zudo-deps-recon.yml
      - name: Verify normal install result and package build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-scaffold.mjs --check
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test
          pnpm check:examples
          pnpm build
          node scripts/check-built-links.mjs
      - name: Commit only to this unchanged maintenance branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=maintenance/zudo-deps-sidebar-20261015
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only -- packages/diagram-gen/package.json plugins examples worker wrangler.jsonc)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(docs): update Zudo dependencies and keep sidebars within their sections'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          mkdir -p /tmp/zudo-deps-installed
          git rev-parse HEAD > /tmp/zudo-deps-installed/commit.txt
          git archive --format=tar.gz --output=/tmp/zudo-deps-installed/source.tar.gz HEAD
          cp pnpm-lock.yaml /tmp/zudo-deps-installed/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zudo-deps-installed
          path: /tmp/zudo-deps-installed/
          retention-days: 3
          if-no-files-found: error
