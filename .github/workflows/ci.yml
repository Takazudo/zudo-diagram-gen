name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm check:examples
      - run: pnpm build
      - name: Build an installed consumer from packed archives
        shell: bash
        run: |
          pnpm pack:local
          consumer="$RUNNER_TEMP/zudo-diagram-consumer"
          npm exec --yes --package "$GITHUB_WORKSPACE/artifacts/create-zudo-diagram-gen-0.1.0.tgz" -- \
            create-zudo-diagram-gen "$consumer" --name 'CI consumer' \
            --engine-package "$GITHUB_WORKSPACE/artifacts/takazudo-zudo-diagram-gen-0.1.0.tgz" --yes
          cd "$consumer"
          pnpm install
          pnpm check
          pnpm build
