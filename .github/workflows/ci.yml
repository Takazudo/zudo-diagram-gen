name: CI

on:
  pull_request:
  push:
    branches: [main, 'base/**']

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm exec zfb check
      - run: pnpm test
      - run: pnpm check:examples
      - run: pnpm build
      - run: node scripts/check-built-links.mjs
      - name: Save built site for asset preview and release verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Build an installed consumer from packed archives
        shell: bash
        run: |
          pnpm pack:local
          consumer="$RUNNER_TEMP/zudo-diagram-consumer"
          npm exec --yes --package "$GITHUB_WORKSPACE/artifacts/create-zudo-diagram-gen-0.1.0.tgz" -- \
            create-zudo-diagram-gen "$consumer" --name 'CI consumer' \
            --engine-package "$GITHUB_WORKSPACE/artifacts/takazudo-zudo-diagram-gen-0.1.0.tgz" --yes
          cd "$consumer"
          pnpm install --strict-peer-dependencies
          pnpm check
          pnpm build
          pnpm exec zfb check
          pnpm exec zfb wind audit --fail-on error
          mkdir -p "$GITHUB_WORKSPACE/test-output"
          pnpm exec zudo-diagram-gen export-html . --out "$GITHUB_WORKSPACE/test-output/browser-consumer-empty.html"
          cp -R "$GITHUB_WORKSPACE/examples/project-text/rounds/r01/r01-c01" rounds/r01/
          # Literal documentation text must survive the renderer's boundary guard.
          printf '\nLiteral marker text: data-zfb-island="Demo" and zr:1:example\n' >> brief.md
          pnpm check
          pnpm build
          pnpm exec zfb check
          pnpm exec zudo-diagram-gen export-html . --out "$GITHUB_WORKSPACE/test-output/browser-consumer.html"
      - name: Build the packed five-session P07 review fixture
        shell: bash
        run: |
          set -euo pipefail
          export ENGINE_TGZ="$GITHUB_WORKSPACE/artifacts/takazudo-zudo-diagram-gen-0.1.0.tgz"
          export PROJECT_REVIEW_OUT="$RUNNER_TEMP/zudo-diagram-project-review"
          bash scripts/check-project-review-packed.sh | tee test-output/p07-packed.log
      - name: Check built preview routes
        shell: bash
        run: |
          set -euo pipefail
          pnpm preview --host 127.0.0.1 --port 4333 > "$RUNNER_TEMP/root-preview.log" 2>&1 &
          root_pid=$!
          (cd "$RUNNER_TEMP/zudo-diagram-consumer" && pnpm preview --host 127.0.0.1 --port 4334) > "$RUNNER_TEMP/consumer-preview.log" 2>&1 &
          consumer_pid=$!
          trap 'kill "$root_pid" "$consumer_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4333/ > /dev/null && curl --fail --silent http://127.0.0.1:4334/ > /dev/null; then break; fi
            sleep 1
          done
          for route in / /docs/tones/ /docs/examples/ /docs/workbench/ /docs/changelog/ /docs/getting-started/introduction/; do
            curl --fail --silent "http://127.0.0.1:4333$route" > /dev/null || { cat "$RUNNER_TEMP/root-preview.log"; exit 1; }
          done
          curl --fail --silent http://127.0.0.1:4334/ > /dev/null || { cat "$RUNNER_TEMP/consumer-preview.log"; exit 1; }
      - name: Check workbench in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec zudo-diagram-gen export-html examples/tone-exploration --out test-output/browser-project.html
          pnpm check:browser
          pnpm check:site-browser
          node scripts/check-offline-file.mjs
      - name: Check P07 packed preview and detached HTML in Chromium
        shell: bash
        run: |
          set -euo pipefail
          review_root="$RUNNER_TEMP/zudo-diagram-project-review"
          node "$review_root/project/node_modules/@takazudo/zudo-diagram-gen/src/cli.mjs" preview \
            "$review_root/project" --host 127.0.0.1 --port 4797 > test-output/p07-preview.log 2>&1 &
          review_pid=$!
          cleanup() {
            kill "$review_pid" 2>/dev/null || true
            wait "$review_pid" 2>/dev/null || true
            if [[ -d "$review_root/project-away" ]]; then
              mv "$review_root/project-away" "$review_root/project"
            fi
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4797/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4797/ > /dev/null || { cat test-output/p07-preview.log; exit 1; }
          node scripts/check-project-review-browser.mjs http://127.0.0.1:4797 test-output/p07-browser
          kill "$review_pid" 2>/dev/null || true
          wait "$review_pid" 2>/dev/null || true
          mv "$review_root/project" "$review_root/project-away"
          node scripts/check-project-review-browser.mjs "$review_root/detached/combined.html" test-output/p07-offline --offline
          node scripts/check-single-offline-browser.mjs "$review_root/detached/single.html" test-output/p07-single-offline
      - name: Verify the frozen actual P11 trial source
        run: node scripts/check-integrated-trial-fixture.mjs > test-output/p11-fixture.json
      - name: Build the packed actual P11 trial
        shell: bash
        run: |
          set -euo pipefail
          export ENGINE_TGZ="$GITHUB_WORKSPACE/artifacts/takazudo-zudo-diagram-gen-0.1.0.tgz"
          export INITIALIZER_TGZ="$GITHUB_WORKSPACE/artifacts/create-zudo-diagram-gen-0.1.0.tgz"
          export INTEGRATED_TRIAL_OUT="$RUNNER_TEMP/zudo-diagram-integrated-trial"
          bash scripts/check-integrated-trial-packed.sh | tee test-output/p11-packed.log
      - name: Check actual P11 review, watcher and detached files in Chromium
        shell: bash
        run: |
          set -euo pipefail
          trial_root="$RUNNER_TEMP/zudo-diagram-integrated-trial"
          export INTEGRATED_SHA="$GITHUB_SHA"
          export PROJECT_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright/index.mjs"
          node "$trial_root/project/node_modules/@takazudo/zudo-diagram-gen/src/cli.mjs" preview \
            "$trial_root/project" --host 127.0.0.1 --port 4799 > test-output/p11-preview.log 2>&1 &
          trial_pid=$!
          cleanup() {
            kill "$trial_pid" 2>/dev/null || true
            wait "$trial_pid" 2>/dev/null || true
            if [[ -d "$trial_root/project-away" ]]; then
              mv "$trial_root/project-away" "$trial_root/project"
            fi
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4799/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4799/ > /dev/null || { cat test-output/p11-preview.log; exit 1; }
          node scripts/check-integrated-trial-browser.mjs "$trial_root/project" http://127.0.0.1:4799 test-output/p11-browser
          node scripts/check-integrated-trial-watcher.mjs "$trial_root/project" "$RUNNER_TEMP/p11-watcher" --port=4798
          cp "$RUNNER_TEMP/p11-watcher/watcher-result.json" test-output/p11-watcher-result.json
          cp "$RUNNER_TEMP/p11-watcher/watcher-diagnostics.json" test-output/p11-watcher-diagnostics.json
          kill "$trial_pid"
          wait "$trial_pid" || true
          if curl --fail --silent --max-time 2 http://127.0.0.1:4799/ > /dev/null; then
            echo 'Trial server remains available; detached gate refused' >&2
            exit 1
          fi
          mv "$trial_root/project" "$trial_root/project-away"
          test ! -e "$trial_root/project"
          printf '{"sourceAway":true,"serverStopped":true,"transport":"file","network":"blocked by browser helpers"}\n' > test-output/p11-detached-orchestration.json
          node scripts/check-integrated-trial-browser.mjs "$trial_root/project-away" "$trial_root/detached/combined.html" test-output/p11-offline --offline
          node scripts/check-integrated-single-offline.mjs "$trial_root/project-away" "$trial_root/detached/single.html" test-output/p11-single-offline reservation-flow r02-fine-outline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-screenshots
          path: |
            test-output/browser-*.png
            test-output/doc-combine-*.png
            test-output/p07-*/
            test-output/p07-*.log
            test-output/p11-*/
            test-output/p11-*.json
            test-output/p11-*.log
          if-no-files-found: ignore
          retention-days: 3
