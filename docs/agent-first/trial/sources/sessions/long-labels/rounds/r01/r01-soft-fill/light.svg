38 170h12" fill="none" data-palette-stroke="border" stroke="#708090" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="132" y="285" width="30" height="30" rx="9" data-palette-fill="accent" fill="#267D75" opacity="1"/><path d="M140 300l5 5 10-12" fill="none" data-palette-stroke="surface" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="299" y="43" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="600" data-palette-fill="ink" fill="#203040"><tspan x="299" dy="0">地域交流イベント</tspan><tspan x="299" dy="24.7">開催準備担当</tspan></text><text x="299" y="158" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="600" data-palette-fill="ink" fill="#203040"><tspan x="299" dy="0">参加申込内容の</tspan><tspan x="299" dy="24.7">確認・連絡担当</tspan></text><text x="305" y="307" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="600" data-palette-fill="ink" fill="#203040"><tspan x="305" dy="0">当日受付と案内の担当</tspan></text><rect x="17" y="203" width="95" height="56" rx="23" data-palette-fill="warning" fill="#B85A18" opacity="0.3"/><text x="64" y="225" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" font-weight="600" data-palette-fill="ink" fill="#203040"><tspan x="64" dy="0">不足項目</tspan><tspan x="64" dy="20.8">あり</tspan></text><rect x="280" y="220" width="121" height="30" rx="15" data-palette-fill="surface" fill="#FFFFFF" opacity="1"/><text x="340" y="241" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="600" data-palette-fill="ink" fill="#203040"><tspan x="340" dy="0">確認完了</tspan></text></svg>
