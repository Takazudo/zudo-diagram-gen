<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ — Soft shared lanes</title><desc id="desc">架空の資料作成チームで、長い日本語の担当名を省略せずに引継ぎ順を伝える。 Soft rounded filled forms; arrows describe only the stated relationships.</desc><rect x="0" y="0" width="480" height="360" rx="0" data-palette-fill="surface" fill="#15212D" opacity="1"/><rect x="22" y="20" width="436" height="87" rx="34" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><rect x="22" y="152" width="285" height="116" rx="34" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><rect x="327" y="152" width="131" height="174" rx="34" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><circle cx="58" cy="45" r="6.5" data-palette-fill="ink" fill="#F0F4F8"/><path d="M45 72.3V65.15Q45 55.4 58 55.4Q71 55.4 71 65.15V72.3Z" fill="#85B9DF" data-palette-fill="deep"/><text x="256" y="52" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="256" dy="0">地域交流イベント</tspan><tspan x="256" dy="26">開催準備担当</tspan></text><path d="M164 112V148" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="157,138 164,148 171,138" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><text x="160" y="195" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="20" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="160" dy="0">参加申込内容の</tspan><tspan x="160" dy="26">確認・連絡担当</tspan></text><rect x="139" y="226" width="42" height="29" rx="12" data-palette-fill="deep" fill="#85B9DF" opacity="1"/><path d="M149 241h22 M149 252h18" fill="none" data-palette-stroke="border" stroke="#91A4B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M312 217H323" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="313,210 323,217 313,224" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><text x="392" y="178" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="392" dy="0">確認完了</tspan></text><rect x="378" y="204" width="28" height="28" rx="9" data-palette-fill="accent" fill="#68C4AF" opacity="1"/><path d="M385 218l5 5 10-12" fill="none" data-palette-stroke="surface" stroke="#15212D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="392" y="270" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="392" dy="0">当日受付と</tspan><tspan x="392" dy="22.1">案内の担当</tspan></text><path d="M83 274V313Q83 338 47 338H12V63Q12 54 17 54" fill="none" data-palette-stroke="warning" stroke="#FFC078" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="7,47 17,54 7,61" data-palette-fill="warning" fill="#FFC078" stroke="#FFC078" stroke-width="3" stroke-linejoin="round"/><rect x="119.5" y="299" width="149" height="32" rx="16" data-palette-fill="warning" fill="#FFC078" opacity="0.3"/><text x="194" y="319" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="14" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="194" dy="0">不足項目あり</tspan></text></svg>
