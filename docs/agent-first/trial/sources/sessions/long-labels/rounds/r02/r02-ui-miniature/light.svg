<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" data-palette-ink="#203040" data-palette-surface="#FFFFFF" data-palette-border="#708090" data-palette-accent="#267D75" data-palette-deep="#174C66" data-palette-warning="#B85A18" font-family="'Noto Sans CJK JP', sans-serif"><title>長いラベルの担当引継ぎ</title><desc>Conceptual UI miniature; original P00 scenario, not a screenshot or interactive control map. - 「地域交流イベント開催準備担当」から「参加申込内容の確認・連絡担当」へ資料を渡す。
- 確認担当が不足項目を見つけたら準備担当へ戻す。
- 不足がなければ「当日受付と案内の担当」へ渡す。
- 三つの担当名は省略せず、改行は許可する。</desc><rect width="480" height="360" fill="#FFFFFF" data-palette-fill="surface"/><rect x="12" y="12" width="456" height="336" rx="5" fill="#FFFFFF" data-palette-fill="surface" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><path d="M12 34H468" fill="none" stroke="#708090" data-palette-stroke="border" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="23" r="2" fill="#708090" data-palette-fill="border" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><circle cx="34" cy="23" r="2" fill="#708090" data-palette-fill="border" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><circle cx="44" cy="23" r="2" fill="#708090" data-palette-fill="border" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><rect x="130" y="42" width="320" height="75" rx="5" fill="#FFFFFF" data-palette-fill="surface" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><rect x="130" y="42" width="5" height="75" rx="0" fill="#174C66" data-palette-fill="deep" stroke="#174C66" data-palette-stroke="deep" stroke-width="1.5"/><text x="146" y="71" fill="#203040" data-palette-fill="ink" font-size="20" font-weight="600" text-anchor="start"><tspan x="146" dy="0">地域交流イベント</tspan><tspan x="146" dy="24">開催準備担当</tspan></text><rect x="130" y="148" width="320" height="75" rx="5" fill="#FFFFFF" data-palette-fill="surface" stroke="#267D75" data-palette-stroke="accent" stroke-width="1.5"/><rect x="130" y="148" width="5" height="75" rx="0" fill="#267D75" data-palette-fill="accent" stroke="#267D75" data-palette-stroke="accent" stroke-width="1.5"/><text x="146" y="177" fill="#203040" data-palette-fill="ink" font-size="20" font-weight="600" text-anchor="start"><tspan x="146" dy="0">参加申込内容の</tspan><tspan x="146" dy="24">確認・連絡担当</tspan></text><rect x="130" y="277" width="320" height="59" rx="5" fill="#FFFFFF" data-palette-fill="surface" stroke="#708090" data-palette-stroke="border" stroke-width="1.5"/><rect x="130" y="277" width="5" height="59" rx="0" fill="#174C66" data-palette-fill="deep" stroke="#174C66" data-palette-stroke="deep" stroke-width="1.5"/><text x="146" y="306" fill="#203040" data-palette-fill="ink" font-size="20" font-weight="600" text-anchor="start"><tspan x="146" dy="0">当日受付と案内の担当</tspan></text><path d="M146 319H434" fill="none" stroke="#708090" data-palette-stroke="border" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 117V140" fill="none" stroke="#203040" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 134L290 140L295 134" fill="none" stroke="#203040" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 223V269" fill="none" stroke="#203040" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 263L290 269L295 263" fill="none" stroke="#203040" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="249" fill="#267D75" data-palette-fill="accent" font-size="16" font-weight="600" text-anchor="start"><tspan x="312" dy="0">確認完了</tspan></text><path d="M130 184H28V80H122" fill="none" stroke="#B85A18" data-palette-stroke="warning" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 75L122 80L116 85" fill="none" stroke="#B85A18" data-palette-stroke="warning" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="122" fill="#B85A18" data-palette-fill="warning" font-size="15" font-weight="600" text-anchor="start"><tspan x="40" dy="0">不足項目</tspan><tspan x="40" dy="19">あり</tspan></text></svg>
