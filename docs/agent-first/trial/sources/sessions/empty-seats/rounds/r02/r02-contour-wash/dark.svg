<path d="M304 145V148L314 155" fill="none" stroke="#F0F4F8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="210" fill="#F0F4F8" font-size="18" font-weight="600" text-anchor="middle"><tspan x="270" dy="0">D席：保留中</tspan></text>
<text x="270" y="234" fill="#FFC078" font-size="16" font-weight="600" text-anchor="middle"><tspan x="270" dy="0">選択不可</tspan></text>
