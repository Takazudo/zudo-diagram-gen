- 返却箱は現在空。空でも返却に使える。
- 相談窓口への分岐を警告役で示すが罰金や返却拒否を示さない。</desc><rect width="320" height="480" fill="#15212D" data-palette-fill="surface"/><rect x="12" y="12" width="296" height="456" rx="5" fill="#15212D" data-palette-fill="surface" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5"/><path d="M12 34H308" fill="none" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="23" r="2" fill="#91A4B5" data-palette-fill="border" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5"/><circle cx="34" cy="23" r="2" fill="#91A4B5" data-palette-fill="border" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5"/><circle cx="44" cy="23" r="2" fill="#91A4B5" data-palette-fill="border" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5"/><rect x="72" y="48" width="176" height="54" rx="5" fill="#15212D" data-palette-fill="surface" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5"/><rect x="72" y="48" width="5" height="54" rx="0" fill="#85B9DF" data-palette-fill="deep" stroke="#85B9DF" data-palette-stroke="deep" stroke-width="1.5"/><text x="88" y="77" fill="#F0F4F8" data-palette-fill="ink" font-size="22" font-weight="600" text-anchor="start"><tspan x="88" dy="0">入口</tspan></text><path d="M88 90H232" fill="none" stroke="#91A4B5" data-palette-stroke="border" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 102V126" fill="none" stroke="#F0F4F8" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 120L160 126L165 120" fill="none" stroke="#F0F4F8" data-palette-stroke="ink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="134" width="208" height="64" rx="5" fill="#15212D" data-palette-fill="surface" stroke="#68C4AF" data-palette-stroke="accent" stroke-width="1.5"/><rect x="56" y="134" width="5" height="64" rx="0" fill="#68C4AF" data-palette-fill="accent" stroke