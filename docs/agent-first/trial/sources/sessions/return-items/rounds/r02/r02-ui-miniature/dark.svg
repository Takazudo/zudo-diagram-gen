<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" data-palette-ink="#F0F4F8" data-palette-surface="#15212D" data-palette-border="#91A4B5" data-palette-accent="#68C4AF" data-palette-deep="#85B9DF" data-palette-warning="#FFC078" font-family="'Noto Sans CJK JP', sans-serif"><title>返却場所への案内</title><desc>Conceptual UI miniature; original P00 scenario, not a screenshot or interactive control map. - 入口から返却確認台へ進む。
