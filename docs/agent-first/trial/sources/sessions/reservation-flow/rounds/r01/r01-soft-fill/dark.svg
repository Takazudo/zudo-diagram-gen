<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更 — Rounded islands</title><desc id="desc">架空の共同作業室「みどり室」の予約を説明する。左から右へ、申請、確認待ち、確定の順に示す。 Soft rounded filled forms; arrows describe only the stated relationships.</desc><rect x="0" y="0" width="640" height="320" rx="0" data-palette-fill="surface" fill="#15212D" opacity="1"/><path d="M184 137H220" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="210,130 220,137 210,144" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><path d="M406 137H446" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="436,130 446,137 436,144" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><rect x="24" y="54" width="160" height="166" rx="24" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><rect x="220" y="54" width="186" height="166" rx="24" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><rect x="446" y="54" width="170" height="166" rx="24" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><rect x="82" y="80" width="44" height="48" rx="12" data-palette-fill="deep" fill="#85B9DF" opacity="1"/><path d="M92 95h24 M92 106h20" fill="none" data-palette-stroke="border" stroke="#91A4B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="313" cy="111" r="26" data-palette-fill="deep" fill="#85B9DF"/><circle cx="313" cy="111" r="21" data-palette-fill="surface" fill="#15212D"/><path d="M313 94V111L320 116" fill="none" data-palette-stroke="warning" stroke="#FFC078" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="313" cy="111" r="2" data-palette-fill="ink" fill="#F0F4F8"/><rect x="509" y="89" width="44" height="44" rx="9" data-palette-fill="accent" fill="#68C4AF" opacity="1"/><path d="M524 111l5 5 10-12" fill="none" data-palette-stroke="surface" stroke="#15212D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="180" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="24" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="104" dy="0">申請</tspan></text><text x="313" y="180" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="24" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="313" dy="0">確認待ち</tspan></text><text x="531" y="180" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="24" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="531" dy="0">確定</tspan></text><text x="313" y="204" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="14" font-weight="400" data-palette-fill="ink" fill="#F0F4F8"><tspan x="313" dy="0">予約確定ではない</tspan></text><path d="M531 224V265Q531 283 510 283H334Q313 283 313 260V232" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="306,242 313,232 320,242" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><rect x="367" y="263" width="142" height="36" rx="18" data-palette-fill="surface" fill="#15212D" opacity="1"/><text x="438" y="287" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="438" dy="0">日時を変更</tspan></text></svg>
