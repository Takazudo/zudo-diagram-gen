<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" data-palette-ink="#203040" data-palette-surface="#FFFFFF" data-palette-border="#708090" data-palette-accent="#267D75" data-palette-deep="#174C66" data-palette-warning="#B85A18" font-family="'Noto Sans CJK JP', sans-serif"><title>予約の確定と変更</title><desc>Conceptual UI miniature; original P00 scenario, not a screenshot or interactive control map. - 申請 → 確認待ち → 確定の三段階を示す。
