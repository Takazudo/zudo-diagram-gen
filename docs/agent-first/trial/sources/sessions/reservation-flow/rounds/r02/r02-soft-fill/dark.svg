<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更 — Soft shared lanes</title><desc id="desc">架空の共同作業室「みどり室」の予約を説明する。左から右へ、申請、確認待ち、確定の順に示す。 Soft rounded filled forms; arrows describe only the stated relationships.</desc><rect x="0" y="0" width="640" height="320" rx="0" data-palette-fill="surface" fill="#15212D" opacity="1"/><rect x="24" y="50" width="592" height="144" rx="50" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><path d="M174 112H249" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="239,105 249,112 239,119" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><path d="M381 112H457" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="447,105 457,112 447,119" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><rect x="81" y="73" width="48" height="48" rx="12" data-palette-fill="deep" fill="#85B9DF" opacity="1"/><path d="M91 88h28 M91 99h24" fill="none" data-palette-stroke="border" stroke="#91A4B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="319" cy="96" r="24" data-palette-fill="deep" fill="#85B9DF"/><circle cx="319" cy="96" r="19" data-palette-fill="surface" fill="#15212D"/><path d="M319 81V96L326 101" fill="none" data-palette-stroke="warning" stroke="#FFC078" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="319" cy="96" r="2" data-palette-fill="ink" fill="#F0F4F8"/><rect x="510" y="75" width="42" height="42" rx="9" data-palette-fill="accent" fill="#68C4AF" opacity="1"/><path d="M524 96l5 5 10-12" fill="none" data-palette-stroke="surface" stroke="#15212D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="162" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="22" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="105" dy="0">申請</tspan></text><text x="319" y="162" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="22" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="319" dy="0">確認待ち</tspan></text><text x="531" y="162" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="22" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="531" dy="0">確定</tspan></text><rect x="249" y="204" width="145" height="72" rx="30" data-palette-fill="deep" fill="#85B9DF" opacity="0.3"/><text x="321" y="239" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="321" dy="0">日時を変更</tspan></text><path d="M531 197V233Q531 244 518 244H399" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="409,237 399,244 409,251" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><path d="M321 201V180" fill="none" data-palette-stroke="deep" stroke="#85B9DF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="314,190 321,180 328,190" data-palette-fill="deep" fill="#85B9DF" stroke="#85B9DF" stroke-width="3" stroke-linejoin="round"/><text x="102" y="250" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="102" dy="0">確認待ちは</tspan></text><text x="102" y="272" text-anchor="middle" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" font-weight="600" data-palette-fill="ink" fill="#F0F4F8"><tspan x="102" dy="0">予約確定ではない</tspan></text></svg>
