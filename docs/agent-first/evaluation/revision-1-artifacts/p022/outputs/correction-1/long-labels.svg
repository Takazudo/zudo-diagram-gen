<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了の場合は当日受付と案内の担当へ渡す。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 1Q0 0 0 3v6q0 3 2 2l9-5Z" fill="#174C66" fill-opacity=".45"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 1Q0 0 0 3v6q0 3 2 2l9-5Z" fill="#B85A18" fill-opacity=".45"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><g font-family="Noto Sans CJK JP, sans-serif"><path d="M306 100V134" fill="none" stroke="#174C66" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M306 210V256" fill="none" stroke="#174C66" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M156 174H135Q124 174 124 163V76Q124 64 136 64H151" fill="none" stroke="#B85A18" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="156" y="28" width="300" height="72" rx="24" fill="#174C66" fill-opacity="0.1"/><text x="306" y="71" font-size="17" font-weight="600" text-anchor="middle" fill="#203040">地域交流イベント開催準備担当</text><rect x="156" y="138" width="300" height="72" rx="24" fill="#174C66" fill-opacity="0.1"/><text x="306" y="181" font-size="17" font-weight="600" text-anchor="middle" fill="#203040">参加申込内容の確認・連絡担当</text><rect x="156" y="260" width="300" height="72" rx="24" fill="#267D75" fill-opacity="0.15"/><text x="306" y="303" font-size="17" font-weight="600" text-anchor="middle" fill="#203040">当日受付と案内の担当</text><rect x="260" y="218" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="1"/><text x="306" y="239" font-size="16" font-weight="500" text-anchor="middle" fill="#203040">確認完了</text><rect x="16" y="130" width="99" height="69" rx="20" fill="#B85A18" fill-opacity="0.12"/><text x="65" y="159" font-size="14" font-weight="600" text-anchor="middle" fill="#203040">不足項目あり</text><text x="65" y="182" font-size="13" font-weight="500" text-anchor="middle" fill="#203040">準備へ戻す</text></g></svg>
