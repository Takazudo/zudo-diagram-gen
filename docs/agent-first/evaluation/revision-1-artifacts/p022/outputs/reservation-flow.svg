<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認はない。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 1Q0 0 0 3v6q0 3 2 2l9-5Z" fill="#174C66" fill-opacity=".45"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 1Q0 0 0 3v6q0 3 2 2l9-5Z" fill="#B85A18" fill-opacity=".45"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><g font-family="Noto Sans CJK JP, sans-serif"><path d="M188 112H232" fill="none" stroke="#174C66" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M402 112H446" fill="none" stroke="#174C66" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M534 172V246Q534 262 518 262H336Q320 262 320 246V176" fill="none" stroke="#174C66" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="24" y="56" width="164" height="116" rx="24" fill="#174C66" fill-opacity="0.1"/><rect x="238" y="56" width="164" height="116" rx="24" fill="#174C66" fill-opacity="0.1"/><rect x="452" y="56" width="164" height="116" rx="24" fill="#267D75" fill-opacity="0.16"/><rect x="90" y="75" width="32" height="24" rx="8" fill="#174C66" fill-opacity="0.25"/><text x="106" y="133" font-size="22" font-weight="600" text-anchor="middle" fill="#203040">申請</text><circle cx="320" cy="91" r="15" fill="#174C66" fill-opacity=".22"/><circle cx="320" cy="91" r="10" fill="#FFFFFF"/><path d="M320 85V91l5 4" fill="none" stroke="#203040" stroke-width="2.4" stroke-linecap="round"/><text x="320" y="133" font-size="22" font-weight="600" text-anchor="middle" fill="#203040">確認待ち</text><rect x="519" y="76" width="30" height="30" rx="11" fill="#267D75" fill-opacity=".22"/><path d="M527 91l5 5 10-11" fill="none" stroke="#203040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="534" y="133" font-size="22" font-weight="600" text-anchor="middle" fill="#203040">確定</text><text x="320" y="197" font-size="14" font-weight="500" text-anchor="middle" fill="#203040">予約は未確定</text><rect x="372" y="240" width="142" height="40" rx="20" fill="#FFFFFF" fill-opacity="1"/><text x="443" y="266" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">日時を変更</text><text x="443" y="301" font-size="14" font-weight="500" text-anchor="middle" fill="#203040">確定した予約だけ変更可能</text><text x="158" y="286" font-size="14" font-weight="500" text-anchor="middle" fill="#203040">変更申請は確認待ちへ戻る</text><text x="158" y="307" font-size="13" font-weight="500" text-anchor="middle" fill="#203040">自動承認はありません</text></g></svg>
