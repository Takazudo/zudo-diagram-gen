<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは予約確定ではない。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認はない。</desc><g font-family="'Noto Sans CJK JP', sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><rect x="32" y="69" width="104" height="82" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M32 92H136M56 63V76M112 63V76M52 112H83M52 128H98" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="185" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">申請</text><rect x="268" y="69" width="104" height="82" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M268 92H372M292 63V76M348 63V76M288 112H319M288 128H334" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="185" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">確認待ち</text><rect x="504" y="69" width="104" height="82" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M504 92H608M528 63V76M584 63V76M524 112H555M524 128H570" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="185" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">確定</text><path d="M61 121h24" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="127" r="12" fill="none" stroke="#203040" stroke-width="1.6"/><path d="M340 120V127L346 131" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M566 125l6 6 13-15" fill="none" stroke="#267D75" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M151 110H246" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M239 104L246 110L239 116" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M387 110H482" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 104L482 110L475 116" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="213" font-size="15" fill="#203040" text-anchor="middle" font-weight="400">予約確定ではない</text><circle cx="556" cy="235" r="3.5" fill="#267D75"/><path d="M556 236V269Q556 280 544 280H332Q320 280 320 268V233" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M314 240L320 233L326 240" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="435" y="263" font-size="17" fill="#267D75" text-anchor="middle" font-weight="400">日時を変更</text><text x="435" y="305" font-size="14" fill="#203040" text-anchor="middle" font-weight="400">確定した予約のみ・変更は確認待ちへ</text></g></svg>
