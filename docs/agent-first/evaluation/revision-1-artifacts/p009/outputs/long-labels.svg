<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合だけ準備担当へ戻す。確認完了の場合は当日受付と案内の担当へ渡す。</desc><g font-family="'Noto Sans CJK JP', sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><rect x="150" y="20" width="300" height="70" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="300" y="49" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">地域交流イベント</text><text x="300" y="74" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">開催準備担当</text><rect x="150" y="140" width="300" height="70" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="300" y="169" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">参加申込内容の</text><text x="300" y="194" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">確認・連絡担当</text><rect x="150" y="278" width="300" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="300" y="314" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">当日受付と案内の担当</text><path d="M300 91V129" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 122L300 129L306 122" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 211V267" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 260L300 267L306 260" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="357" y="250" font-size="16" fill="#267D75" text-anchor="middle" font-weight="400">確認完了</text><path d="M149 175H38V55H139" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 49L139 55L132 61" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="112" font-size="15" fill="#B85A18" text-anchor="middle" font-weight="400">不足項目あり</text><circle cx="300" cy="230" r="3.5" fill="#267D75"/></g></svg>
