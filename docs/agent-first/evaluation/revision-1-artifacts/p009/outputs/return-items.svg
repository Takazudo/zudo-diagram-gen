<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら返却箱、破損ありなら相談窓口へ。返却箱は現在空で、空でも返却に使える。</desc><g font-family="'Noto Sans CJK JP', sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><path d="M137 79V28H183V79M146 79V37H174V79M165 59h1" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="107" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">入口</text><path d="M160 119V145" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 138L160 145L166 138" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M107 158H213V173H107ZM118 173V196M202 173V196" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="220" font-size="20" fill="#203040" text-anchor="middle" font-weight="400">返却確認台</text><path d="M160 233V244H80V288M160 244H240V288" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 281L80 288L86 281" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M234 281L240 288L246 281" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 244H240V288" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="244" r="3.5" fill="#267D75"/><text x="71" y="273" font-size="17" fill="#203040" text-anchor="end" font-weight="400">破損なし</text><text x="249" y="273" font-size="17" fill="#B85A18" text-anchor="start" font-weight="400">破損あり</text><path d="M37 317L47 304H113L123 317M37 317H123V379H37ZM47 330H113" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" str