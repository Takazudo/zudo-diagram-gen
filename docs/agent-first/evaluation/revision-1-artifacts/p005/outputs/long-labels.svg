<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合だけ準備担当へ戻す。確認完了し不足がなければ当日受付と案内の担当へ渡す。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="29" font-size="20" fill="#203040" text-anchor="start" font-weight="500">長いラベルの担当引継ぎ</text><rect x="116" y="49" width="328" height="61" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="280" y="73" font-size="18" fill="#203040" text-anchor="middle"><tspan x="280" dy="0">地域交流イベント</tspan><tspan x="280" dy="24">開催準備担当</tspan></text><rect x="116" y="151" width="328" height="61" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="280" y="175" font-size="18" fill="#203040" text-anchor="middle"><tspan x="280" dy="0">参加申込内容の</tspan><tspan x="280" dy="24">確認・連絡担当</tspan></text><rect x="116" y="279" width="328" height="57" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="280" y="314" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">当日受付と案内の担当</text><path d="M280 110 V144" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M280 212 V272" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="295" y="249" font-size="16" fill="#267D75" text-anchor="start" font-weight="400">確認完了</text><circle cx="280" cy="232" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><path d="M116 181 H35 Q27 181 27 173 V88 Q27 80 35 80 H109" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="44" y="134" font-size="15" fill="#B85A18" text-anchor="start" font-weight="400">不足項目あり</text></svg>
