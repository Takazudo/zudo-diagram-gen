<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ進む。破損なしは現在空で利用可能な返却箱へ、破損ありは相談窓口へ進む。罰金や返却拒否の意味はない。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><text x="20" y="32" font-size="20" fill="#203040" text-anchor="start" font-weight="500">返却場所への案内</text><rect x="101" y="57" width="118" height="53" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="90" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">入口</text><path d="M160 110 V151" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><rect x="65" y="158" width="190" height="62" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="195" font-size="20" fill="#203040" text-anchor="middle" 