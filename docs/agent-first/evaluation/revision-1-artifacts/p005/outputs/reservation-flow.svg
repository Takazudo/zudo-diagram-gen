<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。確認待ちは予約確定ではない。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認はない。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="31" font-size="20" fill="#203040" text-anchor="start" font-weight="500">予約の確定と変更</text><rect x="24" y="75" width="144" height="101" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="96" y="145" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">申請</text><rect x="248" y="75" width="144" height="101" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="320" y="145" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">確認待ち</text><rect x="472" y="75" width="144" height="101" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="544" y="145" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">確定</text><path d="M72 96 H105 V114 H72 Z M78 102 H99 M78 108 H94" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="108" r="12" fill="none" stroke="#708090" stroke-width="1.6"/><path d="M320 100 V108 L324 111" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M537 109 l5 5 l10 -12" fill="none" stroke="#267D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 126 H241" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M392 126 H465" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><circle cx="433" cy="126" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><text x="320" y="58" font-size="15" fill="#203040" text-anchor="middle" font-weight="400">予約確定ではない</text><path d="M544 176 V245 Q544 253 536 253 H328 Q320 253 320 245 V183" fill="none" stroke="#174C66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="402" y="229" width="141" height="43" rx="4" fill="#FFFFFF" stroke="#174C66" stroke-width="1.6"/><text x="472.5" y="256" font-size="17" fill="#174C66" text-anchor="middle" font-weight="400">日時を変更</text><text x="24" y="301" font-size="15" fill="#203040" text-anchor="start" font-weight="400">確定した予約だけ変更可。変更申請は確認待ちへ戻る。</text></svg>
