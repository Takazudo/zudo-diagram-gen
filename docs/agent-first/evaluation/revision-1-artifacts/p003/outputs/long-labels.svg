<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡します。不足項目ありの場合は準備担当へ戻し、確認完了の場合は当日受付と案内の担当へ渡します。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><rect x="6" y="6" width="468" height="348" fill="#708090" opacity=".06"/><text x="22" y="32" font-size="20" font-weight="700" fill="#203040" text-anchor="start">長いラベルの担当引継ぎ</text><g transform="rotate(-1 295.0 86.0)"><rect x="144" y="60" width="310" height="62" fill="#708090" opacity=".19"/><rect x="140" y="55" width="310" height="62" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M150 66H440" stroke="#174C66" stroke-width="4"/><path d="M426 116L449 93V116Z" fill="#174C66" opacity=".12"/></g><text x="295" y="92" font-size="18" font-weight="700" fill="#174C66" text-anchor="middle">地域交流イベント開催準備担当</text><g transform="rotate(1 295.0 193.0)"><rect x="144" y="167" width="310" height="62" fill="#708090" opacity=".19"/><rect x="140" y="162" width="310" height="62" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M150 173H440" stroke="#174C66" stroke-width="4"/><path d="M426 223L449 200V223Z" fill="#174C66" opacity=".12"/></g><text x="295" y="199" font-size="18" font-weight="700" fill="#174C66" text-anchor="middle">参加申込内容の確認・連絡担当</text><g transform="rotate(-1 295.0 314.0)"><rect x="144" y="288" width="310" height="62" fill="#708090" opacity=".19"/><rect x="140" y="283" width="310" height="62" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M150 294H440" stroke="#267D75" stroke-width="4"/><path d="M426 344L449 321V344Z" fill="#267D75" opacity=".12"/></g><text x="295" y="320" font-size="18" font-weight="700" fill="#267D75" text-anchor="middle">当日受付と案内の担当</text><path d="M295 122V153" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="319" y="143" font-size="15" font-weight="400" fill="#203040" text-anchor="start">資料</text><path d="M295 230V274" fill="none" stroke="#267D75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#acc)"/><text x="312" y="258" font-size="17" font-weight="700" fill="#267D75" text-anchor="start">確認完了</text><path d="M133 194H36V86H131" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warn)"/><rect x="15" y="128" width="115" height="33" fill="#FFFFFF"/><text x="72.5" y="151" font-size="17" font-weight="700" fill="#B85A18" text-anchor="middle">不足項目あり</text></g></svg>
