<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは予約確定ではありません。日時を変更できるのは確定した予約だけで、変更申請は確認待ちに戻ります。自動承認はありません。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><rect x="6" y="6" width="628" height="308" fill="#708090" opacity=".06"/><text x="24" y="35" font-size="20" font-weight="700" fill="#203040" text-anchor="start">予約の確定と変更</text><g transform="rotate(-2 97.5 122.0)"><rect x="29" y="75" width="145" height="104" fill="#708090" opacity=".19"/><rect x="25" y="70" width="145" height="104" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M35 81H160" stroke="#174C66" stroke-width="4"/><path d="M146 173L169 150V173Z" fill="#174C66" opacity=".12"/></g><text x="97.5" y="124" font-size="23" font-weight="700" fill="#174C66" text-anchor="middle">申請</text><g transform="rotate(1.5 317.5 122.0)"><rect x="249" y="75" width="145" height="104" fill="#708090" opacity=".19"/><rect x="245" y="70" width="145" height="104" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M255 81H380" stroke="#174C66" stroke-width="4"/><path d="M366 173L389 150V173Z" fill="#174C66" opacity=".12"/></g><text x="317.5" y="124" font-size="23" font-weight="700" fill="#174C66" text-anchor="middle">確認待ち</text><g transform="rotate(-1.5 537.5 122.0)"><rect x="469" y="75" width="145" height="104" fill="#708090" opacity=".19"/><rect x="465" y="70" width="145" height="104" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M475 81H600" stroke="#267D75" stroke-width="4"/><path d="M586 173L609 150V173Z" fill="#267D75" opacity=".12"/></g><text x="537.5" y="124" font-size="23" font-weight="700" fill="#267D75" text-anchor="middle">確定</text><path d="M180 120H232" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M400 120H452" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="317.5" cy="151" r="9" fill="#FFFFFF" stroke="#174C66" stroke-width="1.8"/><path d="M317.5 146V151l4 2" fill="none" stroke="#174C66" stroke-width="1.8"/><path d="M530.5 152l5 5 10-12" fill="none" stroke="#267D75" stroke-width="2.5" stroke-linecap="round"/><text x="317.5" y="204" font-size="16" font-weight="500" fill="#174C66" text-anchor="middle">予約は未確定</text><text x="537.5" y="204" font-size="16" font-weight="500" fill="#267D75" text-anchor="middle">確定後のみ</text><path d="M538 218V267H318V224" fill="none" stroke="#267D75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#acc)"/><rect x="387" y="249" width="126" height="32" fill="#FFFFFF" stroke="#267D75"/><text x="450" y="271" font-size="18" font-weight="700" fill="#267D75" text-anchor="middle">日時を変更</text><text x="24" y="304" font-size="15" font-weight="400" fill="#203040" text-anchor="start">変更申請は確認待ちへ戻る。自動承認はありません。</text></g></svg>
