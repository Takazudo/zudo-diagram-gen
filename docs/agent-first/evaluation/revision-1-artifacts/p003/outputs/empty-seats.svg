<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席だけです。A席は予約済み、B席とC席は空席で選択可能。D席は保留中で選択不可です。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><rect x="6" y="6" width="348" height="228" fill="#708090" opacity=".06"/><text x="18" y="28" font-size="18" font-weight="700" fill="#203040" text-anchor="start">空席と保留中の席</text><g transform="rotate(-1.5 94.0 84.0)"><rect x="22" y="48" width="152" height="82" fill="#708090" opacity=".19"/><rect x="18" y="43" width="152" height="82" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M28 54H160" stroke="#174C66" stroke-width="4"/><path d="M146 124L169 101V124Z" fill="#174C66" opacity=".12"/></g><text x="94" y="78" font-size="17" font-weight="700" fill="#174C66" text-anchor="middle">A席：予約済み</text><text x="94" y="108" font-size="15" font-weight="500" fill="#174C66" text-anchor="middle">選択不可</text><path d="M30 103H43" stroke="#174C66" stroke-width="2"/><g transform="rotate(1.5 264.0 84.0)"><rect x="192" y="48" width="152" height="82" fill="#708090" opacity=".19"/><rect x="188" y="43" width="152" height="82" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M198 54H330" stroke="#267D75" stroke-width="4"/><path d="M316 124L339 101V124Z" fill="#267D75" opacity=".12"/></g><text x="264" y="78" f