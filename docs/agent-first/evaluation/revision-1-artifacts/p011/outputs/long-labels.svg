<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title description"><title id="title">長いラベルの担当引継ぎ</title><desc id="description">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ。不足項目ありの場合は準備担当へ戻し、確認完了の場合は当日受付と案内の担当へ渡す。</desc><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" fill="#203040"><rect width="480" height="360" fill="#FFFFFF"/><rect x="8" y="8" width="464" height="344" fill="#708090" opacity=".08"/><g transform="rotate(-1.5 295.0 58.5)"><rect x="159" y="25" width="282" height="77" fill="#708090" opacity=".25"/><rect x="154" y="20" width="282" height="77" fill="#FFFFFF"/><path d="M154 20h282v6h-282Z" fill="#174C66"/></g><g transform="rotate(1.5 295.0 173.5)"><rect x="159" y="140" width="282" height="77" fill="#708090" opacity=".25"/><rect x="154" y="135" width="282" height="77" fill="#FFFFFF"/><path d="M154 135h282v6h-282Z" fill="#174C66"/></g><g transform="rotate(-1.5 295.0 306.5)"><rect x="159" y="279" width="282" height="65" fill="#708090" opacity=".25"/><rect x="154" y="274" width="282" height="65" fill="#FFFFFF"/><path d="M154 274h282v6h-282Z" fill="#267D75"/></g><text x="295" y="50" font-size="19" text-anchor="middle" font-weight="600"><tspan x="295" dy="0">地域交流イベント</tspan><tspan x="295" dy="25">開催準備担当</tspan></text><text x="295" y="165" font-size="19" text-anchor="middle" font-weight="600"><tspan x="295" dy="0">参加申込内容の</tspan><tspan x="295" dy="25">確認・連絡担当</tspan></text><text x="295" y="312" font-size="19" fill="#203040" text-anchor="middle" font-weight="600">当日受付と案内の担当</text><path d="M295 100C291 111 291 118 295 128" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M151 174H46V59H147" fill="none" stroke="#B85A18" stroke-width="2.1" marker-end="url(#warning-arrow)"/><text x="84" y="120" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="600">不足項目あり</text><path d="M295 216C292 233 292 250 295 267" fill="none" stroke="#267D75" stroke-width="2.1" marker-end="url(#accent-arrow)"/><text x="365" y="245" font-size="17" fill="#267D75" text-anchor="middle" font-weight="600">確認完了</text></g></svg>
