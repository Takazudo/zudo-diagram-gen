<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title description"><title id="title">返却場所への案内</title><desc id="description">入口から返却確認台へ。破損なしなら現在空で利用可能な返却箱へ、破損ありなら相談窓口へ。</desc><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" fill="#203040"><rect width="320" height="480" fill="#FFFFFF"/><rect x="8" y="8" width="304" height="464" fill="#708090" opacity=".08"/><g transform="rotate(-2 159.5 56.0)"><rect x="91" y="28" width="147" height="66" fill="#708090" opacity=".25"/><rect x="86" y="23" width="147" height="66" fill="#FFFFFF"/><path d="M86 23h147v6h-147Z" fill="#174C66"/></g><text x="159" y="64" font-size="22" fill="#203040" text-anchor="middle" font-weight="600">入口</text><g transform="rotate(2 159.0 172.5)"><rect x="67" y="136" width="194" height="83" fill="#708090" opacity=".25"/><rect x="62" y="131" width="194" height="83" fill="#FFFFFF"/><path d="M62 131h194v6h-194Z" fill="#174C66"/></g><text x="159" y="180" font-size="23" fill="#203040" text-anchor="middle" font-weight="600">返却確認台</text><path d="M159 94C153 105 153 115 159 123" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M159 219V252H30V298" fill="none" stroke="#267D75" stroke-width="2.1" marker-end="url(#accent-arrow)"/><path d="M159 252H291V298" fill="none" stroke="#B85A18" stroke-width="2.1" marker-end="url(#warning-arrow)"/><text x="78" y="281" font-size="17" fill="#267D75" text-anchor="middle" font-weight="600">破損なし</text><text x="245" y="281" font-size="17" fill="#B85A18" text-anchor="middle" font-weight="600">破損あり</text><g transform="rotate(-2 82.5 380.5)"><rect x="22" y="313" width="131" height="145" fill="#708090" opacity=".25"/><rect x="17" y="308" width="131" height="145" fill="#FFFFFF"/><path d="M17 308h131v6h-131Z" fill="#267D75"/></g><g transform="rotate(2 240.0 360.0)"><rect x="183" y="313" width="124" height="104" fill="#708090" opacity=".25"/><rect x="178" y="308" width="124" height="104" fill="#FFFFFF"/><path d="M178 308h124v6h-124Z" fill="#B85A18"/></g><text x="82" y="340" font-size="19" fill="#203040" text-anchor="middle" font-weight="600">返却箱：空</text><text x="240" y="347" font-size="19" fill="#203040" text-anchor="middle" font-weight="600">相談窓口</text><g><path d="M48 366L107 363L116 409L43 413Z" fill="#708090" opacity=".25" transform="translate(4 4)"/><path d="M48 366L107 363L116 409L43 413Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M44 365L109 361L113 371L47 376Z" fill="#267D75"/><path d="M56 367L98 364" stroke="#FFFFFF" stroke-width="3"/></g><text x="82" y="438" font-size="13" fill="#267D75" text-anchor="middle" font-weight="600">空でも返却に使える</text><path d="M211 366l59-3v24l-59 4Z" fill="#B85A18"/><path d="M220 375h39" stroke="#FFFFFF" stroke-width="2"/></g></svg>
