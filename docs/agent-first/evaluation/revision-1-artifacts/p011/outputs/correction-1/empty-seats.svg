<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title description"><title id="title">空席と保留中の席</title><desc id="description">四席。A席は予約済み、B席とC席は空席で選択可。D席は保留中で選択不可。</desc><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" fill="#203040"><rect width="360" height="240" fill="#FFFFFF"/><rect x="8" y="8" width="344" height="224" fill="#708090" opacity=".08"/><g transform="rotate(-2 90.5 61.5)"><rect x="23" y="21" width="145" height="91" fill="#708090" opacity=".25"/><rect x="18" y="16" width="145" height="91" fill="#FFFFFF"/><path d="M18 16h145v6h-145Z" fill="#174C66"/></g><text x="90" y="42" font-size="16" fill="#203040" text-anchor="middle" font-weight="600">A席：予約済み</text><g transform="translate(33 52)"><path d="M8 2L32 0l2 20-25 2ZM3 27l35-3 2 8L4 36ZM8 36h5v10H8ZM31 34h5v10h-5Z" fill="#708090" opacity=".25" transform="translate(3 3)"/><path d="M8 2L32 0l2 20-25 2Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M3 27l35-3 2 8L4 36Z" fill="#174C66"/><path d="M8 36h5v10H8ZM31 34h5v10h-5Z" fill="#203040"/></g><text x="121" y="87" font-size="13" fill="#174C66" text-anchor="middle" font-weight="600">選択不可</text><g transform="translate(92 5