<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title description"><title id="title">予約の確定と変更</title><desc id="description">申請から確認待ち、確定へ。確認待ちは未確定。確定した予約の日時を変更すると確認待ちへ戻る。自動承認なし。</desc><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" fill="#203040"><rect width="640" height="320" fill="#FFFFFF"/><rect x="8" y="8" width="624" height="304" fill="#708090" opacity=".08"/><g transform="rotate(-2 110.0 121.0)"><rect x="31" y="59" width="168" height="134" fill="#708090" opacity=".25"/><rect x="26" y="54" width="168" height="134" fill="#FFFFFF"/><path d="M26 54h168v6h-168Z" fill="#174C66"/></g><text x="110" y="92" font-size="24" fill="#203040" text-anchor="middle" font-weight="600">申請</text><g transform="rotate(2 319.0 121.0)"><rect x="240" y="59" width="168" height="134" fill="#708090" opacity=".25"/><rect x="235" y="54" width="168" height="134" fill="#FFFFFF"/><path d="M235 54h168v6h-168Z" fill="#174C66"/></g><text x="319" y="92" font-size="24" fill="#203040" text-anchor="middle" font-weight="600">確認待ち</text><g transform="rotate(-2 528.0 121.0)"><rect x="449" y="59" width="168" height="134" fill="#708090" opacity=".25"/><rect x="444" y="54" width="168" height="134" fill="#FFFFFF"/><path d="M444 54h168v6h-168Z" fill="#267D75"/></g><text x="528" y="92" font-size="24" fill="#203040" text-anchor="middle" font-weight="600">確定</text><path d="M85 119h44v42H85Z" fill="#174C66"/><path d="M93 131h28m-28 10h28m-28 10h19" stroke="#FFFFFF" stroke-width="2"/><g transform="translate(299 117) scale(1)"><circle cx="20" cy="20" r="18" fill="#708090" opacity=".25" transform="translate(3 3)"/><circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M19 8h3v11l9 7-2 3-10-8Z" fill="#174C66"/></g><g transform="translate(508 118) scale(1)"><path d="M3 19l7-6 9 9L34 3l7 6-22 29Z" fill="#708090" opacity=".25" transform="translate(3 3)"/><path d="M3 19l7-6 9 9L34 3l7 6-22 29Z" fill="#267D75"/></g><path d="M198 119C209 116 218 116 228 119" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M407 119C418 116 427 116 437 119" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#ink-arrow)"/><text x="319" y="178" font-size="15" fill="#B85A18" text-anchor="middle" font-weight="600">確認待ちは未確定</text><path d="M528 190V248H319V196" fill="none" stroke="#267D75" stroke-width="2.1" marker-end="url(#accent-arrow)"/><text x="434" y="273" font-size="19" fill="#267D75" text-anchor="middle" font-weight="600">日時を変更</text><text x="434" y="295" font-size="14" fill="#203040" text-anchor="middle" font-weight="600">変更申請・自動承認なし</text></g></svg>
