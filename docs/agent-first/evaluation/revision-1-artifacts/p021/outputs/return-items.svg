<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" style="font-family: Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしは返却箱へ、破損ありは相談窓口へ進む。返却箱は現在空で、空でも返却に使える。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><rect x="100" y="24" width="120" height="56" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="70" y="138" width="180" height="64" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="18" y="328" width="140" height="104" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><rect x="182" y="328" width="120" height="104" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><text x="160" y="59" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">入口</text><text x="160" y="178" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">返却確認台</text><text x="88" y="366" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">返却箱：空</text><text x="88" y="401" font-size="15" fill="#267D75" text-anchor="middle" font-weight="400">返却に使える</text><text x="242" y="383" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">相談窓口</text><path d="M160 80V138" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M160 202V242" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="242" r="4" fill="#267D75"/><path d="M160 242H100Q88 242 88 254V328" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M160 242H230Q242 242 242 254V328" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="88" y="229" font-size="16" fill="#267D75" text-anchor="middle" font-weight="400">破損なし</text><text x="242" y="229" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="400">破損あり</text></svg>
