<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" style="font-family: Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ進む。確認待ちは予約確定ではない。確定した予約のみ日時を変更でき、変更申請は確認待ちへ戻る。自動承認はない。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><text x="32" y="34" font-size="20" fill="#203040" text-anchor="start" font-weight="400">予約の確定と変更</text><rect x="32" y="82" width="160" height="94" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="240" y="82" width="160" height="94" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><rect x="448" y="82" width="160" height="94" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="112" y="137" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">申請</text><text x="320" y="119" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">確認待ち</text><text x="320" y="151" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">予約確定ではない</text><text x="528" y="137" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">確定</text><path d="M192 129H240" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M400 129H448" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><circle cx="432" cy="129" r="4" fill="#267D75"/><path d="M528 176V238Q528 246 520 246H328Q320 246 320 238V178" fill="none" stroke="#174C66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><text x="424" y="231" font-size="18" fill="#174C66" text-anchor="middle" font-weight="400">日時を変更</text><text x="32" y="286" font-size="15" fill="#203040" text-anchor="start" font-weight="400">確定した予約のみ変更可・自動承認なし</text></svg>
