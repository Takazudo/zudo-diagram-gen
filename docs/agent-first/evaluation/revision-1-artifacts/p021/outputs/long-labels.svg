<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" style="font-family: Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻し、確認完了の場合は当日受付と案内の担当へ渡す。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><rect x="142" y="22" width="312" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="142" y="146" width="312" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="142" y="282" width="312" height="60" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="298" y="52" font-size="19" fill="#203040" text-anchor="middle"><tspan x="298" dy="0">地域交流イベント</tspan><tspan x="298" dy="26">開催準備担当</tspan></text><text x="298" y="176" font-size="19" fill="#203040" text-anchor="middle"><tspan x="298" dy="0">参加申込内容の</tspan><tspan x="298" dy="26">確認・連絡担当</tspan></text><text x="298" y="319" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">当日受付と案内の担当</text><path d="M298 96V146" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M298 220V282" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><circle cx="298" cy="256" r="4" fill="#267D75"/><text x="313" y="253" font-size="15" fill="#267D75" text-anchor="start" font-weight="400">確認完了</text><path d="M142 183H48Q36 183 36 171V71Q36 59 48 59H142" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="82" y="118" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">不足項目あり</text></svg>
