<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc" style="font-family: Noto Sans CJK JP, sans-serif"><title id="title">空席と保留中の席</title><desc id="desc">四席のみ。A席は予約済み、B席とC席は空席で選択可。D席は保留中で選択不可。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#708090" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="360" height="240" fill="#FFFFFF"/><rect x="16" y="18" width="156" height="82" rx="4" fill="#FFFFFF" stroke="#174C66" stroke-width="1.6"/><rect x="188" y="18" width="156" height="82" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><rect x="16" y="126" width="156" height="82" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><rect x="188" y="126" width="156" height="82" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><text x="94" y="50" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">A席：予約済み</text><text x="94" y="80" font-size="14" fill="#174C66" text-anchor="middle" font-weight="400">選択不可</text><text x="266" y="50" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">B席：空席</text><text x="266" y="80" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可</text><text x="94" y="158" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">C席：空席</text><text x="94" y="188" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可</text><text x="266" y="158" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">D席：保留中</text><text x="266" y="188" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">選択不可</text><circle cx="23" cy="228" r="4" fill="#267D75"/><text x="38" y="233" font-size="14" fill="#203040" text-anchor="start" font-weight="400">選べる席はB席とC席だけ</text></svg>
