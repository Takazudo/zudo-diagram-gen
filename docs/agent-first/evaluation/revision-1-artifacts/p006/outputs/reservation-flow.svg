<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="reservation-flow-title reservation-flow-desc" lang="ja"><title id="reservation-flow-title">予約の確定と変更</title><desc id="reservation-flow-desc">申請、確認待ち、確定の順。確認待ちは予約未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認なし。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="640" height="320" rx="0" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="28" y="32" text-anchor="start" font-size="22" font-weight="600" fill="#203040" data-role="ink">予約の確定と変更</text><path d="M190 116 H230" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="219,108 230,116 219,124" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><path d="M390 116 H440" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="429,108 440,116 429,124" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><rect x="30" y="64" width="160" height="112" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><text x="110" y="111" text-anchor="middle" font-size="23" font-weight="600" fill="#203040" data-role="ink">申請</text><text x="110" y="145" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">予約を申し込む</text><rect x="230" y="64" width="160" height="112" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><circle cx="310" cy="90" r="13" fill="#174C66" fill-opacity=".16" data-role="deep"/><path d="M310 83 V90 L315 93" fill="none" stroke="#203040" stroke-width="2.5" stroke-linecap="round" data-role="ink"/><text x="310" y="126" text-anchor="middle" font-size="22" font-weight="600" fill="#203040" data-role="ink">確認待ち</text><text x="310" y="153" text-anchor="middle" font-size="15" font-weight="400" fill="#203040" data-role="ink">予約未確定</text><rect x="440" y="64" width="170" height="112" rx="24" fill="#267D75" fill-opacity="0.14" data-role="accent"/><circle cx="525" cy="88" r="13" fill="#267D75" data-role="accent"/><path d="M519 88 l4 4 8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-role="surface"/><text x="525" y="121" text-anchor="middle" font-size="22" font-weight="600" fill="#203040" data-role="ink">確定</text><rect x="454" y="134" width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="525" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#203040" data-role="ink">日時を変更</text><path d="M525 176 V212 Q525 238 499 238 H336 Q310 238 310 212 V183" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="302,189 310,178 318,189" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><text x="414" y="266" text-anchor="middle" font-size="17" font-weight="600" fill="#203040" data-role="ink">変更申請 → 確認待ち</text><rect x="186" y="282" width="268" height="28" rx="14" fill="#B85A18" fill-opacity="0.1" data-role="warning"/><text x="320" y="302" text-anchor="middle" font-size="15" font-weight="600" fill="#B85A18" data-role="warning">自動承認なし</text></g></svg>
