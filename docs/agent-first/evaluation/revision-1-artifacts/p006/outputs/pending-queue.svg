le cx="247" cy="53" r="13" fill="#267D75" data-role="accent"/><path d="M241 53 l4 4 8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-role="surface"/><text x="346" y="60" text-anchor="middle" font-size="18" font-weight="600" fill="#203040" data-role="ink">表記確認：完了</text><text x="347" y="86" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">確認済み</text><rect x="222" y="133" width="250" height="85" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><circle cx="247" cy="160" r="13" fill="#174C66" fill-opacity=".16" data-role="deep"/><path d="M247 153 V160 L252 163" fill="none" stroke="#203040" stroke-width="2.5" stroke-linecap="round" data-role="ink"/><text x="359" y="167" text-anchor="middle" font-size="17" font-weight="600" fill="#203040" data-role="ink">会場情報確認：結果待ち</text><text x="347" y="194" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">結果は未到着</text><rect x="540" y="69" width="160" height="106" rx="24" fill="#267D75" fill-opacity="0.12" data-role="accent"/><text x="620" y="105" text-anchor="middle" font-size="16" font-weight="600" fill="#203040" data-role="ink">両方完了後に公開</text><rect x="554" y="124" width="132" height="34" rx="17" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="620" y="147" text-anchor="middle" font-size="18" font-weight="600" fill="#203040" data-role="ink">公開済み：0</text></g></svg>
