<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="return-items-title return-items-desc" lang="ja"><title id="return-items-title">返却場所への案内</title><desc id="return-items-desc">入口から返却確認台へ。破損なしなら返却箱、破損ありなら相談窓口へ進む。返却箱は現在空でも返却に使える。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="320" height="480" rx="0" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><rect x="98" y="20" width="124" height="60" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><text x="160" y="58" text-anchor="middle" font-size="22" font-weight="600" fill="#203040" data-role="ink">入口</text><path d="M160 80 V121" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="152,110 160,121 168,110" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><rect x="60" y="122" width="200" height="72" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><text x="160" y="166" text-anchor="middle" font-size="22" font-weight="600" fill="#203040" data-role="ink">返却確認台</text><path d="M160 194 V216 Q160 230 144 230 H85 V295" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="77,284 85,295 93,284" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><path d="M160 194 V216 Q160 230 176 230 H241 V295" fill="none" stroke="#B85A18" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="warning"/><polygon points="233,284 241,295 249,284" fill="#B85A18" fill-opacity="0.45" stroke-linejoin="round" data-role="warning"/><rect x="26" y="248" width="118" height="31" rx="15" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="85" y="270" text-anchor="middle" font-size="17" font-weight="600" fill="#203040" data-role="ink">破損なし</text><rect x="186" y="248" width="110" height="31" rx="15" fill="#B85A18" fill-opacity="0.12" data-role="warning"/><text x="241" y="270" text-anchor="middle" font-size="17" font-weight="600" fill="#B85A18" data-role="warning">破損あり</text><rect x="16" y="296" width="139" height="150" rx="24" fill="#267D75" fill-opacity="0.13" data-role="accent"/><rect x="174" y="296" width="130" height="150" rx="24" fill="#B85A18" fill-opacity="0.1" data-role="warning"/><rect x="50" y="317" width="70" height="50" rx="9" fill="#267D75" fill-opacity="0.7" data-role="accent"/><rect x="54" y="321" width="62" height="13" rx="5" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="85" y="397" text-anchor="middle" font-size="19" font-weight="600" fill="#203040" data-role="ink">返却箱：空</text><text x="85" y="426" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">返却に使える</text><path d="M239 327 Q241 327 243 331 L253 350 Q255 354 250 354 H228 Q223 354 225 350 L235 331 Q237 327 239 327" fill="#B85A18" data-role="warning"/><path d="M239 335 v8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" data-role="surface"/><circle cx="239" cy="348" r="1.5" fill="#FFFFFF" data-role="surface"/><text x="239" y="397" text-anchor="middle" font-size="20" font-weight="600" fill="#203040" data-role="ink">相談窓口</text></g></svg>
