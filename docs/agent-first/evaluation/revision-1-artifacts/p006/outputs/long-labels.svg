<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="long-labels-title long-labels-desc" lang="ja"><title id="long-labels-title">長いラベルの担当引継ぎ</title><desc id="long-labels-desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありなら準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="480" height="360" rx="0" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><path d="M314 94 V137" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="306,126 314,137 322,126" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><path d="M314 214 V283" fill="none" stroke="#174C66" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="deep"/><polygon points="306,272 314,283 322,272" fill="#174C66" fill-opacity="0.45" stroke-linejoin="round" data-role="deep"/><path d="M166 176 H57 Q35 176 35 154 V80 Q35 58 57 58 H158" fill="none" stroke="#B85A18" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" data-role="warning"/><polygon points="155,50 166,58 155,66" fill="#B85A18" fill-opacity="0.45" stroke-linejoin="round" data-role="warning"/><rect x="166" y="20" width="294" height="74" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><text x="313" y="50" text-anchor="middle" font-size="18" font-weight="600" fill="#203040" data-role="ink">地域交流イベント開催準備担当</text><text x="313" y="77" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">資料を渡す</text><rect x="166" y="138" width="294" height="76" rx="24" fill="#174C66" fill-opacity="0.1" data-role="deep"/><text x="313" y="169" text-anchor="middle" font-size="18" font-weight="600" fill="#203040" data-role="ink">参加申込内容の確認・連絡担当</text><text x="313" y="197" text-anchor="middle" font-size="14" font-weight="400" fill="#203040" data-role="ink">不足項目を確認</text><rect x="166" y="284" width="294" height="60" rx="24" fill="#267D75" fill-opacity="0.14" data-role="accent"/><text x="313" y="320" text-anchor="middle" font-size="19" font-weight="600" fill="#203040" data-role="ink">当日受付と案内の担当</text><rect x="16" y="107" width="136" height="31" rx="15" fill="#B85A18" fill-opacity="0.12" data-role="warning"/><text x="84" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#B85A18" data-role="warning">不足項目あり</text><rect x="334" y="233" width="118" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" data-role="surface"/><text x="393" y="255" text-anchor="middle" font-size="17" font-weight="600" fill="#203040" data-role="ink">確認完了</text></g></svg>
