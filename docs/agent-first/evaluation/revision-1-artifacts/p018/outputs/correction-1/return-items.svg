<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしは返却箱へ、破損ありは相談窓口へ。返却箱は現在空で返却に使える。</desc><defs><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#174C66" fill-opacity=".65"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#267D75" fill-opacity=".65"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#B85A18" fill-opacity=".65"/></marker></defs><rect x="0" y="0" width="320" height="480" rx="0" fill="#FFFFFF" fill-opacity="1"/><path d="M160 90 V125" fill="none" stroke="#174C66" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M160 197 V221 Q160 238 143 238 H92 Q75 238 75 255 V295" fill="none" stroke="#267D75" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M160 221 Q160 238 177 238 H228 Q245 238 245 255 V295" fill="none" stroke="#B85A18" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="85" y="25" width="150" height="65" rx="24" fill="#174C66" fill-opacity="0.1"/><text x="160" y="66" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">入口</text><rect x="50" y="132" width="220" height="65" rx="24" fill="#174C66" fill-opacity="0.13"/><text x="160" y="173" font-size="23" font-weight="600" text-anchor="middle" fill="#203040">返却確認台</text><rect x="25" y="249" width="100" height="30" rx="15" fill="#FFFFFF" fill-opacity="1"/><text x="75" y="270" font-size="17" font-weight="600" text-anchor="middle" fill="#203040">破損なし</text><rect x="195" y="249" width="100" height="30" rx="15" fill="#FFFFFF"/><rect x="195" y="249" width="100" height="30" rx="15" fill="#B85A18" fill-opacity="0.12"/><text x="245" y="270" font-size="17" font-weight="600" text-anchor="middle" fill="#B85A18">破損あり</text><rect x="16" y="302" width="142" height="137" rx="24" fill="#267D75" fill-opacity="0.14"/><rect x="174" y="302" width="130" height="137" rx="24" fill="#B85A18" fill-opacity="0.12"/><rect x="44" y="325" width="86" height="47" rx="12" fill="#267D75" fill-opacity="0.2"/><rect x="52" y="316" width="70" height="13" rx="6" fill="#267D75" fill-opacity="0.65"/><text x="87" y="398" font-size="19" font-weight="600" text-anchor="middle" fill="#203040">返却箱：空</text><text x="87" y="423" font-size="15" font-weight="500" text-anchor="middle" fill="#203040">返却に使える</text><path d="M239 323 Q240 319 244 325 L259 352 Q262 358 255 358 H225 Q218 358 221 352 Z" fill="#B85A18" fill-opacity=".25"/><text x="240" y="351" font-size="23" font-weight="600" text-anchor="middle" fill="#B85A18">!</text><text x="239" y="398" font-size="20" font-weight="600" text-anchor="middle" fill="#203040">相談窓口</text></svg>
