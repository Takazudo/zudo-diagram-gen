<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認なし。</desc><defs><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#174C66" fill-opacity=".65"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#267D75" fill-opacity=".65"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#B85A18" fill-opacity=".65"/></marker></defs><rect x="0" y="0" width="640" height="320" rx="0" fill="#FFFFFF" fill-opacity="1"/><path d="M190 119 H228" fill="none" stroke="#174C66" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M405 119 H443" fill="none" stroke="#174C66" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="20" y="74" width="170" height="90" rx="24" fill="#174C66" fill-opacity="0.1"/><rect x="235" y="74" width="170" height="90" rx="24" fill="#174C66" fill-opacity="0.15"/><rect x="450" y="74" width="170" height="90" rx="24" fill="#267D75" fill-opacity="0.15"/><text x="105" y="129" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">申請</text><text x="320" y="129" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">確認待ち</text><text x="535" y="129" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">確定</text><circle cx="320" cy="58" r="11" fill="#174C66" fill-opacity=".16"/><path d="M320 51.95 V58 L324.4 60.75" fill="none" stroke="#203040" stroke-width="2.4" stroke-linecap="round"/><circle cx="535" cy="58" r="13" fill="#267D75"/><path d="M529 58 l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="189" font-size="15" font-weight="500" text-anchor="middle" fill="#203040">予約は未確定</text><text x="535" y="189" font-size="15" font-weight="500" text-anchor="middle" fill="#203040">確定した予約だけ</text><path d="M535 207 V232 Q535 247 520 247 H335 Q320 247 320 232 V207" fill="none" stroke="#267D75" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><rect x="373" y="226" width="132" height="42" rx="21" fill="#FFFFFF" fill-opacity="1"/><text x="439" y="254" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">日時を変更</text><text x="320" y="299" font-size="15" font-weight="500" text-anchor="middle" fill="#203040">変更申請は確認待ちへ戻る・自動承認なし</text></svg>
