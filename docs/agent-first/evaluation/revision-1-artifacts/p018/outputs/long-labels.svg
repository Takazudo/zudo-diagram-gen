<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありなら準備担当へ戻し、確認完了なら当日受付と案内の担当へ渡す。</desc><defs><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#174C66" fill-opacity=".65"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#267D75" fill-opacity=".65"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2" markerHeight="2" orient="auto"><path d="M1 1 Q0 0 2 1 L9 5 L2 9 Q0 10 1 9 Z" fill="#B85A18" fill-opacity=".65"/></marker></defs><rect x="0" y="0" width="480" height="360" rx="0" fill="#FFFFFF" fill-opacity="1"/><path d="M295 90 V133" fill="none" stroke="#174C66" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M295 210 V268" fill="none" stroke="#267D75" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M140 175 H60 Q40 175 40 155 V75 Q40 55 60 55 H132" fill="none" stroke="#B85A18" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="140" y="20" width="310" height="70" rx="24" fill="#174C66" fill-opacity="0.1"/><rect x="140" y="140" width="310" height="70" rx="24" fill="#174C66" fill-opacity="0.13"/><rect x="140" y="275" width="310" height="65" rx="24" fill="#267D75" fill-opacity="0.16"/><text x="295" y="49" font-size="19" font-weight="600" text-anchor="middle" fill="#203040"><tspan x="295" dy="0">地域交流イベント</tspan><tspan x="295" dy="26">開催準備担当</tspan></text><text x="295" y="169" font-size="19" font-weight="600" text-anchor="middle" fill="#203040"><tspan x="295" dy="0">参加申込内容の</tspan><tspan x="295" dy="26">確認・連絡担当</tspan></text><text x="295" y="315" font-size="20" font-weight="600" text-anchor="middle" fill="#203040">当日受付と案内の担当</text><rect x="68" y="99" width="118" height="32" rx="16" fill="#FFFFFF" fill-opacity="1"/><text x="127" y="121" font-size="16" font-weight="600" text-anchor="middle" fill="#B85A18">不足項目あり</text><rect x="241" y="226" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="1"/><text x="295" y="247" font-size="16" font-weight="600" text-anchor="middle" fill="#203040">確認完了</text></svg>
