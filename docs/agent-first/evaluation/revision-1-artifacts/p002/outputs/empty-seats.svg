<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">空席と保留中の席</title><desc id="desc">四席のみ。A席は予約済み、B席とC席は空席で選択可能。D席は保留中で選択不可。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#174C66"/></marker><marker id="accent-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#267D75"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#B85A18"/></marker></defs><rect width="360" height="240" fill="#FFFFFF"/><text x="16" y="25" text-anchor="start" font-size="19" font-weight="600" fill="#203040">空席と保留中の席</text><rect x="12" y="39" width="162" height="90" rx="22" fill="#174C66" fill-opacity=".10"/><rect x="26" y="51" width="38" height="27" rx="12" fill="#174C66" fill-opacity=".23"/><rect x="19" y="85" width="52" height="10" rx="5" fill="#174C66" fill-opacity=".5"/><path d="M28 95V105M62 95V105" stroke="#174C66" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="64" r="7" fill="#203040"/><path d="M33 81Q33 73 45 73Q57 73 57 81Z" fill="#203040"/><text x="115" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#203040">A席：予約済み</text><text x="115" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#203040">選択不可</text><rect x="186" y="39" width="162" height="90" rx="22" fill="#174C66" fill-opacity=".10"/><rect x="200" y="51" width="38" height="27" rx="12" fill="#174C66" fill-opacity=".23"/><rect x="193" y="85" width="52" height="10" rx="5" fill="#174C66" fill-opacity=".5"/><path d="M202 95V105M236 95V105" stroke="#174C66" stroke-width="5" stroke-linecap="round"/><text x="289" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#203040">B席：空席</text><text x="289" y="101" text-anchor="middle" font-size="13" font-weight="400" fill="#203040">選択可能</text><rect x="12" y="139" width="162" height="90" rx="22" fill="#174C66" fill-opacity=".10"/><rect x="26" y="151" width="38" height="27" rx="12" fill="#174C66" fill-opacity=".23"/><rect x="19" y="185" width="52" height="10" rx="5" fill="#174C66" fill-opacity=".5"/><path d="M28 195V205M62 195V205" stroke="#174C66" stroke-width="5" stroke-linecap="round"/><text x="115" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#203040">C席：空席</text><text x="115" y="201" text-anchor="middle" font-size="13" font-weight="400" fill="#203040">選択可能</text><rect x="186" y="139" width="162" height="90" rx="22" fill="#174C66" fill-opacity=".10"/><rect x="200" y="151" width="38" height="27" rx="12" fill="#174C66" fill-opacity=".23"/><rect x="193" y="185" width="52" height="10" rx="5" fill="#174C66" fill-opacity=".5"/><path d="M202 195V205M236 195V205" stroke="#174C66" stroke-width="5" stroke-linecap="round"/><circle cx="219" cy="166" r="12" fill="#174C66" fill-opacity=".2"/><path d="M219 159.4V166L223.8 169.6" stroke="#203040" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="289" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#203040">D席：保留中</text><text x="289" y="201" text-anchor="middle" font-size="13" font-weight="400" fill="#203040">選択不可</text><rect x="94" y="222" width="172" height="16" rx="8" fill="#267D75" fill-opacity=".15"/><text x="180" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#203040">選べるのはB席・C席</text></svg>
