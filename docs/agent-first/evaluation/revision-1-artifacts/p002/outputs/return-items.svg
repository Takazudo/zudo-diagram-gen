<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ進む。破損なしは返却箱へ、破損ありは相談窓口へ進む。返却箱は現在空だが利用可能。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#174C66"/></marker><marker id="accent-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#267D75"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#B85A18"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><text x="160" y="30" text-anchor="middle" font-size="21" font-weight="600" fill="#203040">返却場所への案内</text><rect x="78" y="51" width="164" height="61" rx="24" fill="#174C66" fill-opacity=".12"/><text x="160" y="90" text-anchor="middle" font-size="24" font-weight="600" fill="#203040">入口</text><path d="M160 116V152" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="61" y="156" width="198" height="72" rx="24" fill="#174C66" fill-opacity=".12"/><text x="160" y="201" text-anchor="middle" font-size="23" font-weight="600" fill="#203040">返却確認台</text><path d="M160 232V250Q160 269 140 269H83V322" fill="none" stroke="#267D75" stroke-opacity=".55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M160 232V250Q160 269 180 269H240V322" fill="none" stroke="#B85A18" stroke-opacity=".6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="22" y="282" width="122" height="32" rx="16" fill="#267D75" fill-opacity=".13"/><text x="83" y="304" text-anchor="middle" font-size="17" font-weight="600" fill="#203040">破損なし</text><rect x="179" y="282" width="122" height="32" rx="16" fill="#B85A18" fill-opacity=".13"/><text x="240" y="304" text-anchor="middle" font-size="17" font-weight="600" fill="#203040">破損あり</text><rect x="15" y="329" width="139" height="128" rx="24" fill="#267D75" fill-opacity=".15"/><rect x="167" y="329" width="139" height="128" rx="24" fill="#B85A18" fill-opacity=".13"/><rect x="57" y="344" width="54" height="36" rx="10" fill="#174C66" fill-opacity=".22"/><rect x="64" y="349" width="40" height="11" rx="5" fill="#FFFFFF" fill-opacity="1"/><text x="84" y="410" text-anchor="middle" font-size="18" font-weight="600" fill="#203040">返却箱：空</text><text x="84" y="436" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">空でも利用可能</text><path d="M226 348Q226 343 231 343H248Q253 343 253 348V367Q253 372 248 372H239L231 379V372Q226 372 226 367Z" fill="#B85A18" fill-opacity=".3"/><text x="237" y="410" text-anchor="middle" font-size="20" font-weight="600" fill="#203040">相談窓口</text></svg>
