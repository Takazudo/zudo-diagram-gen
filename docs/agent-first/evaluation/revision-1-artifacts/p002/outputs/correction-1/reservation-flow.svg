<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認はない。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#174C66"/></marker><marker id="accent-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#267D75"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#B85A18"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="32" text-anchor="start" font-size="22" font-weight="600" fill="#203040">予約の確定と変更</text><path d="M186 120H223" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M406 120H443" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="24" y="70" width="162" height="106" rx="24" fill="#174C66" fill-opacity=".12"/><rect x="224" y="70" width="182" height="106" rx="24" fill="#174C66" fill-opacity=".12"/><rect x="444" y="70" width="172" height="106" rx="24" fill="#267D75" fill-opacity=".15"/><text x="105" y="117" text-anchor="middle" font-size="24" font-weight="600" fill="#203040">申請</text><text x="315" y="117" text-anchor="middle" font-size="24" font-weight="600" fill="#203040">確認待ち</text><text x="530" y="117" text-anchor="middle" font-size="24" font-weight="600" fill="#203040">確定</text><text x="105" y="146" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">予約を申請</text><text x="315" y="146" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">予約は未確定</text><path d="M522 148L528 154L540 140" stroke="#267D75" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="315" cy="87" r="12" fill="#174C66" fill-opacity=".2"/><path d="M315 80.4V87L319.8 90.6" stroke="#203040" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M530 176V227Q530 240 515 240H332Q315 240 315 225V182" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><rect x="351" y="190" width="142" height="38" rx="19" fill="#267D75" fill-opacity=".15"/><text x="422" y="215" text-anchor="middle" font-size="18" font-weight="600" fill="#203040">日時を変更</text><text x="315" y="286" text-anchor="middle" font-size="16" font-weight="400" fill="#203040">変更申請は確認待ちへ戻る・自動承認なし</text></svg>
