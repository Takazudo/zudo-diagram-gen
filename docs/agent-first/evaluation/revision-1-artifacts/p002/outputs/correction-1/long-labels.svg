<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了で当日受付と案内の担当へ渡す。</desc><defs><marker id="deep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#174C66"/></marker><marker id="accent-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#267D75"/></marker><marker id="warning-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.3" markerHeight="2.3" orient="auto"><path d="M2 2Q1 1 1 3V9Q1 11 3 10L10 7Q12 6 10 5Z" fill="#B85A18"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="30" text-anchor="start" font-size="21" font-weight="600" fill="#203040">長いラベルの担当引継ぎ</text><path d="M297 113V147" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M297 221V272" fill="none" stroke="#174C66" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deep-arrow)"/><path d="M156 183H55Q37 183 37 165V95Q37 78 55 78H150" fill="none" stroke="#B85A18" stroke-opacity=".65" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="155" y="49" width="294" height="64" rx="24" fill="#174C66" fill-opacity=".12"/><rect x="155" y="151" width="294" height="70" rx="24" fill="#174C66" fill-opacity=".12"/><rect x="155" y="276" width="294" height="64" rx="24" fill="#267D75" fill-opacity=".15"/><text x="302" y="76" text-anchor="middle" font-size="18" font-weight="600" fill="#203040"><tspan x="302" dy="0">地域交流イベント</tspan><tspan x="302" dy="23">開催準備担当</tspan></text><text x="302" y="178" text-anchor="middle" font-size="18" font-weight="600" fill="#203040"><tspan x="302" dy="0">参加申込内容の</tspan><tspan x="302" dy="24">確認・連絡担当</tspan></text><text x="302" y="315" text-anchor="middle" font-size="19" font-weight="600" fill="#203040">当日受付と案内の担当</text><rect x="11" y="113" width="129" height="32" rx="16" fill="#B85A18" fill-opacity=".13"/><text x="75" y="135" text-anchor="middle" font-size="16" font-weight="600" fill="#203040">不足項目あり</text><rect x="315" y="232" width="116" height="31" rx="15" fill="#267D75" fill-opacity=".15"/><text x="373" y="253" text-anchor="middle" font-size="16" font-weight="600" fill="#203040">確認完了</text><text x="373" y="137" text-anchor="middle" font-size="13" font-weight="400" fill="#203040">資料を渡す</text></svg>
