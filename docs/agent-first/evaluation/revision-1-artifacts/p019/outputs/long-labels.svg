<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ。不足項目ありの場合は準備担当へ戻す。確認完了の場合は当日受付と案内の担当へ渡す。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><rect x="8" y="8" width="464" height="344" fill="#708090" opacity=".07"/><g transform="rotate(-1.2 301.0 53.0)"><rect x="154" y="22" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="18" width="302" height="70" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M158 26H444V33H158Z" fill="#174C66"/></g><text x="301" y="47" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">地域交流イベント</text><text x="301" y="70" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">開催準備担当</text><g transform="rotate(1.3 301.0 175.0)"><rect x="154" y="144" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="140" width="302" height="70" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M158 148H444V155H158Z" fill="#174C66"/></g><text x="301" y="169" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">参加申込内容の</text><text x="301" y="192" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">確認・連絡担当</text><g transform="rotate(-1.2 301.0 297.0)"><rect x="154" y="266" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="262" width="302" height="70" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M158 270H444V277H158Z" fill="#267D75"/></g><text x="301" y="304" font-size="17" fill="#203040" font-weight="600" text-anchor="middle">当日受付と案内の担当</text><path d="M301 92C298 107 304 119 301 134" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M301 215C298 230 304 243 301 256" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#arrow)"/><text x="372" y="241" font-size="16" fill="#267D75" font-weight="500" text-anchor="middle">確認完了</text><path d="M145 175H83Q65 175 65 157V71Q65 53 84 53H143" fill="none" stroke="#B85A18" stroke-width="2.1" marker-end="url(#warn)"/><path d="M15 100H128V126H15Z" fill="#FFFFFF"/><text x="71" y="119" font-size="15" fill="#B85A18" font-weight="600" text-anchor="middle">不足項目あり</text></svg>