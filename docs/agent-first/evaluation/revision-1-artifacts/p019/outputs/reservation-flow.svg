<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。日時を変更できるのは確定した予約だけ。変更申請は確認待ちへ戻り、自動承認はない。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><rect x="8" y="8" width="624" height="304" fill="#708090" opacity=".07"/><g transform="rotate(-2 104.0 128.5)"><rect x="28" y="66" width="160" height="133" fill="#708090" opacity=".22"/><rect x="24" y="62" width="160" height="133" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M32 70H176V77H32Z" fill="#174C66"/></g><text x="104" y="126" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">申請</text><g transform="rotate(1.5 320.0 128.5)"><rect x="244" y="66" width="160" height="133" fill="#708090" opacity=".22"/><rect x="240" y="62" width="160" height="133" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M248 70H392V77H248Z" fill="#174C66"/></g><text x="320" y="126" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">確認待ち</text><g transform="rotate(-1.5 536.0 128.5)"><rect x="460" y="66" width="160" height="133" fill="#708090" opacity=".22"/><rect x="456" y="62" width="160" height="133" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M464 70H608V77H464Z" fill="#267D75"/></g><text x="536" y="126" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">確定</text><text x="104" y="164" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">予約を申請</text><circle cx="270" cy="160" r="10" fill="#708090" opacity=".25"/><circle cx="268" cy="158" r="10" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M268 152V158L273 160" fill="none" stroke="#174C66" stroke-width="1.5"/><text x="333" y="165" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">予約は未確定</text><text x="536" y="164" font-size="14" fill="#267D75" font-weight="500" text-anchor="middle">予約が確定</text><path d="M188 125C204 122 216 128 232 125" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M404 125C420 122 432 128 448 125" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M537 198V239Q537 256 519 256H340Q320 256 320 236V202" fill="none" stroke="#203040" stroke-width="2.1" marker-end="url(#arrow)"/><text x="433" y="237" font-size="18" fill="#203040" font-weight="600" text-anchor="middle">日時を変更</text><text x="320" y="290" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">変更申請は確認待ちへ戻る・自動承認なし</text></svg>