<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">結果未到着の並行作業</title><desc id="desc">案内文を表記確認と会場情報確認で並行確認。表記確認は完了、会場情報確認は結果待ちで失敗ではない。まとめ役は両方完了まで公開しない。現在の公開済み案内は0。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker></defs><rect width="720" height="240" fill="#FFFFFF"/><rect x="8" y="8" width="704" height="224" fill="#708090" opacity=".07"/><g transform="rotate(-2 76.0 122.0)"><rect x="24" y="81" width="112" height="90" fill="#708090" opacity=".22"/><rect x="20" y="77" width="112" height="90" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M28 85H124V92H28Z" fill="#174C66"/></g><text x="76" y="129" font-size="21" fill="#203040" font-weight="600" text-anchor="middle">案内文</text><g transform="rotate(-1.3 354.5 63.5)"><rect x="236" y="29" width="245" height="77" fill="#708090" opacity=".22"/><rect x="232" y="25" width="245" height="77" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M240 33H469V40H240Z" fill="#267D75"/></g><text x="355" y="68" font-size="18" fill="#203040" font-weight="600" text-anchor="middle">表記確認：完了</text><path d="M253 79L259 85L270 73" fill="none" stroke="#267D75" stroke-width="2"/><g transform="rotate(1.3 354.5 174.5)"><rect x="236" y="140" width="245" height="77" fill="#708090" opacity=".22"/><rect x="232" y="136" width="245" height="77" fill="#FFFFFF" stroke="#708090" stroke-width=".7"/><path d="M240 144H469V151H240Z" fill="#174C66"/></g><text x="355" y="179" font-size="16" fill="#203040" font-weight="600" text-anchor="middle">会場情報確認：結果待ち</text><circle cx="255" cy="196" r="8" fill="#708090" opacity=".25"/><circ