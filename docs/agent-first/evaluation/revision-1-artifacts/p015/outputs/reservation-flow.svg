<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。確認待ちは未確定。確定だけ日時変更が可能で、変更申請は確認待ちへ戻る。</desc><defs><marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="accent-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#267D75"/></marker><marker id="warning-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker><marker id="deep-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#174C66"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="32" font-size="20" font-weight="600" text-anchor="start" fill="#203040">予約の確定と変更</text><g transform="rotate(-2 108.0 141.0)"><rect x="33" y="82" width="160" height="128" fill="#708090" opacity=".22"/><rect x="28" y="77" width="160" height="128" fill="#FFFFFF" stroke="#174C66" stroke-width="1"/><path d="M37 86h142v5H37Z" fill="#174C66"/></g><g transform="rotate(2 319.0 141.0)"><rect x="244" y="82" width="160" height="128" fill="#708090" opacity=".22"/><rect x="239" y="77" width="160" height="128" fill="#FFFFFF" stroke="#174C66" stroke-width="1"/><path d="M248 86h142v5H248Z" fill="#174C66"/></g><g transform="rotate(-2 530.0 141.0)"><rect x="455" y="82" width="160" height="128" fill="#708090" opacity=".22"/><rect x="450" y="77" width="160" height="128" fill="#FFFFFF" stroke="#267D75" stroke-width="1"/><path d="M459 86h142v5H459Z" fill="#267D75"/></g><text x="108" y="132" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">申請</text><text x="108" y="168" font-size="14" font-weight="400" text-anchor="middle" fill="#203040">予約を申請</text><g transform="translate(319 109) scale(0.65)"><circle cx="2" cy="3" r="15" fill="#708090" opacity=".22"/><circle r="15" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M0-9V0L7 5" fill="none" stroke="#203040" stroke-width="2"/><path d="M-4-17H4V-13H-4Z" fill="#174C66"/></g><text x="319" y="152" font-size="22" font-weight="600" text-anchor="middle" fill="#203040">確認待ち</text><text x="319" y="181" font-size="14" font-weight="400" text-anchor="middle" fill="#203040">まだ予約は未確定</text><g transform="translate(530 109) scale(0.75)"><path d="M-13-1L-7-7L-1 0L11-15L17-10L0 12Z" transform="translate(3 3)" fill="#708090" opacity=".22"/><path d="M-13-1L-7-7L-1 0L11-15L17-10L0 12Z" fill="#267D75"/></g><text x="530" y="154" font-size="24" font-weight="600" text-anchor="middle" fill="#203040">確定</text><text x="530" y="183" font-size="14" font-weight="400" text-anchor="middle" fill="#203040">日時を変更できる</text><path d="M195 139C209 135 218 135 231 139" fill="none" stroke="#203040" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#ink-tip)"/><path d="M407 139C422 135 431 135 442 139" fill="none" stroke="#203040" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#ink-tip)"/><path d="M530 211V271C530 281 518 281 507 281H342C327 281 319 271 319 258V215" fill="none" stroke="#174C66" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#deep-tip)"/><text x="429" y="255" font-size="18" font-weight="600" text-anchor="middle" fill="#174C66">日時を変更</text><text x="24" y="310" font-size="14" font-weight="400" text-anchor="start" fill="#203040">変更申請は確認待ちに戻る。自動承認はない。</text></g></svg>