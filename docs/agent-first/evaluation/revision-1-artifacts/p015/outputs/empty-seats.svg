<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み、B席とC席は空席で選択可能。D席は保留中で選択不可。</desc><defs><marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="accent-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#267D75"/></marker><marker id="warning-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker><marker id="deep-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#174C66"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><text x="180" y="22" font-size="16" font-weight="600" text-anchor="middle" fill="#203040">選べる席はB席とC席だけ</text><g transform="rotate(-2 90.0 77.5)"><rect x="21" y="40" width="148" height="85" fill="#708090" opacity=".22"/><rect x="16" y="35" width="148" height="85" fill="#FFFFFF" stroke="#174C66" stroke-width="1"/><path d="M25 44h130v5H25Z" fill="#174C66"/></g><g transform="translate(44 59)"><path d="M-12-15L12-17L14 1L-11 3ZM-17 8L16 6L18 14L-15 16ZM-11 16V24H-7V15ZM11 14V23H15V14Z" transform="translate(3 3)" fill="#708090" opacity=".22"/><path d="M-12-15L12-17L14 1L-11 3Z" fill="#FFFFFF" stroke="#174C66"/><path d="M-17 8L16 6L18 14L-15 16Z" fill="#174C66"/><path d="M-11 16V24H-7V15ZM11 14V23H15V14Z" fill="#203040"/></g><text x="108" y="63" font-size="12" font-weight="600" text-anchor="middle" fill="#174C66">選択不可</text><text x="90" y="99" font-size="16" font-weight="600" text-anchor="middle" fill="#203040">A席：予約済み</text><g transform="rotate(2 268.0 77.5)"><rect x="199" y="40" width="148" height="85" fill="#708090" opacity=".22"/><r