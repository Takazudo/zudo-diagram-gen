<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ。不足項目ありの場合は準備担当へ戻す。確認完了の場合は当日受付と案内の担当へ。</desc><defs><marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#203040"/></marker><marker id="accent-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#267D75"/></marker><marker id="warning-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B85A18"/></marker><marker id="deep-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#174C66"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="24" font-size="18" font-weight="600" text-anchor="start" fill="#203040">担当から担当へ資料を引き継ぐ</text><g transform="rotate(-1.5 301.0 78.0)"><rect x="155" y="48" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="43" width="302" height="70" fill="#FFFFFF" stroke="#174C66" stroke-width="1"/><path d="M159 52h284v5H159Z" fill="#174C66"/></g><g transform="rotate(1.5 301.0 183.0)"><rect x="155" y="153" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="148" width="302" height="70" fill="#FFFFFF" stroke="#174C66" stroke-width="1"/><path d="M159 157h284v5H159Z" fill="#174C66"/></g><g transform="rotate(-1.5 301.0 309.0)"><rect x="155" y="279" width="302" height="70" fill="#708090" opacity=".22"/><rect x="150" y="274" width="302" height="70" fill="#FFFFFF" stroke="#267D75" stroke-width="1"/><path d="M159 283h284v5H159Z" fill="#267D75"/></g><text x="301" y="72" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">地域交流イベント</text><text x="301" y="97" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">開催準備担当</text><text x="301" y="177" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">参加申込内容の</text><text x="301" y="202" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">確認・連絡担当</text><text x="301" y="316" font-size="18" font-weight="600" text-anchor="middle" fill="#203040">当日受付と案内の担当</text><path d="M301 119C298 128 298 130 301 141" fill="none" stroke="#203040" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#ink-tip)"/><path d="M301 225C301 241 301 253 301 267" fill="none" stroke="#267D75" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#accent-tip)"/><text x="359" y="250" font-size="15" font-weight="600" text-anchor="middle" fill="#267D75">確認完了</text><path d="M143 183H36C23 183 18 174 18 164V90C18 80 28 78 40 78H143" fill="none" stroke="#B85A18" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#warning-tip)"/><text x="74" y="136" font-size="14" font-weight="600" text-anchor="middle" fill="#B85A18">不足項目あり</text></g></svg>