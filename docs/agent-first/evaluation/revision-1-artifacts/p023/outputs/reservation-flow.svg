<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは予約確定ではない。確定から日時を変更すると確認待ちへ戻る。自動承認はない。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker><marker id="warning" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="31" font-size="22" fill="#203040" font-weight="600" text-anchor="start">予約の確定と変更</text><rect x="29" y="81" width="160" height="100" fill="#708090" opacity=".19"/><rect x="24" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(-1.5 104.0 126.0)"/><rect x="24" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M34 86H162" stroke="#174C66" stroke-width="4"/><path d="M168 76L184 92H168Z" fill="#174C66" opacity=".22"/><rect x="245" y="81" width="160" height="100" fill="#708090" opacity=".19"/><rect x="240" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(1 320.0 126.0)"/><rect x="240" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M250 86H378" stroke="#B85A18" stroke-width="4"/><path d="M384 76L400 92H384Z" fill="#B85A18" opacity=".22"/><rect x="461" y="81" width="160" height="100" fill="#708090" opacity=".19"/><rect x="456" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(-1 536.0 126.0)"/><rect x="456" y="76" width="160" height="100" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M466 86H594" stroke="#267D75" stroke-width="4"/><path d="M600 76L616 92H600Z" fill="#267D75" opacity=".22"/><text x="104" y="119" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">申請</text><text x="104" y="150" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">みどり室の予約</text><circle cx="320" cy="100" r="9" fill="none" stroke="#B85A18" stroke-width="1.8"/><path d="M320 95v5l4 2" fill="none" stroke="#B85A18" stroke-width="1.8"/><text x="320" y="130" font-size="22" fill="#203040" font-weight="600" text-anchor="middle">確認待ち</text><text x="320" y="155" font-size="14" fill="#B85A18" font-weight="500" text-anchor="middle">予約確定ではない</text><path d="M529 100l5 5 10-12" fill="none" stroke="#267D75" stroke-width="2.5"/><text x="536" y="131" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">確定</text><text x="536" y="155" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">日時を変更できる</text><path d="M189 126H231" fill="none" stroke="#174C66" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M405 126H447" fill="none" stroke="#174C66" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M536 181V254H320V183" fill="none" stroke="#174C66" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="438" y="239" font-size="18" fill="#174C66" font-weight="600" text-anchor="middle">日時を変更</text><text x="320" y="294" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">変更申請は確認待ちへ戻る・自動承認なし</text></svg>