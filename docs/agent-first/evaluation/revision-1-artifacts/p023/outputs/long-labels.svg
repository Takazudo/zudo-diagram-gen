<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありのとき準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5"/></marker><marker id="warning" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="27" font-size="21" fill="#203040" font-weight="600" text-anchor="start">長いラベルの担当引継ぎ</text><rect x="155" y="49" width="300" height="70" fill="#708090" opacity=".19"/><rect x="150" y="44" width="300" height="70" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(-1 300.0 79.0)"/><rect x="150" y="44" width="300" height="70" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M160 54H428" stroke="#174C66" stroke-width="4"/><path d="M434 44L450 60H434Z" fill="#174C66" opacity=".22"/><rect x="155" y="154" width="300" height="70" fill="#708090" opacity=".19"/><rect x="150" y="149" width="300" height="70" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(1 300.0 184.0)"/><rect x="150" y="149" width="300" height="70" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M160 159H428" stroke="#174C66" stroke-width="4"/><path d="M434 149L450 165H434Z" fill="#174C66" opacity=".22"/><rect x="155" y="279" width="300" height="64" fill="#708090" opacity=".19"/><rect x="150" y="274" width="300" height="64" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35" transform="rotate(-1 300.0 306.0)"/><rect x="150" y="274" width="300" height="64" fill="#FFFFFF" stroke="#708090" stroke-width="1"/><path d="M160 284H428" stroke="#267D75" stroke-width="4"/><path d="M434 274L450 290H434Z" fill="#267D75" opacity=".22"/><text x="300" y="74" font-size="18" fill="#203040" font-weight="600" text-anchor="middle"><tspan x="300" dy="0">地域交流イベント</tspan><tspan x="300" dy="25">開催準備担当</tspan></text><text x="300" y="179" font-size="18" fill="#203040" font-weight="600" text-anchor="middle"><tspan x="300" dy="0">参加申込内容の</tspan><tspan x="300" dy="25">確認・連絡担当</tspan></text><text x="300" y="314" font-size="18" fill="#203040" font-weight="600" text-anchor="middle">当日受付と案内の担当</text><path d="M300 118V143" fill="none" stroke="#174C66" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 223V268" fill="none" stroke="#174C66" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="356" y="251" font-size="16" fill="#267D75" font-weight="600" text-anchor="middle">確認完了</text><path d="M145 185H76V79H143" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" marker-end="url(#warning)"/><rect x="17" y="119" width="117" height="31" fill="#FFFFFF"/><text x="76" y="140" font-size="16" fill="#B85A18" font-weight="600" text-anchor="middle">不足項目あり</text></svg>