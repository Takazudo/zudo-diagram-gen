<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合のみ準備担当へ戻す。確認完了の場合のみ当日受付と案内の担当へ渡す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><path d="M306 94V126" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M306 209V273" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160 170H64Q40 170 40 146V62Q40 46 60 46H153" fill="none" stroke="#B85A18" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warn)"/><rect x="160" y="14" width="300" height="80" rx="22" fill="#708090" fill-opacity="0.12"/><rect x="160" y="134" width="300" height="75" rx="22" fill="#174C66" fill-opacity="0.12"/><rect x="160" y="281" width="300" height="65" rx="22" fill="#267D75" fill-opacity="0.16"/><text x="310" y="47" text-anchor="middle" font-size="19" fill="#203040" font-weight="500">地域交流イベント</text><text x="310" y="76" text-anchor="middle" font-size="19" fill="#203040" font-weight="500">開催準備担当</text><text x="310" y="164" text-anchor="middle" font-size="19" fill="#203040" font-weight="500">参加申込内容の</text><text x="310" y="193" text-anchor="middle" font-size="19" fill="#203040" font-weight="500">確認・連絡担当</text><text x="310" y="321" text-anchor="middle" font-size="19" fill="#267D75" font-weight="600">当日受付と案内の担当</text><rect x="189" y="223" width="116" height="35" rx="17" fill="#267D75" fill-opacity="0.1"/><text x="247" y="247" text-anchor="middle" font-size="17" fill="#267D75" font-weight="500">確認完了</text><rect x="6" y="187" width="140" height="36" rx="18" fill="#B85A18" fill-opacity="0.12"/><text x="76" y="212" text-anchor="middle" font-size="17" fill="#B85A18" font-weight="500">不足項目あり</text><text x="85" y="241" text-anchor="middle" font-size="14" fill="#203040" font-weight="500">準備担当へ戻す</text><text x="378" y="117" text-anchor="middle" font-size="14" fill="#203040" font-weight="500">資料を渡す</text></svg>
