<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">空席と保留中の席</title><desc id="desc">四席のみ。A席は予約済み、B席とC席だけ選択可能。D席は保留中で選択不可。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="360" height="240" fill="#FFFFFF"/><rect x="14" y="14" width="160" height="96" rx="22" fill="#174C66" fill-opacity="0.12"/><rect x="186" y="14" width="160" height="96" rx="22" fill="#267D75" fill-opacity="0.15"/><rect x="14" y="124" width="160" height="96" rx="22" fill="#267D75" fill-opacity="0.15"/><rect x="186" y="124" width="160" height="96" rx="22" fill="#174C66" fill-opacity="0.09"/><text x="94" y="52" text-anchor="middle" font-size="18" fill="#203040" font-weight="500">A席：予約済み</text><text x="94" y="84" text-anchor="middle" font-size="15" fill="#174C66" font-weight="500">✓ 予約済み</text><text x="266" y="52" text-anchor="middle" font-size="18" fill="#203040" font-weight="500">B席：空席</text><text x="266" y="84" text-anchor="middle" font-size="15" fill="#267D75" font-weight="600">○ 選択可能</text><text x="94" y="162" text-anchor="middle" font-size="18" fill="#203040" font-weight="500">C席：空席</text><text x="94" y="194" text-anchor="middle" font-size="15" fill="#267D75" font-weight="600">○ 選択可能</text><text x="266" y="162" text-anchor="middle" font-size="18" fill="#203040" font-weight="500">D席：保留中</text><text x="266" y="194" text-anchor="middle" font-size="15" fill="#174C66" font-weight="500">… 選択不可</text></svg>
