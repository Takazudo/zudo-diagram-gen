<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは予約確定ではない。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認なし。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><path d="M184 118H232" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M400 118H448" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M536 170V220Q536 238 518 238H338Q320 238 320 220V177" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="65" width="160" height="105" rx="22" fill="#708090" fill-opacity="0.12"/><rect x="240" y="65" width="160" height="105" rx="22" fill="#174C66" fill-opacity="0.12"/><rect x="456" y="65" width="160" height="105" rx="22" fill="#267D75" fill-opacity="0.16"/><text x="104" y="111" text-anchor="middle" font-size="24" fill="#203040" font-weight="500">申請</text><text x="104" y="146" text-anchor="middle" font-size="15" fill="#203040" font-weight="500">予約を申請</text><text x="320" y="111" text-anchor="middle" font-size="24" fill="#203040" font-weight="500">確認待ち</text><text x="320" y="146" text-anchor="middle" font-size="15" fill="#203040" font-weight="500">予約確定ではない</text><text x="536" y="111" text-anchor="middle" font-size="24" fill="#267D75" font-weight="700">確定</text><text x="536" y="146" text-anchor="middle" font-size="15" fill="#203040" font-weight="500">✓ 予約確定</text><rect x="365" y="257" width="174" height="39" rx="19" fill="#267D75" fill-opacity="0.12"/><text x="452" y="283" text-anchor="middle" font-size="18" fill="#267D75" font-weight="600">日時を変更</text><text x="220" y="283" text-anchor="middle" font-size="16" fill="#203040" font-weight="500">変更申請は確認待ちへ</text><text x="320" y="312" text-anchor="middle" font-size="14" fill="#203040" font-weight="500">自動承認なし</text></svg>
