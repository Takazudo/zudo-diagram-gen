l="#203040" font-weight="500">案内文</text><text x="309" y="60" text-anchor="middle" font-size="19" fill="#203040" font-weight="500">表記確認：完了</text><text x="309" y="85" text-anchor="middle" font-size="18" fill="#267D75" font-weight="700">✓</text><text x="309" y="165" text-anchor="middle" font-size="18" fill="#203040" font-weight="500">会場情報確認：結果待ち</text><text x="309" y="191" text-anchor="middle" font-size="14" fill="#174C66" font-weight="500">… 結果の到着待ち</text><text x="625" y="99" text-anchor="middle" font-size="16" fill="#267D75" font-weight="600">両方完了後に公開</text><text x="625" y="148" text-anchor="middle" font-size="20" fill="#203040" font-weight="700">公開済み：0</text><text x="455" y="229" text-anchor="middle" font-size="15" fill="#203040" font-weight="500">両方が完了するまで公開しない</text></svg>
