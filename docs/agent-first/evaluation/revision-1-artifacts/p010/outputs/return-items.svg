<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしは返却箱、破損ありは相談窓口へ進む。返却箱は現在空で返却に使える。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><path d="M160 80V109" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160 186V204Q160 214 148 214H92Q84 214 84 227V266" fill="none" stroke="#708090" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160 186V204Q160 214 174 214H228Q236 214 236 227V266" fill="none" stroke="#B85A18" stroke-opacity=".65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warn)"/><rect x="80" y="22" width="160" height="58" rx="22" fill="#708090" fill-opacity="0.12"/><rect x="64" y="118" width="192" height="68" rx="22" fill="#174C66" fill-opacity="0.12"/><rect x="16" y="276" width="136" height="151" rx="22" fill="#267D75" fill-opacity="0.15"/><rect x="168" y="276" width="136" height="151" rx="22" fill="#B85A18" fill-opacity="0.12"/><text x="160" y="59" text-anchor="middle" font-size="22" fill="#203040" font-weight="500">入口</text><text x="160" y="160" text-anchor="middle" font-size="23" fill="#203040" font-weight="500">返却確認台</text><rect x="36" y="227" width="96" height="30" rx="15" fill="#267D75" fill-opacity="0.1"/><text x="84" y="249" text-anchor="middle" font-size="17" fill="#203040" font-weight="500">破損なし</text><rect x="188" y="227" width="96" height="30" rx="15" fill="#B85A18" fill-opacity="0.12"/><text x="236" y="249" text-anchor="middle" font-size="17" fill="#B85A18" font-weight="500">破損あり</text><path d="M54 300H114L107 329H61Z" fill="#FFFFFF"/><path d="M65 308H103" stroke="#267D75" stroke-width="3" stroke-linecap="round"/><text x="84" y="361" text-anchor="middle" font-size="20" fill="#267D75" font-weight="600">返却箱：空</text><text x="84" y="394" text-anchor="middle" font-size="16" fill="#203040" font-weight="500">返却に使える</text><path d="M220 303L236 329L252 303Z" fill="#B85A18" fill-opacity=".18"/><text x="236" y="361" text-anchor="middle" font-size="20" fill="#B85A18" font-weight="600">相談窓口</text><text x="236" y="394" text-anchor="middle" font-size="16" fill="#203040" font-weight="500">こちらへ相談</text><text x="160" y="459" text-anchor="middle" font-size="17" fill="#203040" font-weight="500">空でも返却できます</text></svg>
