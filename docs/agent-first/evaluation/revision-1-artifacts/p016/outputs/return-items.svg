<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら返却箱、破損ありなら相談窓口へ。返却箱は現在空で、空でも返却に使える。</desc><defs><pattern id="rules" width="320" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H320" stroke="#708090" stroke-width=".7" opacity=".13"/></pattern><marker id="i" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><rect width="320" height="480" fill="url(#rules)"/><path d="M12 0L13 480" stroke="#267D75" stroke-width=".7" opacity=".18"/><g font-family="Noto Sans CJK JP, sans-serif"><path d="M87 32 L232 30 L233 89 L89 91 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M89 30 L234 33 L231 93 L87 89" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M95 82 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text x="160" y="68" font-size="22" fill="#203040" font-weight="500" text-anchor="middle">入口</text><path d="M160 97Q163 120 160 139" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i)"/><path d="M65 148 L254 146 L255 210 L67 212 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M67 146 L256 149 L253 214 L65 210" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M73 203 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text x="160" y="187" font-size="21" fill="#203040" font-weight="500" text-anchor="middle">返却確認台</text><path d="M160 216L160 230L60 230L60 319" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M160 230L260 230L260 319" fill="none" stroke="#B85A18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/><text x="108" y="274" font-size="17" fill="#267D75" font-weight="600" text-anchor="middle">破損なし</text><text x="214" y="274" font-size="17" fill="#B85A18" font-weight="600" text-anchor="middle">破損あり</text><path d="M23 330 L157 328 L158 409 L25 411 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M25 328 L159 331 L156 413 L23 409" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M31 402 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#267D75" stroke-width=".8" opacity=".5" fill="none"/><text x="90" y="362" font-size="19" fill="#267D75" font-weight="600" text-anchor="middle">返却箱：空</text><text x="90" y="390" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">返却に使える</text><path d="M178 330 L298 328 L299 409 L180 411 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M180 328 L300 331 L297 413 L178 409" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M186 402 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#B85A18" stroke-width=".8" opacity=".5" fill="none"/><text x="238" y="375" font-size="20" fill="#B85A18" font-weight="600" text-anchor="middle">相談窓口</text><text x="160" y="453" font-size="17" fill="#203040" font-weight="500" text-anchor="middle">空でも返却に使える</text></g></svg>