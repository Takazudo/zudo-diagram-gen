<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><defs><pattern id="rules" width="480" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H480" stroke="#708090" stroke-width=".7" opacity=".13"/></pattern><marker id="i" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M12 0L13 360" stroke="#267D75" stroke-width=".7" opacity=".18"/><g font-family="Noto Sans CJK JP, sans-serif"><path d="M142 30 L451 28 L452 96 L144 98 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M144 28 L453 31 L450 100 L142 96" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M150 89 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text font-size="18" fill="#203040" text-anchor="middle"><tspan x="297" y="56">地域交流イベント</tspan><tspan x="297" y="81">開催準備担当</tspan></text><path d="M142 152 L451 150 L452 218 L144 220 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M144 150 L453 153 L450 222 L142 218" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M150 211 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text font-size="18" fill="#203040" text-anchor="middle"><tspan x="297" y="178">参加申込内容の</tspan><tspan x="297" y="203">確認・連絡担当</tspan></text><path d="M142 284 L451 282 L452 337 L144 339 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M144 282 L453 285 L450 341 L142 337" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M150 330 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#267D75" stroke-width=".8" opacity=".5" fill="none"/><text x="297" y="315" font-size="19" fill="#267D75" font-weight="600" text-anchor="middle">当日受付と案内の担当</text><path d="M297 103Q300 125 297 143" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i)"/><text x="354" y="130" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">資料を渡す</text><path d="M140 185L108 185Q99 185 99 174L99 75Q99 63 111 63L134 63" fill="none" stroke="#B85A18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/><text font-size="15" fill="#B85A18" text-anchor="middle"><tspan x="57" y="117">不足項目</tspan><tspan x="57" y="139">あり</tspan></text><path d="M297 225Q301 249 297 275" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="362" y="255" font-size="17" fill="#267D75" font-weight="500" text-anchor="middle">確認完了</text></g></svg>