<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。確認待ちは予約確定ではない。日時を変更できるのは確定後だけ。変更申請は確認待ちへ戻り、自動承認はない。</desc><defs><pattern id="rules" width="640" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H640" stroke="#708090" stroke-width=".7" opacity=".13"/></pattern><marker id="i" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M12 0L13 320" stroke="#267D75" stroke-width=".7" opacity=".18"/><g font-family="Noto Sans CJK JP, sans-serif"><path d="M30 67 L181 65 L182 144 L32 146 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M32 65 L183 68 L180 148 L30 144" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M38 137 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text x="106" y="114" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">申請</text><path d="M244 67 L395 65 L396 144 L246 146 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M246 65 L397 68 L394 148 L244 144" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M252 137 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#203040" stroke-width=".8" opacity=".5" fill="none"/><text x="320" y="114" font-size="24" fill="#203040" font-weight="600" text-anchor="middle">確認待ち</text><path d="M458 67 L609 65 L610 144 L460 146 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M460 65 L611 68 L608 148 L458 144" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M466 137 l5 -5 m3 5 l5 -5 m3 5 l5 -5" stroke="#267D75" stroke-width=".8" opacity=".5" fill="none"/><text x="534" y="114" font-size="24" fill="#267D75" font-weight="600" text-anchor="middle">確定</text><path d="M190 105Q212 102 236 105" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i)"/><path d="M405 105Q427 102 449 105" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i)"/><text x="320" y="45" font-size="16" fill="#203040" font-weight="500" text-anchor="middle">予約確定ではない</text><text x="534" y="45" font-size="16" fill="#267D75" font-weight="500" text-anchor="middle">確定後のみ変更可</text><path d="M534 149L534 218Q534 233 516 233L341 233Q320 233 320 215L320 153" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="433" y="222" font-size="19" fill="#267D75" font-weight="600" text-anchor="middle">日時を変更</text><text x="433" y="260" font-size="16" fill="#203040" font-weight="500" text-anchor="middle">変更申請は確認待ちへ戻る</text><text x="320" y="296" font-size="16" fill="#203040" font-weight="500" text-anchor="middle">自動承認はない</text></g></svg>