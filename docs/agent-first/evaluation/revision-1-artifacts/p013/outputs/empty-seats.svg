<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み。B席とC席だけ選択可能な空席。D席は保留中で選択不可。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.6"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><rect width="360" height="240" fill="#FFFFFF"/><text x="18" y="27" text-anchor="start" font-size="19" font-weight="400" fill="#203040">空席と保留中の席</text><rect x="18" y="43" width="154" height="86" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M40 97V74H68V97M35 101H73V111H35ZM40 111V127M68 111V127" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="65" text-anchor="middle" font-size="15" font-weight="400" fill="#203040">A席：予約済み</text><text x="126" y="111" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">選択不可</text><rect x="188" y="43" width="154" height="86" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M210 97V74H238V97M205 101H243V111H205ZM210 111V127M238 111V127" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="65" text-anchor="middle" font-size="15" font-weight="400" fill="#203040">B席：空席</text><text x="296" y="111" text-anchor="middle" font-size="14" font-weight="400" fill="#267D75">選択可能</text><rect x="18" y="141" width="154" height="86" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M40 195V172H68V195M35 199H73V209H35ZM40 209V225M68 209V225" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="rou