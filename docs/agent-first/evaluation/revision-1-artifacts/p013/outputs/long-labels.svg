<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認担当へ資料を渡す。不足項目ありの場合だけ準備担当へ戻す。確認完了で受付担当へ渡す。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.6"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><rect width="480" height="360" fill="#FFFFFF"/><text x="18" y="25" text-anchor="start" font-size="19" font-weight="400" fill="#203040">長いラベルの担当引継ぎ</text><rect x="154" y="43" width="308" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="308" y="80" text-anchor="middle" font-size="17" font-weight="400" fill="#203040">地域交流イベント開催準備担当</text><rect x="154" y="150" width="308" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="308" y="187" text-anchor="middle" font-size="17" font-weight="400" fill="#203040">参加申込内容の確認・連絡担当</text><rect x="154" y="270" width="308" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="308" y="307" text-anchor="middle" font-size="17" font-weight="400" fill="#203040">当日受付と案内の担当</text><path d="M308 103V150" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M308 210V270" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="326" y="243" text-anchor="start" font-size="16" font-weight="400" fill="#267D75">確認完了</text><path d="M154 180H116V73H154" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warn)"/><text x="103" y="130" text-anchor="end" font-size="15" font-weight="400" fill="#B85A18">不足項目あり</text><circle cx="308" cy="241" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/></svg>
