<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">結果未到着の並行作業</title><desc id="desc">案内文を表記確認と会場情報確認に分岐。表記確認は完了、会場情報確認は結果待ち。まとめ役は両方完了するまで公開しない。公開済みは0。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.6"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><rect width="720" height="240" fill="#FFFFFF"/><text x="20" y="24" text-anchor="start" font-size="19" font-weight="400" fill="#203040">結果未到着の並行作業</text><rect x="20" y="87" width="112" height="66" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="76" y="126" text-anchor="middle" font-size="19" font-weight="400" fill="#203040">案内文</text><path d="M132 120H178V64H216" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M178 120V176H216" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="178" cy="120" r="4" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><rect x="216" y="36" width="244" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M232 67l5 5 10-12" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="341" y="74" text-anchor="middle" font-size="17" font-weight="400" fill="#203040">表記確認：完了</text><rect x="216" y="146" width="244" height="60" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><circle cx="237" cy="176" r="10" fill="none" stroke="#203040" stroke-width="1.6"/><path d="M237 171V176L242 179" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="349" y="183" text-anchor="middle" font-size="16" font-weight="400" fill="#203040">会場情報確認：結果待ち</text><path d="M460 66H496V120H536" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M460 176H496V120" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="536" y="82" width="164" height="89" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="618" y="107" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">まとめ役</text><text x="618" y="132" text-anchor="middle" font-size="16" font-weight="400" fill="#203040">両方完了後に公開</text><text x="618" y="157" text-anchor="middle" font-size="17" font-weight="400" fill="#174C66">公開済み：0</text><text x="339" y="232" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">結果待ちは失敗ではない</text><text x="618" y="196" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">両方が完了するまで</text><text x="618" y="216" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">公開しない</text></svg>
