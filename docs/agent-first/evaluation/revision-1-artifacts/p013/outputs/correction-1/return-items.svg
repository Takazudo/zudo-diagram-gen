<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら現在空の返却箱へ。空でも返却に使える。破損ありなら相談窓口へ。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.6"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><rect width="320" height="480" fill="#FFFFFF"/><text x="18" y="30" text-anchor="start" font-size="19" font-weight="400" fill="#203040">返却場所への案内</text><rect x="102" y="55" width="116" height="55" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="160" y="90" text-anchor="middle" font-size="20" font-weight="400" fill="#203040">入口</text><path d="M160 110V153" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="76" y="153" width="168" height="66" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M99 176H221M108 176V199M212 176V199" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="207" text-anchor="middle" font-size="19" font-weight="400" fill="#203040">返却確認台</text><path d="M160 219V257H84V305" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M160 257H250V305" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warn)"/><circle cx="160" cy="257" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><text x="84" y="243" text-anchor="middle" font-size="16" font-weight="400" fill="#203040">破損なし</text><text x="250" y="243" text-anchor="middle" font-size="16" font-weight="400" fill="#B85A18">破損あり</text><path d="M33 328H136V395H33ZM33 341H136M47 324V314H122V324" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="419" text-anchor="middle" font-size="16" font-weight="400" fill="#203040">返却箱：空</text><text x="84" y="446" text-anchor="middle" font-size="15" font-weight="400" fill="#267D75">返却に使える</text><rect x="188" y="306" width="116" height="92" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><path d="M209 330H283M218 330V346M274 330V346" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="372" text-anchor="middle" font-size="18" font-weight="400" fill="#203040">相談窓口</text><text x="246" y="421" text-anchor="middle" font-size="14" font-weight="400" fill="#B85A18">破損時は相談</text></svg>
