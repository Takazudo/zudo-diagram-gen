<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認なし。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.6"/></marker><marker id="warn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="32" text-anchor="start" font-size="20" font-weight="400" fill="#203040">予約の確定と変更</text><rect x="28" y="76" width="150" height="112" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="103" y="151" text-anchor="middle" font-size="21" font-weight="400" fill="#203040">申請</text><rect x="245" y="76" width="150" height="112" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="320" y="151" text-anchor="middle" font-size="21" font-weight="400" fill="#203040">確認待ち</text><rect x="462" y="76" width="150" height="112" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="537" y="151" text-anchor="middle" font-size="21" font-weight="400" fill="#203040">確定</text><path d="M71 117V96H117V125H71Z M79 103H109M79 111H103" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="110" r="12" fill="none" stroke="#203040" stroke-width="1.6"/><path d="M320 103V110L325 113" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 110l5 5 10-12" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 132H245" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M395 132H462" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="320" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#203040">予約は未確定</text><circle cx="537" cy="240" r="4" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><path d="M537 188V259H320V223" fill="none" stroke="#708090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="439" y="252" text-anchor="middle" font-size="17" font-weight="400" fill="#203040">日時を変更</text><text x="439" y="283" text-anchor="middle" font-size="14" font-weight="400" fill="#203040">確定した予約だけ</text><text x="320" y="310" text-anchor="middle" font-size="15" font-weight="400" fill="#203040">変更申請は確認待ちへ戻る・自動承認なし</text></svg>
