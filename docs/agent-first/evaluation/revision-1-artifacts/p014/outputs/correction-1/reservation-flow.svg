<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認はない。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="35" font-size="22" fill="#203040" font-weight="500" text-anchor="start">予約の確定と変更</text><path d="M184 130 H224" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 122 L224 130 L215 138" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M404 130 H436" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M427 122 L436 130 L427 138" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="82" width="160" height="96" rx="24" fill="#708090" fill-opacity="0.12"/><text x="104" y="124" font-size="24" fill="#203040" font-weight="500" text-anchor="middle">申請</text><text x="104" y="153" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">予約を申し込む</text><rect x="236" y="82" width="168" height="96" rx="24" fill="#174C66" fill-opacity="0.12"/><text x="320" y="124" font-size="24" fill="#203040" font-weight="500" text-anchor="middle">確認待ち</text><text x="320" y="153" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">まだ確定ではない</text><rect x="448" y="82" width="168" height="96" rx="24" fill="#267D75" fill-opacity="0.17"/><text x="532" y="124" font-size="24" fill="#267D75" font-weight="500" text-anchor="middle">確定</text><text x="532" y="153" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">変更できる予約</text><path d="M532 180 V221 Q532 240 513 240 H339 Q320 240 320 221 V190" fill="none" stroke="#174C66" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M312 199 L320 190 L328 199" fill="none" stroke="#174C66" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="253" width="180" height="33" rx="16" fill="#174C66" fill-opacity="0.1"/><text x="504" y="276" font-size="17" fill="#174C66" font-weight="500" text-anchor="middle">日時を変更</text><text x="24" y="308" font-size="14" fill="#203040" font-weight="500" text-anchor="start">変更申請は確認待ちに戻ります。自動承認はありません。</text></g></svg>