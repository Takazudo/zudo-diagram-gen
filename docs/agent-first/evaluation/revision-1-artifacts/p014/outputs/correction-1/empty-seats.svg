<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席のみ。A席は予約済み、B席とC席は空席で選択可能、D席は保留中で選択不可。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><text x="16" y="28" font-size="18" fill="#203040" font-weight="500" text-anchor="start">空席と保留中の席</text><rect x="16" y="45" width="156" height="82" rx="22" fill="#174C66" fill-opacity="0.12"/><text x="94" y="79" font-size="18" fill="#203040" font-weight="500" text-anchor="middle">A席：予約済み</text><text x="94" y="107" font-size="14" fill="#174C66" font-weight="500" text-anchor="middle">選択不可</text><rect x="188" y="45" width="156" height="82" rx="22" fill="#267D75" fill-opacity="0.16"/><text x="266" y="79" font-size="18" fill="#203040" font-weight="500" text-anchor="middle">B席：空席</text><text x="266" y="107" font-size="14" fill="#267D75" font-weight="500" text-anchor="middle">選択可能</text><rect x="16" y="143" width="156" height="82" rx="22" fill="#267D75" fill-opacity="0.16"/><text x="94" y="177" font-size="18" fill="#203040" font-weight="500" text-anchor="middle">C席：空席</text><text x="94" y="205" font-size="14" fill="#267D75" font-weight="500" text-anchor="middle">選択可能</text><rect x="188" y="143" width="156" height="82" rx="22" fill="#708090" fill-opacity="0.12"/><text x="266" y="177" font-size="18" fill="#203040" font-weight="500" text-anchor="middle">D席：保留中</text><text x="266" y="205" font-size="14" fill="#708090" font-weight="500" text-anchor="middle">選択不可</text></g></svg>