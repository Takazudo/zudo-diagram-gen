<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら現在空で利用可能な返却箱へ。破損ありなら相談窓口へ。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><text x="20" y="33" font-size="21" fill="#203040" font-weight="500" text-anchor="start">返却場所への案内</text><rect x="85" y="55" width="150" height="57" rx="24" fill="#708090" fill-opacity="0.12"/><text x="160" y="91" font-size="23" fill="#203040" font-weight="500" text-anchor="middle">入口</text><path d="M160 113 V141" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 132 L160 141 L168 132" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="152" width="210" height="67" rx="24" fill="#174C66" fill-opacity="0.12"/><text x="160" y="194" font-size="23" fill="#203040" font-weight="500" text-anchor="middle">返却確認台</text><path d="M117 219 V246 Q117 260 103 260 H89 Q75 260 75 275 V312" fill="none" stroke="#267D75" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 303 L75 312 L83 303" fill="none" stroke="#267D75" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M203 219 V246 Q203 260 217 260 H231 Q245 260 245 275 V312" fill="none" stroke="#B85A18" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M237 303 L245 312 L253 303" fill="none" stroke="#B85A18" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="74.5" y="249" font-size="16" fill="#267D75" font-weight="500" text-anchor="middle">破損なし</text><text x="244.5" y="249" font-size="16" fill="#B85A18" font-weight="500" text-anchor="middle">破損あり</text><rect x="16" y="326" width="134" height="106" rx="24" fill="#267D75" fill-opacity="0.17"/><text x="83" y="365" font-size="20" fill="#267D75" font-weight="500" text-anchor="middle">返却箱：空</text><text x="83" y="397" font-size="12" fill="#203040" font-weight="500" text-anchor="middle">空でも返却に使える</text><rect x="170" y="326" width="134" height="106" rx="24" fill="#B85A18" fill-opacity="0.12"/><text x="237" y="379" font-size="22" fill="#B85A18" font-weight="500" text-anchor="middle">相談窓口</text></g></svg>