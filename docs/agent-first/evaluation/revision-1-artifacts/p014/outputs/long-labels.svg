<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><text x="24" y="30" font-size="21" fill="#203040" font-weight="500" text-anchor="start">長いラベルの担当引継ぎ</text><path d="M295 117 V145" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 136 L295 145 L303 136" fill="none" stroke="#708090" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 220 V256" fill="none" stroke="#267D75" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 247 L295 256 L303 247" fill="none" stroke="#267D75" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 186 H88 Q68 186 68 166 V104 Q68 85 88 85 H130" fill="none" stroke="#B85A18" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M121 77 L130 85 L121 93" fill="none" stroke="#B85A18" stroke-opacity=".58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="52" width="310" height="65" rx="24" fill="#708090" fill-opacity="0.12"/><text x="295" y="78" font-size="18" fill="#203040" font-weight="500" text-anchor="middle"><tspan x="295" dy="0">地域交流イベント</tspan><tspan x="295" dy="23">開催準備担当</tspan></text><rect x="140" y="155" width="310" height="65" rx="24" fill="#174C66" fill-opacity="0.12"/><text x="295" y="181" font-size="18" fill="#203040" font-weight="500" text-anchor="middle"><tspan x="295" dy="0">参加申込内容の</tspan><tspan x="295" dy="23">確認・連絡担当</tspan></text><rect x="140" y="266" width="310" height="65" rx="24" fill="#267D75" fill-opacity="0.17"/><text x="295" y="304" font-size="20" fill="#267D75" font-weight="500" text-anchor="middle">当日受付と案内の担当</text><rect x="17" y="127" width="103" height="29" rx="14" fill="#B85A18" fill-opacity="0.12"/><text x="68.5" y="147" font-size="14" fill="#B85A18" font-weight="500" text-anchor="middle">不足項目あり</text><text x="371" y="247" font-size="16" fill="#267D75" font-weight="500" text-anchor="middle">確認完了</text></g></svg>