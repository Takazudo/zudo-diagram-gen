<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="empty-seats-title empty-seats-desc"><title id="empty-seats-title">空席と保留中の席</title><desc id="empty-seats-desc">四席。A席は予約済みで選択不可。B席とC席は空席で選択可。D席は保留中で選択不可。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><text x="16" y="26" font-size="16" fill="#203040" text-anchor="start" font-weight="500">選べる席はB席とC席だけ</text><rect x="16" y="42" width="156" height="88" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M32 78 V57 Q32 53 36 53 H58 Q62 53 62 57 V78 M28 78 H66 M32 78 V90 M62 78 V90" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="71" font-size="13" fill="#203040" text-anchor="start" font-weight="400">A席：予約済み</text><text x="110" y="104" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">選択不可</text><rect x="188" y="42" width="156" height="88" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><path d="M204 78 V57 Q204 53 208 53 H230 Q234 53 234 57 V78 M200 78 H238 M204 78 V90 M234 78 V90" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="71" font-size="13" fill="#203040" text-anchor="start" font-weight="400">B席：空席</text><text x="282" y="104" font-size="13" fill="#267D75" text-anchor="middle" font-weight="400">選択可</text><circle cx="256" cy="100" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><rect x="16" y="142" width="156" height="88" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><path d="M32 178 V157 Q32 153 36 153 H58 Q62 153 62 157 V178 M28 178 H66 M32 178 V190 M62 178 V190" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="171" font-size="13" fill="#203040" text-anchor="start" font-weight="400">C席：空席</text><text x="110" y="204" font-size="13" fill="#267D75" text-anchor="middle" font-weight="400">選択可</text><circle cx="84" cy="200" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><rect x="188" y="142" width="156" height="88" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M204 178 V157 Q204 153 208 153 H230 Q234 153 234 157 V178 M200 178 H238 M204 178 V190 M234 178 V190" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="171" font-size="13" fill="#203040" text-anchor="start" font-weight="400">D席：保留中</text><text x="282" y="204" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">選択不可</text><circle cx="327" cy="202" r="7" fill="none" stroke="#708090" stroke-width="1.6"/><path d="M327 199 V202 L331 204" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>