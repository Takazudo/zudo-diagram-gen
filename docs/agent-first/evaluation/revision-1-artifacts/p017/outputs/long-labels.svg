<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="long-labels-title long-labels-desc"><title id="long-labels-title">長いラベルの担当引継ぎ</title><desc id="long-labels-desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合だけ準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="27" font-size="19" fill="#203040" text-anchor="start" font-weight="500">長いラベルの担当引継ぎ</text><rect x="144" y="46" width="308" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="144" y="165" width="308" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="144" y="291" width="308" height="54" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="298" y="76" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">地域交流イベント</text><text x="298" y="102" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">開催準備担当</text><text x="298" y="195" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">参加申込内容の</text><text x="298" y="221" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">確認・連絡担当</text><text x="298" y="325" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">当日受付と案内の担当</text><path d="M298 120 V165 M291 156 L298 165 L305 156" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="313" y="147" font-size="13" fill="#203040" text-anchor="start" font-weight="400">資料</text><path d="M298 239 V291 M291 282 L298 291 L305 282" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="273" font-size="15" fill="#267D75" text-anchor="start" font-weight="400">確認完了</text><path d="M144 202 H48 Q36 202 36 190 V95 Q36 83 48 83 H144 M135 76 L144 83 L135 90" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" 