<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="return-items-title return-items-desc"><title id="return-items-title">返却場所への案内</title><desc id="return-items-desc">入口から返却確認台へ進む。破損なしなら返却箱へ、破損ありなら相談窓口へ。返却箱は現在空で返却に使える。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><text x="20" y="31" font-size="20" fill="#203040" text-anchor="start" font-weight="500">返却場所への案内</text><rect x="104" y="61" width="112" height="54" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="95" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">入口</text><path d="M160 115 V159 M153 150 L160 159 L167 150" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="159" width="172" height="68" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="201" font-size="21" fill="#203040" text-anchor="middle" font-weight="400">返却確認台</text><path d="M160 227 V253 H82 Q74 253 74 261 V331 M67 322 L74 331 L81 322" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 253 H238 Q246 253 246 261 V331 M239 322 L246 331 L253 322" fill="none" stroke="#B85A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="253" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><text x="120" y="291" font-size="16" fill="#267D75" text-anchor="middle" font-weight="400">破損なし</text><text x="200" y="291" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="400">破損あり</text><rect x="14" y="331" width="136" height="115" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="170" y="331" width="136" height="115" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><path d="M57 359 H107 V387 H57 Z M53 354 H111 M57 360 L53 354 M107 360 L111 354" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="414" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">返却箱：空</text><text x="82" y="436" font-size="13" fill="#267D75" text-anchor="middle" font-weight="400">返却に使える</text><path d="M232 352 L242 370 H222 Z M232 357 V363 M232 367 V367.5" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="238" y="414" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">相談窓口</text></g></svg>