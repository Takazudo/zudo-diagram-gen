<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="pending-queue-title pending-queue-desc"><title id="pending-queue-title">結果未到着の並行作業</title><desc id="pending-queue-desc">案内文から表記確認と会場情報確認に分岐。表記確認は完了、会場情報確認は結果待ち。まとめ役は両方が完了するまで公開しない。公開済みは0。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="720" height="240" fill="#FFFFFF"/><text x="20" y="26" font-size="19" fill="#203040" text-anchor="start" font-weight="500">結果未到着の並行作業</text><rect x="20" y="88" width="108" height="64" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="74" y="126" font-size="20" fill="#203040" text-anchor="middle" font-weight="400">案内文</text><rect x="204" y="43" width="244" height="58" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="204" y="145" width="244" height="58" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><path d="M216 72 l4 4 8 -9" fill="none" stroke="#267D75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="337" y="79" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">表記確認：完了</text><circle cx="221" cy="174" r="8" fill="none" stroke="#708090" stroke-width="1.6"/><path d="M221 170 V174 L225 176" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="337" y="180" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">会場情報確認：結果待ち</text><path d="M128 120 H157 Q168 120 168 109 V83 Q168 72 179 72 H204 M195 65 L204 72 L195 79" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 120 V163 Q168 174 179 174 H204 M195 167 L204 174 L195 181" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="168" cy="120" r="3" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><path d="M448 72 H472 Q484 72 484 84 V108 Q484 120 496 120 H520 M511 113 L520 120 L511 127" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 174 H472 Q484 174 484 162 V120" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="520" y="88" width="180" height="64" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><text x="610" y="115" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">両方完了後に公開</text><text x="610" y="139" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">現在は待機</text><text x="610" y="188" font-size="20" fill="#174C66" text-anchor="middle" font-weight="400">公開済み：0</text><text x="20" y="229" font-size="14" fill="#203040" text-anchor="start" font-weight="400">結果待ちは失敗ではない</text></g></svg>