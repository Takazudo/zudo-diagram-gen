<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="reservation-flow-title reservation-flow-desc"><title id="reservation-flow-title">予約の確定と変更</title><desc id="reservation-flow-desc">申請、確認待ち、確定の順。確認待ちは未確定。確定した予約の日時を変更すると確認待ちに戻り、自動承認はない。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="32" font-size="20" fill="#203040" text-anchor="start" font-weight="500">予約の確定と変更</text><rect x="24" y="78" width="152" height="112" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="244" y="78" width="152" height="112" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="464" y="78" width="152" height="112" rx="4" fill="#FFFFFF" stroke="#203040" stroke-width="1.6"/><path d="M176 134 H244 M235 127 L244 134 L235 141" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M396 134 H464 M455 127 L464 134 L455 141" fill="none" stroke="#708090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 105 H78 V123 H58 Z M62 111 H74 M62 116 H71" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="153" font-size="23" fill="#203040" text-anchor="middle" font-weight="400">申請</text><circle cx="320" cy="111" r="11" fill="none" stroke="#708090" stroke-width="1.6"/><path d="M320 104 V111 L324 113" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="151" font-size="23" fill="#203040" text-anchor="middle" font-weight="400">確認待ち</text><text x="320" y="176" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">予約は未確定</text><path d="M534 111 l4 4 8 -9" fill="none" stroke="#267D75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="151" font-size="23" fill="#203040" text-anchor="middle" font-weight="400">確定</text><circle cx="603" cy="90" r="4" fill="#267D75" stroke="#267D75" stroke-width="1.6"/><path d="M540 190 V241 Q540 253 528 253 H332 Q320 253 320 241 V190 M313 199 L320 190 L327 199" fill="none" stroke="#267D75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="238" font-size="18" fill="#267D75" text-anchor="middle" font-weight="400">日時を変更</text><text x="425" y="286" font-size="14" fill="#203040" text-anchor="middle" font-weight="400">変更申請は確認待ちへ戻る</text><text x="425" y="308" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">自動承認なし</text></g></svg>