0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 211 l5 -5" fill="none" stroke="#708090" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M214 211 l5 -5" fill="none" stroke="#708090" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 211 l5 -5" fill="none" stroke="#708090" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 211 l5 -5" fill="none" stroke="#708090" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="263" y="171" text-anchor="middle" font-size="17" font-weight="600" fill="#708090">D席：保留中</text><text x="263" y="199" text-anchor="middle" font-size="14" font-weight="500" fill="#203040">選択不可</text>
