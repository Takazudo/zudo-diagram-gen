<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">結果未到着の並行作業</title><desc id="desc">案内文から表記確認と会場情報確認へ分岐。表記確認は完了、会場情報確認は結果待ち。まとめ役は両方完了まで公開しない。公開済みは0。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#708090" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#174C66" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="720" height="240" fill="#FFFFFF"/><text x="20" y="29" font-size="20" fill="#203040" text-anchor="start" font-weight="400">結果未到着の並行作業</text><rect x="20" y="88" width="110" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="75" y="132" font-size="19" fill="#203040" text-anchor="middle" font-weight="400">案内文</text><rect x="222" y="50" width="248" height="65" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="346" y="90" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">表記確認：完了</text><rect x="222" y="145" width="248" height="65" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6" stroke-dasharray="5 4"/><text x="346" y="185" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">会場情報確認：結果待ち</text><path d="M130 125 H164 Q176 125 176 113 V94 Q176 82 188 82 H222" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M176 125 V165 Q176 177 188 177 H222" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><circle cx="176" cy="125" r="3.5" fill="#267D75"/><path d="M470 82 H494 Q506 82 506 94 V124" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M470 177 H494 Q506 177 506 165 V130" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M506 127 H540" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><rect x="540" y="88" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="620" y="114" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">両方完了後に公開</text><text x="620" y="143" font-size="19" fill="#174C66" text-anchor="middle" font-weight="400">公開済み：0</text><text x="620" y="190" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">まとめ役：公開せず待機</text><text x="346" y="232" font-size="13" fill="#203040" text-anchor="middle" font-weight="400">結果待ちは失敗ではない</text></g></svg>
