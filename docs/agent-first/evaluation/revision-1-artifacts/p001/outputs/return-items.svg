<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら現在空の返却箱へ進み、返却に使える。破損ありなら相談窓口へ進む。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#708090" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#174C66" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><text x="16" y="31" font-size="20" fill="#203040" text-anchor="start" font-weight="400">返却場所への案内</text><rect x="100" y="58" width="120" height="58" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="94" font-size="20" fill="#203040" text-anchor="middle" font-weight="400">入口</text><path d="M160 116 V157" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><rect x="65" y="157" width="190" height="67" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="160" y="197" font-size="20" fill="#203040" text-anchor="middle" font-weight="400">返却確認台</text><path d="M160 224 V243" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="243" r="3.5" fill="#267D75"/><path d="M160 243 H87 Q82 243 82 249 V319" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M160 243 H233 Q238 243 238 249 V319" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="82" y="281" font-size="16" fill="#267D75" text-anchor="middle" font-weight="400">破損なし</text><text x="238" y="281" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="400">破損あり</text><rect x="16" y="319" width="136" height="111" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="84" y="348" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">返却箱：空</text><path d="M56 365 H112 V393 H56 Z" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 365 L65 356 H103 L112 365" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="416" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">返却に使える</text><rect x="176" y="319" width="128" height="111" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6"/><text x="240" y="348" font-size="18" fill="#203040" text-anchor="middle" font-weight="400">相談窓口</text><path d="M212 366 H268 V397 H212 Z" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 399 H275" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="461" font-size="15" fill="#203040" text-anchor="middle" font-weight="400">空の返却箱も利用可能</text></g></svg>
