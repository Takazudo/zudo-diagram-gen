<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席のみ。A席は予約済み。B席とC席は空席で選択可能。D席は保留中で選択不可。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#708090" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#174C66" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><text x="16" y="27" font-size="19" fill="#203040" text-anchor="start" font-weight="400">空席と保留中の席</text><rect x="16" y="43" width="156" height="78" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><text x="94" y="72" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">A席：予約済み</text><text x="94" y="101" font-size="14" fill="#708090" text-anchor="middle" font-weight="400">選択不可</text><rect x="188" y="43" width="156" height="78" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="266" y="72" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">B席：空席</text><text x="266" y="101" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可能</text><rect x="16" y="137" width="156" height="78" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="94" y="166" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">C席：空席</text><text x="94" y="195" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可能</text><rect x="188" y="137" width="156" height="78" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6" stroke-dasharray="5 4"/><text x="266" y="166" font-size="16" fill="#203040" text-anchor="middle" font-weight="400">D席：保留中</text><text x="266" y="195" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">選択不可</text><circle cx="12" cy="226" r="3.5" fill="#267D75"/><text x="24" y="231" font-size="14" fill="#267D75" text-anchor="start" font-weight="400">選べる席はB席とC席だけ</text></g></svg>
