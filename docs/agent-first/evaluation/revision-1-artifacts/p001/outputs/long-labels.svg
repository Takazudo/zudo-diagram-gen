<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありなら準備担当に戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#708090" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#174C66" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="25" font-size="19" fill="#203040" text-anchor="start" font-weight="400">長いラベルの担当引継ぎ</text><rect x="150" y="42" width="308" height="66" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="150" y="153" width="308" height="66" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="150" y="279" width="308" height="58" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="304" y="81" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">地域交流イベント開催準備担当</text><text x="304" y="192" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">参加申込内容の確認・連絡担当</text><text x="304" y="315" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">当日受付と案内の担当</text><path d="M304 108 V153" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M304 219 V279" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="322" y="256" font-size="16" fill="#267D75" text-anchor="start" font-weight="400">確認完了</text><circle cx="304" cy="219" r="3.5" fill="#267D75"/><path d="M150 186 H54 Q42 186 42 174 V87 Q42 75 54 75 H150" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="84" y="123" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">不足項目あり</text></g></svg>
