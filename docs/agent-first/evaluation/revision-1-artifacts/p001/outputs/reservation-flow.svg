<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認はない。</desc><defs><marker id="border-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#708090" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L9 5 L2 9" fill="none" stroke="#174C66" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="34" font-size="20" fill="#203040" text-anchor="start" font-weight="400">予約の確定と変更</text><rect x="24" y="83" width="152" height="90" rx="4" fill="#FFFFFF" stroke="#708090" stroke-width="1.6"/><rect x="244" y="83" width="152" height="90" rx="4" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="464" y="83" width="152" height="90" rx="4" fill="#FFFFFF" stroke="#267D75" stroke-width="1.6"/><text x="100" y="126" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">申請</text><text x="320" y="126" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">確認待ち</text><text x="540" y="126" font-size="22" fill="#203040" text-anchor="middle" font-weight="400">確定</text><text x="320" y="153" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="400">まだ確定ではない</text><path d="M176 128 H244" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M396 128 H464" fill="none" stroke="#708090" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#border-arrow)"/><path d="M540 173 V231 Q540 243 528 243 H332 Q320 243 320 231 V173" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><circle cx="540" cy="173" r="3.5" fill="#267D75"/><text x="430" y="225" font-size="17" fill="#267D75" text-anchor="middle" font-weight="400">日時を変更</text><text x="430" y="273" font-size="15" fill="#203040" text-anchor="middle" font-weight="400">確定した予約だけ変更可能</text><text x="430" y="297" font-size="14" fill="#203040" text-anchor="middle" font-weight="400">変更申請は確認待ちへ・自動承認なし</text></g></svg>
