<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み。B席とC席は空席で選択可能。D席は保留中で選択不可。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203040}</style><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5" data-role="ink"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5" data-role="accent"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5" data-role="warning"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5" data-role="deep"/></marker></defs><rect x="0" y="0" width="360" height="240" fill="#FFFFFF" data-role="surface" /><text x="16" y="26" font-size="18" font-weight="600" text-anchor="start" fill="#203040" data-role="ink">空席と保留中の席</text><g transform="rotate(-1 92.0 84.0)"><rect x="21" y="48" width="152" height="82" fill="#708090" data-role="border" opacity=".18"/><rect x="16" y="43" width="152" height="82" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(1 264.0 84.0)"><rect x="193" y="48" width="152" height="82" fill="#708090" data-role="border" opacity=".18"/><rect x="188" y="43" width="152" height="82" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(1 92.0 184.0)"><rect x="21" y="148" width="152" height="82" fill="#708090" data-role="border" opacity=".18"/><rect x="16" y="143" width="152" height="82" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(-1 264.0 184.0)"><rect x="193" y="148" width="152" height="82" fill="#708090" data-role="border" opacity=".18"/><rect x="188" y="143" width="152" height="82" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><rect x="28" y="67" width="36" height="19" fill="#708090" data-role="border" opacity=".18"/><rect x="25" y="64" width="36" height="19" fill="#708090" data-role="border" /><rect x="21" y="86" width="44" height="8" fill="#708090" data-role="border" /><rect x="25" y="94" width="6" height="11" fill="#708090" data-role="border" /><rect x="55" y="94" width="6" height="11" fill="#708090" data-role="border" /><circle cx="43" cy="62" r="8" fill="#203040"/><path d="M30 84Q30 72 43 72Q56 72 56 84Z" fill="#203040"/><text x="108" y="75" font-size="13" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">A席：予約済み</text><text x="108" y="103" font-size="13" font-weight="400" text-anchor="middle" fill="#203040" data-role="ink">選択不可</text><rect x="199" y="67" width="36" height="19" fill="#708090" data-role="border" opacity=".18"/><rect x="196" y="64" width="36" height="19" fill="#267D75" data-role="accent" /><rect x="192" y="86" width="44" height="8" fill="#267D75" data-role="accent" /><rect x="196" y="94" width="6" height="11" fill="#267D75" data-role="accent" /><rect x="226" y="94" width="6" height="11" fill="#267D75" data-role="accent" /><text x="277" y="75" font-size="15" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">B席：空席</text><text x="277" y="103" font-size="13" font-weight="600" text-anchor="middle" fill="#267D75" data-role="accent">選択可能</text><rect x="28" y="167" width="36" height="19" fill="#708090" data-role="border" opacity=".18"/><rect x="25" y="164" width="36" height="19" fill="#267D75" data-role="accent" /><rect x="21" y="186" width="44" height="8" fill="#267D75" data-role="accent" /><rect x="2