<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ進む。確認待ちは確定ではない。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認なし。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203040}</style><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5" data-role="ink"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5" data-role="accent"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5" data-role="warning"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5" data-role="deep"/></marker></defs><rect x="0" y="0" width="640" height="320" fill="#FFFFFF" data-role="surface" /><text x="25" y="31" font-size="20" font-weight="600" text-anchor="start" fill="#203040" data-role="ink">予約の確定と変更</text><g transform="rotate(-2 103.0 137.0)"><rect x="31" y="79" width="154" height="126" fill="#708090" data-role="border" opacity=".18"/><rect x="26" y="74" width="154" height="126" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(1.5 319.0 137.0)"><rect x="247" y="79" width="154" height="126" fill="#708090" data-role="border" opacity=".18"/><rect x="242" y="74" width="154" height="126" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(-1 535.0 137.0)"><rect x="463" y="79" width="154" height="126" fill="#708090" data-role="border" opacity=".18"/><rect x="458" y="74" width="154" height="126" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><text x="103" y="125" font-size="24" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">申請</text><rect x="81" y="145" width="44" height="4" fill="#174C66" data-role="deep" /><rect x="81" y="155" width="31" height="4" fill="#708090" data-role="border" /><circle cx="322" cy="109" r="12" fill="#708090" opacity=".18" data-role="border"/><circle cx="319" cy="106" r="12" fill="#FFFFFF" stroke="#174C66" stroke-width="2" data-role="deep"/><path d="M319 98V106l6 3" fill="none" stroke="#174C66" stroke-width="2" data-role="deep"/><text x="319" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">確認待ち</text><text x="319" y="181" font-size="14" font-weight="400" text-anchor="middle" fill="#203040" data-role="ink">予約確定ではない</text><path d="M524 106l7 7 15-17" fill="none" stroke="#267D75" stroke-width="5" data-role="accent"/><text x="535" y="150" font-size="24" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">確定</text><path d="M188 137C205 132 218 132 234 137" fill="none" stroke="#203040" data-role="ink" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M404 137C421 132 434 132 450 137" fill="none" stroke="#203040" data-role="ink" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M535 208C535 245 535 257 499 257H354C319 257 319 242 319 209" fill="none" stroke="#267D75" data-role="accent" stroke-width="2.1" marker-end="url(#accent-arrow)"/><rect x="406" y="234" width="116" height="33" fill="#FFFFFF" data-role="surface" /><text x="464" y="257" font-size="18" font-weight="600" text-anchor="middle" fill="#267D75" data-role="accent">日時を変更</text><text x="322" y="301" font-size="15" font-weight="400" text-anchor="middle" fill="#203040" data-role="ink">変更申請は確認待ちへ戻る・自動承認なし</text></svg>
