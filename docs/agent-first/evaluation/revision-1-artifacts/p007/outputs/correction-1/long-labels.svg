<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありなら準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203040}</style><defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5" data-role="ink"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.5" data-role="accent"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5" data-role="warning"/></marker><marker id="deep-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#174C66" stroke-width="1.5" data-role="deep"/></marker></defs><rect x="0" y="0" width="480" height="360" fill="#FFFFFF" data-role="surface" /><text x="19" y="27" font-size="19" font-weight="600" text-anchor="start" fill="#203040" data-role="ink">長いラベルの担当引継ぎ</text><g transform="rotate(-1 292.5 79.5)"><rect x="143" y="48" width="309" height="73" fill="#708090" data-role="border" opacity=".18"/><rect x="138" y="43" width="309" height="73" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(1 292.5 189.5)"><rect x="143" y="158" width="309" height="73" fill="#708090" data-role="border" opacity=".18"/><rect x="138" y="153" width="309" height="73" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><g transform="rotate(-1 292.5 306.0)"><rect x="143" y="275" width="309" height="72" fill="#708090" data-role="border" opacity=".18"/><rect x="138" y="270" width="309" height="72" fill="#FFFFFF" data-role="surface" stroke="#708090" stroke-width="1"/></g><text x="292" y="72" font-size="19" font-weight="600" text-anchor="middle"><tspan x="292" dy="0">地域交流イベント</tspan><tspan x="292" dy="25">開催準備担当</tspan></text><text x="292" y="181" font-size="19" font-weight="600" text-anchor="middle"><tspan x="292" dy="0">参加申込内容の</tspan><tspan x="292" dy="25">確認・連絡担当</tspan></text><text x="292" y="313" font-size="20" font-weight="600" text-anchor="middle" fill="#203040" data-role="ink">当日受付と案内の担当</text><path d="M292 121C288 131 288 136 292 145" fill="none" stroke="#203040" data-role="ink" stroke-width="2.1" marker-end="url(#ink-arrow)"/><path d="M292 232V261" fill="none" stroke="#267D75" data-role="accent" stroke-width="2.1" marker-end="url(#accent-arrow)"/><rect x="307" y="234" width="94" height="27" fill="#FFFFFF" data-role="surface" /><text x="354" y="254" font-size="17" font-weight="600" text-anchor="middle" fill="#267D75" data-role="accent">確認完了</text><path d="M130 189H58C35 189 35 170 35 153V80C35 66 51 64 69 64H128" fill="none" stroke="#B85A18" data-role="warning" stroke-width="2.1" marker-end="url(#warning-arrow)"/><rect x="43" y="111" width="89" height="49" fill="#FFFFFF" data-role="surface" /><text x="87" y="130" font-size="14" font-weight="600" text-anchor="middle"><tspan x="87" dy="0">不足項目あり</tspan></text></svg>
