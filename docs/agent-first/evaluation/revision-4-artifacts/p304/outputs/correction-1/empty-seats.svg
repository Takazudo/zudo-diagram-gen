<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み。B席とC席は空席で選択可能。D席は保留中で選択不可。</desc><defs><pattern id="rules" width="360" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H360" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern><marker id="ink-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="url(#rules)"/><path d="M12 0 L13 240" fill="none" stroke="#267D75" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".2"/><text x="25" y="30" font-size="20" fill="#203040" text-anchor="start" font-weight="700">空席と保留中の席</text><path d="M25 51 L168 49 L169 119 L24 121 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.8"/><path d="M23 49 L170 51 L167 122 L26 120" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="96.5" y="76" font-size="15" fill="#174C66" text-anchor="middle" font-weight="600">A席：予約済み</text><text x="96.5" y="103" font-size="15" fill="#174C66" text-anchor="middle" font-weight="700">選択不可</text><path d="M191 51 L334 49 L335 119 L190 121 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M189 49 L336 51 L333 122 L192 120" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="262.5" y="76" font-size="15" fill="#267D75" text-anchor="middle" font-weight="600">B席：空席</text><text x="262.5" y="103" font-size="15" fill="#267D75" text-anchor="middle" font-weight="700">選択可</text><path d="M237 109 Q262 107 289 110" fill="none" stroke="#267D75" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 147 L168 145 L169 215 L24 217 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M23 145 L170 147 L167 218 L26 216" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="96.5" y="172" font-size="15" fill="#267D75" text-anchor="middle" font-weight="600">C席：空席</text><text x="96.5" y="199" font-size="15" fill="#267D75" text-anchor="middle" font-weight="700">選択可</text><path d="M71 205 Q96 203 123 206" fill="none" stroke="#267D75" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M191 147 L334 145 L335 215 L190 217 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M189 145 L336 147 L333 218 L192 216" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M199 209 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 209 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M213 209 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 209 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M227 209 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="262.5" y="172" font-size="15" fill="#203040" text-anchor="middle" font-weight="600">D席：保留中</text><text x="262.5" y="199" font-size="15" fill="#203040" text-anchor="middle" font-weight="700">選択不可</text></g></svg>
