<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認はない。</desc><defs><pattern id="rules" width="640" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H640" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern><marker id="ink-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M12 0 L13 320" fill="none" stroke="#267D75" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".2"/><text x="28" y="33" font-size="22" fill="#203040" text-anchor="start" font-weight="700">予約の確定と変更</text><path d="M36 76 L184 74 L185 158 L35 160 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M34 74 L186 76 L183 161 L37 159" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 152 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 152 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 152 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 152 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 152 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 76 L400 74 L401 158 L251 160 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M250 74 L402 76 L399 161 L253 159" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M468 76 L606 74 L607 158 L467 160 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M466 74 L608 76 L605 161 L469 159" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="123" font-size="24" fill="#203040" text-anchor="middle" font-weight="600">申請</text><text x="326" y="123" font-size="24" fill="#203040" text-anchor="middle" font-weight="600">確認待ち</text><text x="537" y="123" font-size="24" fill="#267D75" text-anchor="middle" font-weight="700">確定</text><path d="M192 115 Q218 111 243 115" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M409 115 Q433 119 459 115" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><text x="326" y="185" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="400">予約は未確定</text><path d="M515 143 l5 5 l11 -12" fill="none" stroke="#267D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M539 166 Q542 226 523 235 L276 235 L276 166" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><rect x="423" y="217" width="132" height="27" fill="#FFFFFF"/><text x="489" y="237" font-size="18" fill="#267D75" text-anchor="middle" font-weight="600">日時を変更</text><text x="537" y="207" font-size="14" fill="#203040" text-anchor="middle" font-weight="400">確定した予約のみ</text><text x="326" y="279" font-size="17" fill="#203040" text-anchor="middle" font-weight="400">変更申請は確認待ちへ戻る</text><text x="326" y="303" font-size="15" fill="#B85A18" text-anchor="middle" font-weight="400">自動承認なし</text></g></svg>
