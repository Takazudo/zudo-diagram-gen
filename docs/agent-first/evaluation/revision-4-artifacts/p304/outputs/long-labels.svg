<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認担当へ資料を渡す。不足項目ありの場合は準備担当へ戻し、確認完了なら当日受付と案内の担当へ渡す。</desc><defs><pattern id="rules" width="480" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H480" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern><marker id="ink-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#203040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#267D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B85A18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M12 0 L13 360" fill="none" stroke="#267D75" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".2"/><text x="24" y="29" font-size="21" fill="#203040" text-anchor="start" font-weight="700">長いラベルの担当引継ぎ</text><path d="M111 49 L449 47 L450 110 L110 112 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M109 47 L451 49 L448 113 L112 111" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 104 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 104 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M133 104 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 104 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M147 104 l6 -6" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M111 159 L449 157 L450 220 L110 222 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M109 157 L451 159 L448 223 L112 221" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M111 276 L449 274 L450 334 L110 336 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M109 274 L451 276 L448 337 L112 335" fill="none" stroke="#708090" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="86" font-size="19" fill="#203040" text-anchor="middle" font-weight="600">地域交流イベント開催準備担当</text><text x="280" y="196" font-size="19" fill="#203040" text-anchor="middle" font-weight="600">参加申込内容の確認・連絡担当</text><text x="280" y="312" font-size="20" fill="#267D75" text-anchor="middle" font-weight="600">当日受付と案内の担当</text><path d="M280 116 Q278 135 280 150" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><text x="313" y="140" font-size="14" fill="#203040" text-anchor="start" font-weight="400">資料</text><path d="M280 228 Q282 248 280 267" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="302" y="251" font-size="17" fill="#267D75" text-anchor="start" font-weight="600">確認完了</text><path d="M103 190 L44 190 Q41 190 42 179 L42 80 L103 80" fill="none" stroke="#B85A18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><rect x="18" y="121" width="124" height="25" fill="#FFFFFF"/><text x="80" y="140" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="600">不足項目あり</text></g></svg>
