<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ進む。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認なし。</desc><defs><pattern id="rules" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24" stroke="#708090" stroke-width=".6" opacity=".13"/></pattern><marker id="ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="border" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M16 8L17 312" stroke="#708090" stroke-width=".8" opacity=".25"/><text x="31" y="35" font-size="20" fill="#203040" text-anchor="start" font-weight="700">予約の確定と変更</text><path d="M33 84L182 82L181 157L32 158Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M31 82L184 84L183 159L34 156" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M43 101l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#203040" stroke-width=".8" opacity=".55"/><text x="107" y="129" font-size="24" fill="#203040" text-anchor="middle" font-weight="500">申請</text><path d="M246 84L395 82L394 157L245 158Z" fill="#FFFFFF" stroke="#708090" stroke-width="1.8"/><path d="M244 82L397 84L396 159L247 156" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M256 101l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#708090" stroke-width=".8" opacity=".55"/><text x="320" y="129" font-size="24" fill="#708090" text-anchor="middle" font-weight="500">確認待ち</text><path d="M459 84L608 82L607 157L458 158Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M457 82L610 84L609 159L460 156" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M469 101l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#267D75" stroke-width=".8" opacity=".55"/><text x="533" y="129" font-size="24" fill="#267D75" text-anchor="middle" font-weight="500">確定</text><path d="M188 120Q213 118 238 121" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/><path d="M400 120Q426 122 451 120" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/><text x="320" y="179" font-size="16" fill="#174C66" text-anchor="middle" font-weight="500">まだ予約確定ではない</text><path d="M533 160Q531 174 533 186" fill="none" stroke="#267D75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><path d="M469 194L607 192L606 227L468 228Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M467 192L609 194L608 229L470 226" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><text x="537" y="216" font-size="18" fill="#267D75" text-anchor="middle" font-weight="500">日時を変更</text><path d="M536 232Q538 263 525 264L438 264Q425 264 425 251L425 157Q425 144 412 144L402 144" fill="none" stroke="#267D75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="425" y="286" font-size="16" fill="#267D75" text-anchor="middle" font-weight="500">変更申請 → 確認待ち</text><text x="30" y="309" font-size="15" fill="#174C66" text-anchor="start" font-weight="500">確定した予約だけ変更可・自動承認なし</text></g></svg>
