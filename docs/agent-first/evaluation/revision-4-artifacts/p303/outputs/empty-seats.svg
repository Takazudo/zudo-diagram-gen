<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み、B席とC席は空席で選択可、D席は保留中で選択不可。</desc><defs><pattern id="rules" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24" stroke="#708090" stroke-width=".6" opacity=".13"/></pattern><marker id="ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="border" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="url(#rules)"/><path d="M16 8L17 232" stroke="#708090" stroke-width=".8" opacity=".25"/><text x="27" y="31" font-size="18" fill="#203040" text-anchor="start" font-weight="700">空席と保留中の席</text><path d="M29 54L171 52L170 117L28 118Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M27 52L173 54L172 119L30 116" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><text x="99.5" y="79" font-size="15" fill="#203040" text-anchor="middle" font-weight="600">A席：予約済み</text><text x="99.5" y="102" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">選択不可</text><path d="M191 54L333 52L332 117L190 118Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M189 52L335 54L334 119L192 116" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><text x="261.5" y="79" font-size="15" fill="#267D75" text-anchor="middle" font-weight="600">B席：空席</text><text x="261.5" y="102" font-size="14" fill="#267D75" text-anchor="middle" font-weight="500">選択可</text><path d="M222 109Q262 107 300 109" fill="none" stroke="#267D75" stroke-width="1.1"/><path d="M29 144L171 142L170 207L28 208Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M27 142L173 144L172 209L30 206" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><text x="99.5" y="169" font-size="15" fill="#267D75" text-anchor="middle" font-weight="600">C席：空席</text><text x="99.5" y="192" font-size="14" fill="#267D75" text-anchor="middle" font-weight="500">選択可</text><path d="M60 199Q100 197 138 199" fill="none" stroke="#267D75" stroke-width="1.1"/><path d="M191 144L333 142L332 207L190 208Z" fill="#FFFFFF" stroke="#708090" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M189 142L335 144L334 209L192 206" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><text x="261.5" y="169" font-size="15" fill="#708090" text-anchor="middle" font-weight="600">D席：保留中</text><text x="261.5" y="192" font-size="14" fill="#708090" text-anchor="middle" font-weight="500">選択不可</text><text x="181" y="230" font-size="14" fill="#174C66" text-anchor="middle" font-weight="500">選べる席はB席とC席だけ</text></g></svg>
