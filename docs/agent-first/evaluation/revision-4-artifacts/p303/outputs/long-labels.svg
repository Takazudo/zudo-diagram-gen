<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><defs><pattern id="rules" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24" stroke="#708090" stroke-width=".6" opacity=".13"/></pattern><marker id="ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#203040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#267D75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#B85A18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="border" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#708090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M16 8L17 352" stroke="#708090" stroke-width=".8" opacity=".25"/><text x="28" y="31" font-size="20" fill="#203040" text-anchor="start" font-weight="700">長いラベルの担当引継ぎ</text><path d="M133 53L448 51L447 114L132 115Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M131 51L450 53L449 116L134 113" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M143 68l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#203040" stroke-width=".8" opacity=".55"/><text x="290" y="92" font-size="18" fill="#203040" text-anchor="middle" font-weight="500">地域交流イベント開催準備担当</text><path d="M133 157L448 155L447 218L132 219Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M131 155L450 157L449 220L134 217" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M143 172l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#203040" stroke-width=".8" opacity=".55"/><text x="290" y="196" font-size="18" fill="#203040" text-anchor="middle" font-weight="500">参加申込内容の確認・連絡担当</text><path d="M133 270L448 268L447 331L132 332Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M131 268L450 270L449 333L134 330" fill="none" stroke="#708090" stroke-width=".65" opacity=".65"/><path d="M143 285l9 -8m-1 10l10 -9m-1 10l10 -9" fill="none" stroke="#267D75" stroke-width=".8" opacity=".55"/><text x="290" y="309" font-size="18" fill="#267D75" text-anchor="middle" font-weight="500">当日受付と案内の担当</text><path d="M290 118Q288 133 290 148" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/><text x="315" y="138" font-size="14" fill="#174C66" text-anchor="start" font-weight="500">資料</text><path d="M290 222Q292 240 290 261" fill="none" stroke="#267D75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="316" y="249" font-size="16" fill="#267D75" text-anchor="start" font-weight="500">確認完了</text><path d="M126 186Q38 190 38 176L38 92Q38 81 51 82L125 83" fill="none" stroke="#B85A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning)"/><text x="50" y="137" font-size="13" fill="#B85A18" text-anchor="start" font-weight="500">不足項目あり</text></g></svg>
