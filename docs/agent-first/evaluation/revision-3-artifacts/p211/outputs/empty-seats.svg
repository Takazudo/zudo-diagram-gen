<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み、B席とC席だけが空席で選択可能。D席は保留中で選択不可。</desc><defs><marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="360" height="240" fill="#FFFFFF"/><text x="180" y="27" font-size="16" fill="#203040" font-weight="700" text-anchor="middle">選べる席はB席とC席だけ</text><g transform="rotate(-2 92.0 85.0)"><rect x="22" y="53" width="148" height="74" fill="#708090" opacity=".18"/><rect x="16" y="46" width="148" height="74" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="18" y="48" width="148" height="74" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M26 57H52V63H26Z" fill="#174C66"/><text x="92" y="81" font-size="16" fill="#203040" font-weight="700" text-anchor="middle">A席：予約済み</text><text x="92" y="106" font-size="14" fill="#174C66" font-weight="700" text-anchor="middle">選択不可</text><g transform="rotate(2 266.0 85.0)"><rect x="196" y="53" width="148" height="74" fill="#708090" opacity=".18"/><rect x="190" y="46" width="148" height="74" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="192" y="48" width="148" height="74" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M200 57H226V63H200Z" fill="#267D75"/><text x="266" y="81" font-size="16" fill="#203040" font-weight="700" text-anchor="middle">B席：空席</text><text x="266" y="106" font-size="14" fill="#267D75" font-weight="700" text-anchor="middle">選択可</text><path d="M204 101l4 4 8-9" fill="none" stroke="#267D75" stroke-width="2"/><g transform="rotate(2 92.0 183.0)"><rect x="22" y="151" width="148" height="74" fill="#708090" opacity=".18"/><rect x="16" y="144" width="148" height="74" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="18" y="146" width="148" height="74" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M26 155H52V161H26Z" fill="#267D75"/><text x="92" y="179" font-size="16" fill="#203040" font-weight="700" text-anchor="middle">C席：空席</text><text x="92" y="204" font-size="14" fill="#267D75" font-weight="700" text-anchor="middle">選択可</text><path d="M30 199l4 4 8-9" fill="none" stroke="#267D75" stroke-width="2"/><g transform="rotate(-2 266.0 183.0)"><rect x="196" y="151" width="148" height="74" fill="#708090" opacity=".18"/><rect x="190" y="144" width="148" height="74" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="192" y="146" width="148" height="74" fill="#FFFFFF" stroke="#708090" stroke-width="1.3"/><path d="M200 155H226V161H200Z" fill="#708090"/><text x="266" y="179" font-size="16" fill="#203040" font-weight="700" text-anchor="middle">D席：保留中</text><text x="266" y="204" font-size="14" fill="#708090" font-weight="700" text-anchor="middle">選択不可</text><circle cx="210" cy="199" r="7" fill="none" stroke="#708090"/><path d="M210 194v5l3 2" stroke="#708090" fill="none"/></g></svg>
