<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら返却箱、破損ありなら相談窓口。返却箱は現在空でも返却に使える。</desc><defs><marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><g transform="rotate(-2 160.0 54.0)"><rect x="92" y="27" width="144" height="64" fill="#708090" opacity=".18"/><rect x="86" y="20" width="144" height="64" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="88" y="22" width="144" height="64" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M96 31H122V37H96Z" fill="#174C66"/><text x="160" y="63" font-size="22" fill="#203040" font-weight="700" text-anchor="middle">入口</text><path d="M160 92V124" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#i)"/><g transform="rotate(1.5 160.0 165.0)"><rect x="68" y="137" width="192" height="66" fill="#708090" opacity=".18"/><rect x="62" y="130" width="192" height="66" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="64" y="132" width="192" height="66" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M72 141H98V147H72Z" fill="#174C66"/><text x="160" y="173" font-size="21" fill="#203040" font-weight="700" text-anchor="middle">返却確認台</text><path d="M160 204V229H82V246M160 229H242V246" fill="none" stroke="#203040" stroke-width="2"/><text x="82" y="267" font-size="16" fill="#267D75" font-weight="700" text-anchor="middle">破損なし</text><text x="242" y="267" font-size="16" fill="#B85A18" font-weight="700" text-anchor="middle">破損あり</text><path d="M82 274V289" fill="none" stroke="#267D75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M242 274V289" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#w)"/><g transform="rotate(-1.5 84.0 359.5)"><rect x="22" y="302" width="132" height="125" fill="#708090" opacity=".18"/><rect x="16" y="295" width="132" height="125" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="18" y="297" width="132" height="125" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M26 306H52V312H26Z" fill="#267D75"/><text x="84" y="335" font-size="17" fill="#203040" font-weight="700" text-anchor="middle">返却箱：空</text><path d="M54 350H114V387H54Z M54 350l10-10h40l10 10" fill="none" stroke="#267D75" stroke-width="1.8"/><path d="M54 350H114" stroke="#267D75" stroke-dasharray="3 3"/><text x="84" y="410" font-size="14" fill="#267D75" font-weight="700" text-anchor="middle">返却に使える</text><g transform="rotate(1.5 237.0 339.0)"><rect x="176" y="302" width="130" height="84" fill="#708090" opacity=".18"/><rect x="170" y="295" width="130" height="84" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="172" y="297" width="130" height="84" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.3"/><path d="M180 306H206V312H180Z" fill="#B85A18"/><text x="237" y="341" font-size="20" fill="#203040" font-weight="700" text-anchor="middle">相談窓口</text><text x="160" y="459" font-size="16" fill="#203040" font-weight="500" text-anchor="middle">空でも返却に使える</text></g></svg>
