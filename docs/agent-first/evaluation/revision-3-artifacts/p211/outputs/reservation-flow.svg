<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。日時を変更できるのは確定した予約だけ。変更申請は確認待ちに戻り、自動承認はない。</desc><defs><marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="32" font-size="21" fill="#203040" font-weight="700" text-anchor="start">予約の確定と変更</text><g transform="rotate(-2 104.0 128.0)"><rect x="32" y="81" width="152" height="104" fill="#708090" opacity=".18"/><rect x="26" y="74" width="152" height="104" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="28" y="76" width="152" height="104" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M36 85H62V91H36Z" fill="#174C66"/><text x="154" y="101" font-size="14" fill="#174C66" font-weight="700" text-anchor="middle">1</text><text x="104" y="132" font-size="23" fill="#203040" font-weight="700" text-anchor="middle">申請</text><g transform="rotate(2 318.0 128.0)"><rect x="246" y="81" width="152" height="104" fill="#708090" opacity=".18"/><rect x="240" y="74" width="152" height="104" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="242" y="76" width="152" height="104" fill="#FFFFFF" stroke="#708090" stroke-width="1.3"/><path d="M250 85H276V91H250Z" fill="#708090"/><text x="368" y="101" font-size="14" fill="#708090" font-weight="700" text-anchor="middle">2</text><text x="318" y="132" font-size="23" fill="#203040" font-weight="700" text-anchor="middle">確認待ち</text><text x="318" y="160" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">予約確定ではない</text><g transform="rotate(-2 532.0 128.0)"><rect x="460" y="81" width="152" height="104" fill="#708090" opacity=".18"/><rect x="454" y="74" width="152" height="104" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="456" y="76" width="152" height="104" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M464 85H490V91H464Z" fill="#267D75"/><text x="582" y="101" font-size="14" fill="#267D75" font-weight="700" text-anchor="middle">3</text><text x="532" y="132" font-size="23" fill="#203040" font-weight="700" text-anchor="middle">確定</text><path d="M510 154l7 7 16-17" fill="none" stroke="#267D75" stroke-width="2.4"/><path d="M188 128H232" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#i)"/><path d="M402 128H446" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#i)"/><path d="M532 186V239H318V187" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#w)"/><rect x="393" y="220" width="142" height="36" fill="#FFFFFF" stroke="#B85A18"/><text x="464" y="244" font-size="18" fill="#B85A18" font-weight="700" text-anchor="middle">日時を変更</text><text x="320" y="287" font-size="16" fill="#203040" font-weight="500" text-anchor="middle">確定した予約のみ変更可・変更申請は確認待ちへ</text><text x="320" y="309" font-size="14" fill="#708090" font-weight="500" text-anchor="middle">自動承認なし</text></g></svg>
