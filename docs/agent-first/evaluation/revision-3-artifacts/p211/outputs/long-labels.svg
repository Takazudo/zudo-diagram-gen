<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認・連絡担当へ資料を渡す。不足項目ありなら準備担当へ戻す。確認完了なら当日受付と案内の担当へ渡す。</desc><defs><marker id="i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><g transform="rotate(-1.5 288.0 62.0)"><rect x="132" y="33" width="320" height="68" fill="#708090" opacity=".18"/><rect x="126" y="26" width="320" height="68" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="128" y="28" width="320" height="68" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M136 37H162V43H136Z" fill="#174C66"/><text x="288" y="71" font-size="17" fill="#203040" font-weight="700" text-anchor="middle">地域交流イベント開催準備担当</text><g transform="rotate(1.5 288.0 184.0)"><rect x="132" y="155" width="320" height="68" fill="#708090" opacity=".18"/><rect x="126" y="148" width="320" height="68" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="128" y="150" width="320" height="68" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M136 159H162V165H136Z" fill="#174C66"/><text x="288" y="193" font-size="17" fill="#203040" font-weight="700" text-anchor="middle">参加申込内容の確認・連絡担当</text><g transform="rotate(-1.5 288.0 308.0)"><rect x="132" y="279" width="320" height="68" fill="#708090" opacity=".18"/><rect x="126" y="272" width="320" height="68" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="128" y="274" width="320" height="68" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M136 283H162V289H136Z" fill="#267D75"/><text x="288" y="317" font-size="17" fill="#203040" font-weight="700" text-anchor="middle">当日受付と案内の担当</text><path d="M288 103V143" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#i)"/><text x="313" y="125" font-size="14" fill="#203040" font-weight="500" text-anchor="start">資料</text><path d="M288 225V267" fill="none" stroke="#267D75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="305" y="250" font-size="16" fill="#267D75" font-weight="700" text-anchor="start">確認完了</text><path d="M122 184H20V63H121" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#w)"/><text x="29" y="132" font-size="14" fill="#B85A18" font-weight="700" text-anchor="start">不足項目あり</text></g></svg>
