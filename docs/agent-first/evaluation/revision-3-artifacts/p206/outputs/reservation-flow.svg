<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ進む。確認待ちは予約確定ではない。確定だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認はない。</desc>
<style>text{font-family:'Noto Sans CJK JP',sans-serif}</style>
<rect width="640" height="320" fill="#FFFFFF"/><g stroke="#708090" stroke-width=".65" opacity=".13"><path d="M0 23 H640"/><path d="M0 47 H640"/><path d="M0 71 H640"/><path d="M0 95 H640"/><path d="M0 119 H640"/><path d="M0 143 H640"/><path d="M0 167 H640"/><path d="M0 191 H640"/><path d="M0 215 H640"/><path d="M0 239 H640"/><path d="M0 263 H640"/><path d="M0 287 H640"/><path d="M0 311 H640"/></g><path d="M15 0 L16 320" stroke="#267D75" stroke-width=".8" opacity=".19"/>
<text x="31" y="34" font-size="20" fill="#203040" text-anchor="start" font-weight="600">予約の確定と変更</text><path d="M39 87 L186 85 L188 167 L38 169 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M37 85 L188 87 L186 171 L40 168" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><path d="M158 94 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M164 94 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M170 94 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M176 94 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><text x="113" y="135" font-size="23" fill="#203040" text-anchor="middle" font-weight="500">申請</text><path d="M246 87 L393 85 L395 167 L245 169 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.7" stroke-dasharray="6 4"/><path d="M244 85 L395 87 L393 171 L247 168" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><text x="320" y="135" font-size="23" fill="#174C66" text-anchor="middle" font-weight="500">確認待ち</text><path d="M453 87 L600 85 L602 167 L452 169 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M451 85 L602 87 L600 171 L454 168" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><path d="M572 94 l5 -5" stroke="#267D75" opacity=".5" stroke-width=".9"/><path d="M578 94 l5 -5" stroke="#267D75" opacity=".5" stroke-width=".9"/><path d="M584 94 l5 -5" stroke="#267D75" opacity=".5" stroke-width=".9"/><path d="M590 94 l5 -5" stroke="#267D75" opacity=".5" stroke-width=".9"/><text x="527" y="135" font-size="23" fill="#267D75" text-anchor="middle" font-weight="600">確定</text><path d="M199 126 Q215 123 233 126" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 130 L233 126 L225 122" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M406 126 Q423 128 440 126" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M432 130 L440 126 L432 122" fill="none" stroke="#203040" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="198" font-size="16" fill="#174C66" text-anchor="middle" font-weight="400">予約確定ではない</text><path d="M527 180 Q530 232 510 233 L342 233 Q320 232 320 218" fill="none" stroke="#174C66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M324 226 L320 218 L316 226" fill="none" stroke="#174C66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="224" font-size="18" fill="#174C66" text-anchor="middle" font-weight="500">日時を変更</text><text x="34" y="279" font-size="16" fill="#203040" text-anchor="start" font-weight="400">確定した予約だけ変更できる</text><text x="34" y="301" font-size="16" fill="#203040" text-anchor="start" font-weight="400">変更申請は確認待ちへ戻る・自動承認なし</text>
</svg>