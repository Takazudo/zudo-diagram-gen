<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済みで選択不可。B席とC席は空席で選択可能。D席は保留中で選択不可。</desc>
<style>text{font-family:'Noto Sans CJK JP',sans-serif}</style>
<rect width="360" height="240" fill="#FFFFFF"/><g stroke="#708090" stroke-width=".65" opacity=".13"><path d="M0 23 H360"/><path d="M0 47 H360"/><path d="M0 71 H360"/><path d="M0 95 H360"/><path d="M0 119 H360"/><path d="M0 143 H360"/><path d="M0 167 H360"/><path d="M0 191 H360"/><path d="M0 215 H360"/><path d="M0 239 H360"/></g><path d="M15 0 L16 240" stroke="#267D75" stroke-width=".8" opacity=".19"/>
<text x="26" y="29" font-size="18" fill="#203040" text-anchor="start" font-weight="600">空席と保留中の席</text><path d="M27 50 L168 48 L170 122 L26 124 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M25 48 L170 50 L168 126 L28 123" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><path d="M140 57 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M146 57 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M152 57 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><path d="M158 57 l5 -5" stroke="#203040" opacity=".5" stroke-width=".9"/><text x="98" y="77" font-size="16" fill="#203040" text-anchor="middle" font-weight="500">A席：予約済み</text><text x="98" y="106" font-size="14" fill="#203040" text-anchor="middle" font-weight="400">選択不可</text><path d="M192 50 L333 48 L335 122 L191 124 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M190 48 L335 50 L333 126 L193 123" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><text x="263" y="77" font-size="16" fill="#267D75" text-anchor="middle" font-weight="500">B席：空席</text><text x="263" y="106" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可能</text><path d="M27 142 L168 140 L170 214 L26 216 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M25 140 L170 142 L168 218 L28 215" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><text x="98" y="169" font-size="16" fill="#267D75" text-anchor="middle" font-weight="500">C席：空席</text><text x="98" y="198" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選択可能</text><path d="M192 142 L333 140 L335 214 L191 216 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.7" stroke-dasharray="6 4"/><path d="M190 140 L335 142 L333 218 L193 215" fill="none" stroke="#708090" stroke-width=".75" opacity=".55"/><text x="263" y="169" font-size="16" fill="#174C66" text-anchor="middle" font-weight="500">D席：保留中</text><text x="263" y="198" font-size="14" fill="#174C66" text-anchor="middle" font-weight="400">選択不可</text><text x="180" y="235" font-size="14" fill="#267D75" text-anchor="middle" font-weight="400">選べる席はB席とC席だけ</text>
</svg>