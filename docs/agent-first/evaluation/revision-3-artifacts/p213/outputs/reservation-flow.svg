<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title description"><title id="title">予約の確定と変更</title><desc id="description">申請から確認待ちを経て確定。確認待ちは未確定。確定の日時を変更すると確認待ちへ戻り、自動承認はない。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><symbol id="motif" viewBox="0 0 200 120" preserveAspectRatio="none"><g transform="translate(0 0)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(50 0)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(100 0)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(150 0)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(0 60)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(50 60)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(100 60)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g><g transform="translate(150 60)"><path d="M0 58V25C0 11 11 0 25 0S50 11 50 25V58H37V25C37 18 32 13 25 13S13 18 13 25V58Z" fill="#174C66"/><path d="M19 58V25C19 22 22 19 25 19S31 22 31 25V58Z" fill="#267D75"/></g></symbol><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#203040"/></marker><marker id="warn-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#B85A18"/></marker></defs><rect x="0" y="0" width="640" height="320" fill="#FFFFFF" /><text x="24" y="29" font-size="19" font-weight="600" text-anchor="start" fill="#203040">予約の確定と変更</text><g transform="rotate(-2 100.0 123.0)"><rect x="24" y="64" width="160" height="126" fill="#708090" opacity=".28"/><rect x="20" y="60" width="160" height="126" fill="#FFFFFF" /><use href="#motif" x="23" y="63" width="154" height="120" preserveAspectRatio="none"/></g><g transform="rotate(1 104.0 150.72)"><rect x="33" y="124.47999999999999" width="150" height="60.48" fill="#708090" opacity=".22"/><rect x="29" y="120.47999999999999" width="150" height="60.48" fill="#FFFFFF" /></g><text x="104.0" y="153.24" font-size="22" font-weight="600" text-anchor="middle" fill="#203040"><tspan x="104.0" dy="0">申請</tspan></text><g transform="rotate(-2 320.0 123.0)"><rect x="239" y="64" width="170" height="126" fill="#708090" opacity=".28"/><rect x="235" y="60" width="170" height="126" fill="#FFFFFF" /><use href="#motif" x="238" y="63" width="164" height="120" preserveAspectRatio="none"/></g><g transform="rotate(1 324.0 150.72)"><rect x="248" y="124.47999999999999" width="160" height="60.48" fill="#708090" opacity=".22"/><rect x="244" y="120.47999999999999" width="160" height="60.48" fill="#FFFFFF" /></g><text x="324.0" y="153.24" font-size="22" font-weight="600" text-anchor="middle" fill="#203040"><tspan x="324.0" dy="0">確認待ち</tspan></text><g transform="rotate(-2 540.0 123.0)"><rect x="464" y="64" width="160" height="126" fill="#708090" opacity=".28"/><rect x="460" y="60" width="160" height="126" fill="#FFFFFF