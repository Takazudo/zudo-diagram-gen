<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。確定した予約の日時変更申請は確認待ちに戻る。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="rules" width="640" height="24" patternUnits="userSpaceOnUse"><path d="M0 23 H640" stroke="#708090" stroke-width=".7" opacity=".14"/></pattern></defs><rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M18 6 L19 314" stroke="#267D75" stroke-width=".7" opacity=".25"/><text x="34" y="32" font-size="21" fill="#203040" font-weight="600" text-anchor="start">予約の確定と変更</text><path d="M44 72 L190 70 L192 152 L45 154 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M46 70 L192 73 L190 156 L43 152" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M52 145 l8 -8 M63 146 l9 -9 M75 145 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="118" y="119" font-size="23" fill="#203040" font-weight="600" text-anchor="middle">申請</text><path d="M246 72 L392 70 L394 152 L247 154 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M248 70 L394 73 L392 156 L245 152" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M254 145 l8 -8 M265 146 l9 -9 M277 145 l7 -7" stroke="#B85A18" stroke-width=".8" opacity=".6" fill="none"/><text x="320" y="119" font-size="23" fill="#B85A18" font-weight="600" text-anchor="middle">確認待ち</text><path d="M448 72 L594 70 L596 152 L449 154 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M450 70 L596 73 L594 156 L447 152" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M456 145 l8 -8 M467 146 l9 -9 M479 145 l7 -7" stroke="#267D75" stroke-width=".8" opacity=".6" fill="none"/><text x="522" y="119" font-size="23" fill="#267D75" font-weight="600" text-anchor="middle">確定</text><path d="M199 110 Q217 108 238 110" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><path d="M401 110 Q417 112 440 110" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><text x="320" y="57" font-size="16" fill="#B85A18" font-weight="500" text-anchor="middle">予約確定ではない</text><path d="M522 157 Q524 198 522 245 Q423 248 320 245 L320 158" stroke="#B85A18" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warning)"/><rect x="433" y="214" width="130" height="27" fill="#FFFFFF"/><text x="498" y="235" font-size="18" fill="#174C66" font-weight="600" text-anchor="middle">日時を変更</text><text x="320" y="279" font-size="17" fill="#174C66" font-weight="500" text-anchor="middle">確定した予約だけ変更できる</text><text x="320" y="304" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">変更申請は確認待ちへ戻る・自動承認なし</text></svg>
