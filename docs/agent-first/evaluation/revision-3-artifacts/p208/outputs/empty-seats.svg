<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み、B席とC席は空席で選択可、D席は保留中で選択不可。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="rules" width="360" height="24" patternUnits="userSpaceOnUse"><path d="M0 23 H360" stroke="#708090" stroke-width=".7" opacity=".14"/></pattern></defs><rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="url(#rules)"/><path d="M18 6 L19 234" stroke="#267D75" stroke-width=".7" opacity=".25"/><text x="30" y="27" font-size="19" fill="#203040" font-weight="600" text-anchor="start">空席と保留中の席</text><path d="M30 47 L170 45 L172 108 L31 110 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.8"/><path d="M32 45 L172 48 L170 112 L29 108" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M38 101 l8 -8 M49 102 l9 -9 M61 101 l7 -7" stroke="#174C66" stroke-width=".8" opacity=".6" fill="none"/><text x="101" y="72" font-size="16" fill="#174C66" font-weight="600" text-anchor="middle">A席：予約済み</text><text x="101" y="96" font-size="13" fill="#174C66" font-weight="500" text-anchor="middle">選択不可</text><path d="M190 47 L330 45 L332 108 L191 110 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M192 45 L332 48 L330 112 L189 108" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M198 101 l8 -8 M209 102 l9 -9 M221 101 l7 -7" stroke="#267D75" stroke-width=".8" opacity=".6" fill="none"/><text x="261" y="72" font-size="16" fill="#267D75" font-weight="600" text-anchor="middle">B席：空席</text><text x="261" y="96" font-size="13" fill="#267D75" font-weight="500" text-anchor="middle">選択可</text><path d="M30 128 L170 126 L172 189 L31 191 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M32 126 L172 129 L170 193 L29 189" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M38 182 l8 -8 M49 183 l9 -9 M61 182 l7 -7" stroke="#267D75" stroke-width=".8" opacity=".6" fill="none"/><text x="101" y="153" font-size="16" fill="#267D75" font-weight="600" text-anchor="middle">C席：空席</text><text x="101" y="177" font-size="13" fill="#267D75" font-weight="500" text-anchor="middle">選択可</text><path d="M190 128 L330 126 L332 189 L191 191 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M192 126 L332 129 L330 193 L189 189" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M198 182 l8 -8 M209 183 l9 -9 M221 182 l7 -7" stroke="#B85A18" stroke-width=".8" opacity=".6" fill="none"/><text x="261" y="153" font-size="16" fill="#B85A18" font-weight="600" text-anchor="middle">D席：保留中</text><text x="261" y="177" font-size="13" fill="#B85A18" font-weight="500" text-anchor="middle">選択不可</text><text x="180" y="222" font-size="15" fill="#267D75" font-weight="600" text-anchor="middle">選べる席はB席とC席だけ</text></svg>
