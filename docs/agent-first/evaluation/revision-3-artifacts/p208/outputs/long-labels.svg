<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認担当へ資料を渡す。不足項目ありなら準備担当へ戻し、確認完了なら受付担当へ渡す。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="rules" width="480" height="24" patternUnits="userSpaceOnUse"><path d="M0 23 H480" stroke="#708090" stroke-width=".7" opacity=".14"/></pattern></defs><rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M18 6 L19 354" stroke="#267D75" stroke-width=".7" opacity=".25"/><text x="31" y="29" font-size="20" fill="#203040" font-weight="600" text-anchor="start">長いラベルの担当引継ぎ</text><path d="M38 50 L336 48 L338 115 L39 117 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M40 48 L338 51 L336 119 L37 115" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M46 108 l8 -8 M57 109 l9 -9 M69 108 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="188" y="76" font-size="18" fill="#203040" font-weight="600" text-anchor="middle"><tspan x="188" dy="0">地域交流イベント</tspan><tspan x="188" dy="25">開催準備担当</tspan></text><path d="M38 158 L336 156 L338 223 L39 225 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M40 156 L338 159 L336 227 L37 223" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M46 216 l8 -8 M57 217 l9 -9 M69 216 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="188" y="184" font-size="18" fill="#203040" font-weight="600" text-anchor="middle"><tspan x="188" dy="0">参加申込内容の</tspan><tspan x="188" dy="25">確認・連絡担当</tspan></text><path d="M38 280 L336 278 L338 335 L39 337 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M40 278 L338 281 L336 339 L37 335" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M46 328 l8 -8 M57 329 l9 -9 M69 328 l7 -7" stroke="#267D75" stroke-width=".8" opacity=".6" fill="none"/><text x="188" y="315" font-size="19" fill="#267D75" font-weight="600" text-anchor="middle">当日受付と案内の担当</text><path d="M188 121 Q186 136 188 149" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><path d="M188 229 Q190 250 188 271" stroke="#267D75" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accent)"/><rect x="199" y="240" width="87" height="25" fill="#FFFFFF"/><text x="241" y="258" font-size="17" fill="#267D75" font-weight="600" text-anchor="middle">確認完了</text><path d="M341 190 L452 191 Q455 138 452 81 L345 82" stroke="#B85A18" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warning)"/><text x="393" y="137" font-size="16" fill="#B85A18" font-weight="600" text-anchor="middle"><tspan x="393" dy="0">不足項目</tspan><tspan x="393" dy="23">あり</tspan></text></svg>
