<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">結果未到着の並行作業</title><desc id="desc">案内文を表記確認と会場情報確認で並行確認。表記は完了、会場情報は結果待ち。両方完了するまで公開せず公開済みはゼロ。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="rules" width="720" height="24" patternUnits="userSpaceOnUse"><path d="M0 23 H720" stroke="#708090" stroke-width=".7" opacity=".14"/></pattern></defs><rect width="720" height="240" fill="#FFFFFF"/><rect width="720" height="240" fill="url(#rules)"/><path d="M18 6 L19 234" stroke="#267D75" stroke-width=".7" opacity=".25"/><text x="32" y="28" font-size="20" fill="#203040" font-weight="600" text-anchor="start">結果未到着の並行作業</text><path d="M34 89 L144 87 L146 155 L35 157 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M36 87 L146 90 L144 159 L33 155" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M42 148 l8 -8 M53 149 l9 -9 M65 148 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="90" y="129" font-size="22" fill="#203040" font-weight="600" text-anchor="middle">案内文</text><path d="M221 47 L453 45 L455 100 L222 102 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M223 45 L455 48 L453 104 L220 100" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M229 93 l8 -8 M240 94 l9 -9 M252 93 l7 -7" stroke="#267D75" stroke-width=".8" opacity=".6" fill="none"/><text x="338" y="80" font-size="19" fill="#267D75" font-weight="600" text-anchor="middle">表記確認：完了</text><path d="M221 145 L453 143 L455 200 L222 202 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M223 143 L455 146 L453 204 L220 200" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M229 193 l8 -8 M240 194 l9 -9 M252 193 l7 -7" stroke="#B85A18" stroke-width=".8" opacity=".6" fill="none"/><text x="338" y="178" font-size="17" fill="#B85A18" font-weight="600" text-anchor="middle">会場情報確認：結果待ち</text><path d="M150 122 L180 122 L180 73 L213 73" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><path d="M180 122 L180 172 L213 172" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><path d="M522 88 L692 86 L694 156 L523 158 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.8"/><path d="M524 86 L694 89 L692 160 L521 156" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M530 149 l8 -8 M541 150 l9 -9 M553 149 l7 -7" stroke="#174C66" stroke-width=".8" opacity=".6" fill="none"/><text x="608" y="116" font-size="17" fill="#174C66" font-weight="600" text-anchor="middle">両方完了後に公開</text><text x="608" y="141" font-size="14" fill="#203040" font-weight="500" text-anchor="middle">まだ公開しない</text><path d="M459 74 L489 74 L489 106 L515 106" stroke="#267D75" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accent)"/><path d="M459 174 L489 174 L489 142 L515 142" stroke="#B85A18" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warning)" stroke-dasharray="5 4"/><text x="608" y="203" font-size="20" fill="#174C66" font-weight="600" text-anchor="middle">公開済み：0</text><text x="338" y="229" font-size="14" fill="#B85A18" font-weight="500" text-anchor="middle">結果待ち＝未到着</text></svg>
