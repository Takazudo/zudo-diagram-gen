<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら現在空の利用可能な返却箱へ、破損ありなら相談窓口へ。</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif}</style><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.3" stroke-linejoin="round"/></marker><marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="rules" width="320" height="24" patternUnits="userSpaceOnUse"><path d="M0 23 H320" stroke="#708090" stroke-width=".7" opacity=".14"/></pattern></defs><rect width="320" height="480" fill="#FFFFFF"/><rect width="320" height="480" fill="url(#rules)"/><path d="M18 6 L19 474" stroke="#267D75" stroke-width=".7" opacity=".25"/><text x="31" y="31" font-size="20" fill="#203040" font-weight="600" text-anchor="start">返却場所への案内</text><path d="M94 58 L225 56 L227 109 L95 111 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M96 56 L227 59 L225 113 L93 109" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M102 102 l8 -8 M113 103 l9 -9 M125 102 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="160" y="92" font-size="21" fill="#203040" font-weight="600" text-anchor="middle">入口</text><path d="M160 115 Q158 128 160 141" stroke="#203040" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/><path d="M66 151 L252 149 L254 213 L67 215 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M68 149 L254 152 L252 217 L65 213" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M74 206 l8 -8 M85 207 l9 -9 M97 206 l7 -7" stroke="#203040" stroke-width=".8" opacity=".6" fill="none"/><text x="160" y="190" font-size="22" fill="#203040" font-weight="600" text-anchor="middle">返却確認台</text><path d="M121 219 L121 244 Q91 249 91 268 L91 296" stroke="#267D75" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#accent)"/><path d="M202 219 L202 245 Q249 249 249 267 L249 296" stroke="#B85A18" stroke-width="1.9" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#warning)"/><rect x="34" y="248" width="100" height="26" fill="#FFFFFF"/><text x="84" y="267" font-size="17" fill="#267D75" font-weight="600" text-anchor="middle">破損なし</text><rect x="199" y="248" width="97" height="26" fill="#FFFFFF"/><text x="247" y="267" font-size="17" fill="#B85A18" font-weight="600" text-anchor="middle">破損あり</text><path d="M31 307 L153 305 L155 395 L32 397 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M33 305 L155 308 L153 399 L30 395" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><text x="93" y="337" font-size="18" fill="#267D75" font-weight="600" text-anchor="middle">返却箱：空</text><path d="M68 354 L113 354 L110 379 L70 378 Z M66 354 L75 348 L105 348 L115 354" fill="none" stroke="#267D75" stroke-width="1.4"/><path d="M174 307 L296 305 L298 395 L175 397 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M176 305 L298 308 L296 399 L173 395" fill="none" stroke="#708090" stroke-width=".7" opacity=".65"/><path d="M182 388 l8 -8 M193 389 l9 -9 M205 388 l7 -7" stroke="#B85A18" stroke-width=".8" opacity=".6" fill="none"/><text x="236" y="355" font-size="20" fill="#B85A18" font-weight="600" text-anchor="middle">相談窓口</text><text x="160" y="430" font-size="18" fill="#267D75" font-weight="600" text-anchor="middle">空でも返却に使える</text></svg>
