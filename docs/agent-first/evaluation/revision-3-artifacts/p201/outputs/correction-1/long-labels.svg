<rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="#708090" opacity=".055"/>
<g font-family="Noto Sans CJK JP, sans-serif"><text x="20" y="28" font-size="20" fill="#174C66" font-weight="700" text-anchor="start">資料の担当引継ぎ</text><rect x="131" y="52" width="324" height="66" fill="#708090" opacity=".18" transform="rotate(1 288.0 79.0)"/><rect x="126" y="46" width="324" height="66" fill="#FFFFFF" stroke="#174C66" stroke-width="1.2" transform="rotate(-1 288.0 79.0)"/><path d="M136 56h30v5h-30Z" fill="#174C66"/><text x="288" y="75" font-size="19" fill="#174C66" font-weight="700" text-anchor="middle">地域交流イベント</text><text x="288" y="99" font-size="19" fill="#174C66" font-weight="700" text-anchor="middle">開催準備担当</text><rect x="131" y="164" width="324" height="66" fill="#708090" opacity=".18" transform="rotate(1 288.0 191.0)"/><rect x="126" y="158" width="324" height="66" fill="#FFFFFF" stroke="#174C66" stroke-width="1.2" transform="rotate(-1 288.0 191.0)"/><path d="M136 168h30v5h-30Z" fill="#174C66"/><text x="288" y="187" font-size="19" fill="#174C66" font-weight="700" text-anchor="middle">参加申込内容の</text><text x="288" y="211" font-size="19" fill="#174C66" font-weight="700" text-anchor="middle">確認・連絡担当</text><rect x="131" y="292" width="324" height="66" fill="#708090" opacity=".18" transform="rotate(1 288.0 319.0)"/><rect x="126" y="286" width="324" height="66" fill="#FFFFFF" stroke="#267D75" stroke-width="1.2" transform="rotate(-1 288.0 319.0)"/><path d="M136 296h30v5h-30Z" fill="#267D75"/><text x="288" y="328" font-size="20" fill="#267D75" font-weight="700" text-anchor="middle">当日受付と案内の担当</text><path d="M288 117V149" fill="none" stroke="#203040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="306" y="141" font-size="15" fill="#203040" font-weight="500" text-anchor="start">資料</text><path d="M120 190H45V80H118" fill="none" stroke="#B85A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/><text x="64" y="137" font-size="15" fill="#B85A18" font-weight="700" text-anchor="mid