<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
<title id="title">空席と保留中の席</title><desc id="desc">席は四つ。A席は予約済み、B席とC席は空席で選択可。D席は保留中で選択不可。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs>
<rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="#708090" opacity=".055"/>
<g font-family="Noto Sans CJK JP, sans-serif"><text x="18" y="27" font-size="17" fill="#174C66" font-weight="700" text-anchor="start">選べる席は B席・C席だけ</text><rect x="23" y="52" width="148" height="80" fill="#708090" opacity=".18" transform="rotate(1 92.0 86.0)"/><rect x="18" y="46" width="148" height="80" fill="#FFFFFF" stroke="#174C66" stroke-width="1.2" transform="rotate(-1 92.0 86.0)"/><path d="M28 56h30v5h-30Z" fill="#174C66"/><text x="92" y="79" font-size="17" fill="#174C66" font-weight="700" text-anchor="middle">A席：予約済み</text><text x="92" y="107" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">選択不可</text><rect x="32" y="99" width="12" height="9" fill="none" stroke="#174C66" stroke-width="1.5"/><path d="M34 99v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#174C66" stroke-width="1.5"/><rect x="197" y="52" width="148" height="80" fill="#708090" opacity=".18" transform="rotate(1 266.0 86.0)"/><rect x="192" y="46" width="148" height="80" fill="#FFFFFF" stroke="#267D75" stroke-width="1.2" transform="rotate(1 266.0 86.0)"/><path d="M202 56h30v5h-30Z" fill="#267D75"/><text x="266" y="79" font-size="17" fill="#267D75" font-weight="700" text-anchor="middle">B席：空席</text><text x="266" y="107" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">選択可</text><path d="M206 101l4 4 7-9" fill="none" stroke="#267D75" stroke-width="2"/><rect x="23" y="147" width="148" height="80" fill="#708090" opacity=".18" transform="rotate(1 92.0 181.0)"/><rect x="18" y="141" width="148" height="80" fill="#FFFFFF" stroke="#267D75" stroke-width="1.2" transform="rotate(-1 92.0 181.0)"/><path d="M28 151h30v5h-30Z" fill="#267D75"/><text x="92" y="174" font-size="17" fill="#267D75" font-weight="700" text-anchor="middle">C席：空席</text><text x="92" y="202" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">選択可</text><path d="M32 196l4 4 7-9" fill="none" stroke="#267D75" stroke-width="2"/><rect x="197" y="147" width="148" height="80" fill="#708090" opacity=".18" transform="rotate(1 266.0 181.0)"/><rect x="192" y="141" width="148" height="80" fill="#FFFFFF" stroke="#708090" stroke-width="1.2" transform="rotate(1 266.0 181.0)"/><path d="M202 151h30v5h-30Z" fill="#708090"/><text x="266" y="174" font-size="17" fill="#708090" font-weight="700" text-anchor="middle">D席：保留中</text><text x="266" y="202" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">選択不可</text><circle cx="212" cy="196" r="7" fill="none" stroke="#708090" stroke-width="1.5"/><path d="M212 191v5h4" fill="none" stroke="#708090" stroke-width="1.5"/></g></svg>