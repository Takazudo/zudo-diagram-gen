<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。確認待ちは予約確定ではありません。確定した予約だけ日時を変更できます。変更申請は確認待ちへ戻り、自動承認はありません。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.6"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.6"/></marker></defs>
<rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="#708090" opacity=".055"/>
<g font-family="Noto Sans CJK JP, sans-serif"><text x="24" y="31" font-size="20" fill="#174C66" font-weight="700" text-anchor="start">予約の確定と変更</text><rect x="29" y="70" width="150" height="112" fill="#708090" opacity=".18" transform="rotate(1 99.0 120.0)"/><rect x="24" y="64" width="150" height="112" fill="#FFFFFF" stroke="#174C66" stroke-width="1.2" transform="rotate(-1 99.0 120.0)"/><path d="M34 74h30v5h-30Z" fill="#174C66"/><text x="99" y="112" font-size="25" fill="#174C66" font-weight="700" text-anchor="middle">申請</text><text x="99" y="143" font-size="13" fill="#203040" font-weight="500" text-anchor="middle">予約を申請</text><rect x="249" y="70" width="150" height="112" fill="#708090" opacity=".18" transform="rotate(1 319.0 120.0)"/><rect x="244" y="64" width="150" height="112" fill="#FFFFFF" stroke="#708090" stroke-width="1.2" transform="rotate(-1 319.0 120.0)"/><path d="M254 74h30v5h-30Z" fill="#708090"/><text x="319" y="112" font-size="25" fill="#708090" font-weight="700" text-anchor="middle">確認待ち</text><text x="319" y="143" font-size="13" fill="#203040" font-weight="500" text-anchor="middle">まだ確定していません</text><rect x="469" y="70" width="150" height="112" fill="#708090" opacity=".18" transform="rotate(1 539.0 120.0)"/><rect x="464" y="64" width="150" height="112" fill="#FFFFFF" stroke="#267D75" stroke-width="1.2" transform="rotate(-1 539.0 120.0)"/><path d="M474 74h30v5h-30Z" fill="#267D75"/><text x="539" y="112" font-size="25" fill="#267D75" font-weight="700" text-anchor="middle">確定</text><text x="539" y="143" font-size="13" fill="#203040" font-weight="500" text-anchor="middle">変更が使えます</text><path d="M184 120H232" fill="none" stroke="#203040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M404 120H452" fill="none" stroke="#203040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M539 181V233H319V181" fill="none" stroke="#203040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="375" y="214" width="132" height="44" fill="#708090" opacity=".18" transform="rotate(1 436.0 230.0)"/><rect x="370" y="208" width="132" height="44" fill="#FFFFFF" stroke="#267D75" stroke-width="1.2" transform="rotate(1 436.0 230.0)"/><path d="M380 218h30v5h-30Z" fill="#267D75"/><text x="436" y="237" font-size="18" fill="#267D75" font-weight="700" text-anchor="middle">日時を変更</text><text x="320" y="277" font-size="17" fill="#203040" font-weight="500" text-anchor="middle">変更申請は確認待ちへ戻ります</text><text x="320" y="303" font-size="15" fill="#203040" font-weight="500" text-anchor="middle">自動承認はありません</text></g></svg>