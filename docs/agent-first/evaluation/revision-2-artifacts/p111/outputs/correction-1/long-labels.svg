<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合は準備担当へ戻す。確認完了後は当日受付と案内の担当へ渡す。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.7"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.7"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.7"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><rect x="8" y="8" width="464" height="344" fill="#708090" opacity=".055"/><text x="20" y="29" font-size="21" fill="#174C66" text-anchor="start" font-weight="700">長いラベルの担当引継ぎ</text><g transform="rotate(-1 286.0 80.0)"><rect x="123" y="52" width="334" height="66" fill="#708090" opacity=".20"/><rect x="117" y="45" width="334" height="66" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="119" y="47" width="334" height="66" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M430 47h23v23Z" fill="#174C66" opacity=".22"/><text x="286" y="74" font-size="19" fill="#174C66" text-anchor="middle" font-weight="500">地域交流イベント</text><text x="286" y="98" font-size="19" fill="#174C66" text-anchor="middle" font-weight="500">開催準備担当</text><g transform="rotate(1 286.0 186.0)"><rect x="123" y="158" width="334" height="66" fill="#708090" opacity=".20"/><rect x="117" y="151" width="334" height="66" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="119" y="153" width="334" height="66" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M430 153h23v23Z" fill="#174C66" opacity=".22"/><text x="286" y="180" font-size="19" fill="#174C66" text-anchor="middle" font-weight="500">参加申込内容の</text><text x="286" y="204" font-size="19" fill="#174C66" text-anchor="middle" font-weight="500">確認・連絡担当</text><g transform="rotate(-1 286.0 300.0)"><rect x="123" y="272" width="334" height="66" fill="#708090" opacity=".20"/><rect x="117" y="265" width="334" height="66" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="119" y="267" width="334" height="66" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M430 267h23v23Z" fill="#267D75" opacity=".22"/><text x="286" y="307" font-size="19" fill="#267D75" text-anchor="middle" font-weight="500">当日受付と案内の担当</text><path d="M286 117V140" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="317" y="136" font-size="13" fill="#203040" text-anchor="start" font-weight="500">資料を渡す</text><path d="M286 226V255" fill="none" stroke="#267D75" stroke-width="2" stroke-linejoin="round" marker-end="url(#g)"/><text x="307" y="247" font-size="16" fill="#267D75" text-anchor="start" font-weight="500">確認完了</text><path d="M106 186H39V80H106" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" marker-end="url(#w)"/><rect x="8" y="118" width="102" height="44" fill="#FFFFFF"/><text x="58" y="136" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="500">不足項目あり</text><text x="58" y="155" font-size="14" fill="#B85A18" text-anchor="middle" font-weight="500">準備担当へ戻す</text></g></svg>
