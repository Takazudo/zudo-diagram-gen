<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ちを経て確定。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちへ戻る。自動承認なし。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.7"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#267D75" stroke-width="1.7"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.7"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><rect x="8" y="8" width="624" height="304" fill="#708090" opacity=".055"/><text x="24" y="33" font-size="22" fill="#174C66" text-anchor="start" font-weight="700">予約の確定と変更</text><g transform="rotate(-2 100.0 127.0)"><rect x="36" y="82" width="136" height="100" fill="#708090" opacity=".20"/><rect x="30" y="75" width="136" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="32" y="77" width="136" height="100" fill="#FFFFFF" stroke="#174C66" stroke-width="1.3"/><path d="M145 77h23v23Z" fill="#174C66" opacity=".22"/><text x="100" y="118" font-size="23" fill="#174C66" text-anchor="middle" font-weight="700">申請</text><text x="100" y="152" font-size="16" fill="#174C66" text-anchor="middle" font-weight="500">予約を申請</text><g transform="rotate(1.5 320.0 127.0)"><rect x="256" y="82" width="136" height="100" fill="#708090" opacity=".20"/><rect x="250" y="75" width="136" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="252" y="77" width="136" height="100" fill="#FFFFFF" stroke="#708090" stroke-width="1.3"/><path d="M365 77h23v23Z" fill="#708090" opacity=".22"/><text x="320" y="118" font-size="23" fill="#708090" text-anchor="middle" font-weight="700">確認待ち</text><text x="320" y="152" font-size="16" fill="#708090" text-anchor="middle" font-weight="500">予約は未確定</text><g transform="rotate(-1.5 540.0 127.0)"><rect x="476" y="82" width="136" height="100" fill="#708090" opacity=".20"/><rect x="470" y="75" width="136" height="100" fill="#FFFFFF" stroke="#708090" stroke-opacity=".35"/></g><rect x="472" y="77" width="136" height="100" fill="#FFFFFF" stroke="#267D75" stroke-width="1.3"/><path d="M585 77h23v23Z" fill="#267D75" opacity=".22"/><text x="540" y="118" font-size="23" fill="#267D75" text-anchor="middle" font-weight="700">確定</text><text x="540" y="152" font-size="16" fill="#267D75" text-anchor="middle" font-weight="500">日時を変更</text><path d="M181 124H237" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><path d="M401 124H457" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><path d="M540 190V231H320V190" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="435" y="216" font-size="16" fill="#174C66" text-anchor="middle" font-weight="500">変更申請</text><text x="320" y="277" font-size="17" fill="#203040" text-anchor="middle" font-weight="500">変更できるのは確定した予約だけ</text><text x="320" y="302" font-size="15" fill="#203040" text-anchor="middle" font-weight="500">変更申請は確認待ちへ戻る・自動承認なし</text></g></svg>
