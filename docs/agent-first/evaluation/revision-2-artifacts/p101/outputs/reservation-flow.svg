<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。確認待ちは未確定。確定した予約だけ日時を変更でき、変更申請は確認待ちに戻る。自動承認なし。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="640" height="320" fill="#FFFFFF"/><text x="24" y="30" font-size="20" fill="#203040" text-anchor="start" font-weight="700">予約の確定と変更</text><g transform="rotate(-2 98.0 125.0)"><rect x="29" y="72" width="146" height="116" fill="#203040" opacity=".13"/><rect x="22" y="64" width="146" height="116" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="25" y="67" width="146" height="116" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M32 74H164V82L32 79Z" fill="#174C66" opacity=".22"/><path d="M151 176L164 163V176Z" fill="#174C66" opacity=".35"/><g transform="rotate(1.5 320.0 125.0)"><rect x="249" y="72" width="150" height="116" fill="#203040" opacity=".13"/><rect x="242" y="64" width="150" height="116" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="245" y="67" width="150" height="116" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M252 74H388V82L252 79Z" fill="#B85A18" opacity=".22"/><path d="M375 176L388 163V176Z" fill="#B85A18" opacity=".35"/><g transform="rotate(-1.5 540.0 125.0)"><rect x="469" y="72" width="150" height="116" fill="#203040" opacity=".13"/><rect x="462" y="64" width="150" height="116" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="465" y="67" width="150" height="116" fill="#FFFFFF" stroke="#267D75" stroke-width="1.5"/><path d="M472 74H608V82L472 79Z" fill="#267D75" opacity=".22"/><path d="M595 176L608 163V176Z" fill="#267D75" opacity=".35"/><text x="98" y="115" font-size="23" fill="#174C66" text-anchor="middle" font-weight="700">申請</text><text x="98" y="150" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">予約を申請</text><text x="320" y="115" font-size="23" fill="#B85A18" text-anchor="middle" font-weight="700">確認待ち</text><text x="320" y="150" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">予約確定ではない</text><text x="540" y="115" font-size="23" fill="#267D75" text-anchor="middle" font-weight="700">確定</text><text x="540" y="150" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">日時を変更できる</text><path d="M177 125H237" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M401 125H457" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M540 189V255H320V189" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" marker-end="url(#warn)"/><text x="453" y="238" font-size="18" fill="#B85A18" text-anchor="middle" font-weight="700">日時を変更</text><text x="320" y="295" font-size="16" fill="#203040" text-anchor="middle" font-weight="500">変更申請は確認待ちへ戻る・自動承認なし</text></g></svg>
