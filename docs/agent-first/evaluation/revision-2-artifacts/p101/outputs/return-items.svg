<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら返却箱へ、破損ありなら相談窓口へ。返却箱は現在空でも返却に使える。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="320" height="480" fill="#FFFFFF"/><text x="20" y="28" font-size="20" fill="#203040" text-anchor="start" font-weight="700">返却場所への案内</text><g transform="rotate(-2 160.0 79.5)"><rect x="95" y="57" width="138" height="55" fill="#203040" opacity=".13"/><rect x="88" y="49" width="138" height="55" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="91" y="52" width="138" height="55" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M98 59H222V67L98 64Z" fill="#174C66" opacity=".22"/><path d="M209 100L222 87V100Z" fill="#174C66" opacity=".35"/><text x="160" y="88" font-size="22" fill="#174C66" text-anchor="middle" font-weight="700">入口</text><path d="M160 113V153" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="rotate(1.3 160.0 193.5)"><rect x="68" y="166" width="192" height="65" fill="#203040" opacity=".13"/><rect x="61" y="158" width="192" height="65" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="64" y="161" width="192" height="65" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M71 168H249V176L71 173Z" fill="#174C66" opacity=".22"/><path d="M236 219L249 206V219Z" fill="#174C66" opacity=".35"/><text x="160" y="201" font-size="22" fill="#174C66" text-anchor="middle" font-weight="700">返却確認台</text><path d="M118 233V278H81V328" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M205 233V278H243V328" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" marker-end="url(#warn)"/><text x="76" y="264" font-size="16" fill="#267D75" text-anchor="middle" font-weight="700">破損なし</text><text x="247" y="264" font-size="16" fill="#B85A18" text-anchor="middle" font-weight="700">破損あり</text><g transform="rotate(-2 81.0 387.0)"><rect x="23" y="341" width="124" height="102" fill="#203040" opacity=".13"/><rect x="16" y="333" width="124" height="102" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="19" y="336" width="124" height="102" fill="#FFFFFF" stroke="#267D75" stroke-width="1.5"/><path d="M26 343H136V351L26 348Z" fill="#267D75" opacity=".22"/><path d="M123 431L136 418V431Z" fill="#267D75" opacity=".35"/><text x="81" y="375" font-size="18" fill="#267D75" text-anchor="middle" font-weight="700">返却箱：空</text><text x="81" y="406" font-size="15" fill="#203040" text-anchor="middle" font-weight="500">返却に使える</text><g transform="rotate(2 239.0 387.0)"><rect x="181" y="341" width="124" height="102" fill="#203040" opacity=".13"/><rect x="174" y="333" width="124" height="102" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="177" y="336" width="124" height="102" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.5"/><path d="M184 343H294V351L184 348Z" fill="#B85A18" opacity=".22"/><path d="M281 431L294 418V431Z" fill="#B85A18" opacity=".35"/><text x="239" y="383" font-size="21" fill="#B85A18" text-anchor="middle" font-weight="700">相談窓口</text></g></svg>
