<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ。不足項目ありなら準備担当へ戻る。確認完了なら当日受付と案内の担当へ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#203040" stroke-width="1.5"/></marker><marker id="warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B85A18" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif"><rect width="480" height="360" fill="#FFFFFF"/><text x="20" y="26" font-size="20" fill="#203040" text-anchor="start" font-weight="700">担当の引継ぎ</text><g transform="rotate(-1.5 296.0 75.5)"><rect x="154" y="48" width="292" height="65" fill="#203040" opacity=".13"/><rect x="147" y="40" width="292" height="65" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="150" y="43" width="292" height="65" fill="#FFFFFF" stroke="#174C66" stroke-width="1.5"/><path d="M157 50H435V58L157 55Z" fill="#174C66" opacity=".22"/><path d="M422 101L435 88V101Z" fill="#174C66" opacity=".35"/><text x="296" y="71" font-size="18" fill="#174C66" text-anchor="middle" font-weight="600"><tspan x="296" dy="0">地域交流イベント</tspan><tspan x="296" dy="24">開催準備担当</tspan></text><g transform="rotate(1.3 296.0 190.0)"><rect x="154" y="159" width="292" height="72" fill="#203040" opacity=".13"/><rect x="147" y="151" width="292" height="72" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="150" y="154" width="292" height="72" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.5"/><path d="M157 161H435V169L157 166Z" fill="#B85A18" opacity=".22"/><path d="M422 219L435 206V219Z" fill="#B85A18" opacity=".35"/><text x="296" y="183" font-size="18" fill="#203040" text-anchor="middle" font-weight="600"><tspan x="296" dy="0">参加申込内容の</tspan><tspan x="296" dy="24">確認・連絡担当</tspan></text><g transform="rotate(-1.3 296.0 313.0)"><rect x="154" y="290" width="292" height="56" fill="#203040" opacity=".13"/><rect x="147" y="282" width="292" height="56" fill="#FFFFFF" stroke="#708090" stroke-opacity=".32"/></g><rect x="150" y="285" width="292" height="56" fill="#FFFFFF" stroke="#267D75" stroke-width="1.5"/><path d="M157 292H435V300L157 297Z" fill="#267D75" opacity=".22"/><path d="M422 334L435 321V334Z" fill="#267D75" opacity=".35"/><text x="296" y="320" font-size="18" fill="#267D75" text-anchor="middle" font-weight="700">当日受付と案内の担当</text><path d="M296 113V146" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M296 232V277" fill="none" stroke="#203040" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="362" y="259" font-size="16" fill="#267D75" text-anchor="middle" font-weight="700">確認完了</text><path d="M143 190H96V76H142" fill="none" stroke="#B85A18" stroke-width="2" stroke-linejoin="round" marker-end="url(#warn)"/><text x="52" y="158" font-size="15" fill="#B85A18" text-anchor="middle" font-weight="600"><tspan x="52" dy="0">不足項目</tspan><tspan x="52" dy="21">あり</tspan></text></g></svg>
