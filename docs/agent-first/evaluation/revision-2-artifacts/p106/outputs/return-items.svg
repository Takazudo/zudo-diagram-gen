(#arrow)"/><text x="94" y="275" font-size="18" style="fill:#267D75;font-weight:600">破損なし</text><text x="247" y="275" font-size="18" style="fill:#B85A18;font-weight:600">破損あり</text><path d="M32 310L157 308L156 419L31 418Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M30 308L158 311L158 417L33 421" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="94" y="335" font-size="18" style="fill:#267D75;font-weight:600">返却箱：空</text><path d="M64 352L117 352L121 383L61 383Z M65 350L72 344L111 344L117 352 M74 360L108 360" fill="none" stroke="#267D75" stroke-width="1.5"/><text x="94" y="406" font-size="15" style="fill:#267D75;font-weight:400">返却に使える</text><path d="M182 310L307 308L306 419L181 418Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M180 308L308 311L308 417L183 421" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="244" y="365" font-size="22" style="fill:#B85A18;font-weight:600">相談窓口</text><path d="M205 391l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#B85A18" stroke-width="0.8" opacity="0.65"/></svg>