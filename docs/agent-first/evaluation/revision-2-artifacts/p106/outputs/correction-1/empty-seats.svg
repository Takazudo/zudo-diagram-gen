<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">空席と保留中の席</title><desc id="desc">席は四つ。A席は予約済み。B席とC席だけが空席で選択できる。D席は保留中で選択できない。</desc><defs><pattern id="rules" width="360" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H360" stroke="#708090" stroke-width="0.7" opacity="0.12"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#203040;text-anchor:middle}.label{font-weight:600}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="url(#rules)"/><path d="M18 0L20 240" stroke="#267D75" stroke-width="0.7" opacity="0.18"/><text x="180" y="29" font-size="18" style="fill:#203040;font-weight:600">空席と保留中の席</text><path d="M31 49L168 47L167 124L30 123Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.8"/><path d="M29 47L169 50L169 122L32 126" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="99" y="77" font-size="16" style="fill:#174C66;font-weight:600">A席：予約済み</text><text x="99" y="105" font-size="15" style="fill:#174C66;font-weight:400">選択不可</text><path d="M39 106l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#174C66" stroke-width="0.8" opacity="0.65"/><path d="M195 49L332 47L331 124L194 123Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M193 47L333 50L333 122L196 126" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="263" y="77" font-size="16" style="fill:#267D75;font-weight:600">B席：空席</text><text x="263" y="105" font-size="15" style="fill:#267D75;font-weight:400">選択可</text><path d="M208 108l4 4l7 -9" fill="none" stroke="#267D75" stroke-width="1.8"/><path d="M31 144L168 142L167 219L30 218Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M29 142L169 145L169 217L32 221" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="99" y="172" font-size="16" style="fill:#267D75;font-weight:600">C席：空席</text><text x="99" y="200" font-size="15" style="fill:#267D75;font-weight:400">選択可</text><path d="M44 203l4 4l7 -9" fill="none" stroke="#267D75" stroke-width="1.8"/><path d="M195 144L332 142L331 219L194 218Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M193 142L333 145L333 217L196 221" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="263" y="172" font-size="16" style="fill:#B85A18;font-weight:600">D席：保留中</text><text x="263" y="200" font-size="15" style="fill:#B85A18;font-weight:400">選択不可</text><path d="M203 201l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#B85A18" stroke-width="0.8" opacity="0.65"/></svg>