<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">長いラベルの担当引継ぎ</title><desc id="desc">準備担当から確認担当へ資料を渡す。不足項目ありなら準備担当へ戻す。確認完了で不足がなければ当日受付と案内の担当へ渡す。</desc><defs><pattern id="rules" width="480" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H480" stroke="#708090" stroke-width="0.7" opacity="0.12"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#203040;text-anchor:middle}.label{font-weight:600}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M18 0L20 360" stroke="#267D75" stroke-width="0.7" opacity="0.18"/><text x="260" y="29" font-size="20" style="fill:#203040;font-weight:600">長いラベルの担当引継ぎ</text><path d="M157 47L451 45L450 115L156 114Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M155 45L452 48L452 113L158 117" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="303" y="73" font-size="20" class="label" style="fill:#203040"><tspan x="303" dy="0">地域交流イベント</tspan><tspan x="303" dy="27">開催準備担当</tspan></text><path d="M157 157L451 155L450 225L156 224Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M155 155L452 158L452 223L158 227" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="303" y="183" font-size="20" class="label" style="fill:#203040"><tspan x="303" dy="0">参加申込内容の</tspan><tspan x="303" dy="27">確認・連絡担当</tspan></text><path d="M157 285L451 283L450 340L156 339Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M155 283L452 286L452 338L158 342" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="303" y="318" font-size="20" style="fill:#267D75;font-weight:600">当日受付と案内の担当</text><path d="M303 119Q301 134 303 150" fill="none" stroke="#203040" stroke-width="1.8" marker-end="url(#arrow)"/><text x="347" y="140" font-size="15" style="fill:#203040;font-weight:400">資料</text><path d="M151 190L48 190Q37 190 37 179L38 82Q39 78 49 79L150 80" fill="none" stroke="#B85A18" stroke-width="1.8" marker-end="url(#arrow)"/><text x="94" y="132" font-size="14" style="fill:#B85A18;font-weight:600">不足項目あり</text><text x="91" y="154" font-size="14" style="fill:#B85A18;font-weight:400">準備へ戻す</text><path d="M303 229Q305 251 303 277" fill="none" stroke="#267D75" stroke-width="1.8" marker-end="url(#arrow)"/><text x="378" y="249" font-size="17" style="fill:#267D75;font-weight:600">確認完了</text><text x="378" y="270" font-size="14" style="fill:#267D75;font-weight:400">不足なし</text></svg>