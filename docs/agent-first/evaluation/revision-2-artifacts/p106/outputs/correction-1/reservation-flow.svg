<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">予約の確定と変更</title><desc id="desc">申請、確認待ち、確定の順。確認待ちは未確定。確定した予約の日時を変更すると確認待ちに戻り、自動承認はない。</desc><defs><pattern id="rules" width="640" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H640" stroke="#708090" stroke-width="0.7" opacity="0.12"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#203040;text-anchor:middle}.label{font-weight:600}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M18 0L20 320" stroke="#267D75" stroke-width="0.7" opacity="0.18"/><text x="320" y="38" font-size="22" style="fill:#203040;font-weight:600">予約の確定と変更</text><path d="M41 88L190 86L189 162L40 161Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.8"/><path d="M39 86L191 89L191 160L42 164" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="115" y="131" font-size="24" style="fill:#203040;font-weight:600">申請</text><path d="M52 102l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#203040" stroke-width="0.8" opacity="0.65"/><path d="M246 88L395 86L394 162L245 161Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.8"/><path d="M244 86L396 89L396 160L247 164" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="320" y="131" font-size="24" style="fill:#B85A18;font-weight:600">確認待ち</text><path d="M257 102l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#B85A18" stroke-width="0.8" opacity="0.65"/><path d="M451 88L600 86L599 162L450 161Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.8"/><path d="M449 86L601 89L601 160L452 164" fill="none" stroke="#708090" stroke-width="0.65" opacity="0.65"/><text x="525" y="131" font-size="24" style="fill:#267D75;font-weight:600">確定</text><path d="M462 102l9 -8m-1 12l12 -11m-3 12l9 -8" fill="none" stroke="#267D75" stroke-width="0.8" opacity="0.65"/><path d="M197 124Q217 121 237 124" fill="none" stroke="#203040" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M402 124Q422 126 443 124" fill="none" stroke="#203040" stroke-width="1.8" marker-end="url(#arrow)"/><text x="320" y="188" font-size="16" style="fill:#B85A18;font-weight:400">予約は未確定</text><text x="525" y="188" font-size="16" style="fill:#267D75;font-weight:400">予約が確定</text><path d="M526 201C528 244 531 251 498 252L348 251Q320 252 320 215" fill="none" stroke="#267D75" stroke-width="1.8" marker-end="url(#arrow)"/><text x="433" y="236" font-size="18" style="fill:#267D75;font-weight:600">日時を変更</text><text x="320" y="291" font-size="16" style="fill:#203040;font-weight:400">変更申請は確認待ちへ戻る・自動承認なし</text></svg>