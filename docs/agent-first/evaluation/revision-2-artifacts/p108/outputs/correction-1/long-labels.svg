<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">長いラベルの担当引継ぎ</title><desc id="desc">地域交流イベント開催準備担当から参加申込内容の確認・連絡担当へ資料を渡す。不足項目ありの場合だけ準備担当へ戻し、確認完了の場合だけ当日受付と案内の担当へ渡す。</desc>
<style>text {font-family:'Noto Sans CJK JP',sans-serif;}</style>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rules" width="480" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H480" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern></defs>
<rect width="480" height="360" fill="#FFFFFF"/><rect width="480" height="360" fill="url(#rules)"/><path d="M14 8 L15 352" stroke="#708090" stroke-width=".7" opacity=".22"/>
<text x="26" y="32" font-size="21" fill="#203040" text-anchor="start" font-weight="700">長いラベルの担当引継ぎ</text><path d="M48 56 L319 55 L320 119 L49 120 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M50 54 L321 57 L318 122 L47 119" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="184" y="80" font-size="18" fill="#203040" text-anchor="middle" font-weight="500"><tspan x="184" dy="0">地域交流イベント</tspan><tspan x="184" dy="24">開催準備担当</tspan></text><path d="M182 125 Q180 139 183 153" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M48 162 L319 161 L320 225 L49 226 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M50 160 L321 163 L318 228 L47 225" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="184" y="186" font-size="18" fill="#203040" text-anchor="middle" font-weight="500"><tspan x="184" dy="0">参加申込内容の</tspan><tspan x="184" dy="24">確認・連絡担当</tspan></text><path d="M325 194 C357 193 438 196 438 171 L438 101 Q438 88 423 88 L326 88" fill="none" stroke="#B85A18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="393" y="148" font-size="15" fill="#B85A18" text-anchor="middle" font-weight="700">不足項目あり</text><path d="M183 231 Q181 250 184 273" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="252" y="253" font-size="16" fill="#267D75" text-anchor="middle" font-weight="700">確認完了</text><path d="M48 282 L319 281 L320 337 L49 338 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M50 280 L321 283 L318 340 L47 337" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="184" y="315" font-size="18" fill="#203040" text-anchor="middle" font-weight="500">当日受付と案内の担当</text><path d="M60 332 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#267D75" stroke-width=".8" opacity=".55" fill="none"/>
</svg>