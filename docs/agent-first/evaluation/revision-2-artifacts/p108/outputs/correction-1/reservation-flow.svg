<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">予約の確定と変更</title><desc id="desc">申請から確認待ち、確定へ。日時を変更できるのは確定した予約だけ。変更申請は確認待ちへ戻り、自動承認はない。</desc>
<style>text {font-family:'Noto Sans CJK JP',sans-serif;}</style>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rules" width="640" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H640" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern></defs>
<rect width="640" height="320" fill="#FFFFFF"/><rect width="640" height="320" fill="url(#rules)"/><path d="M14 8 L15 312" stroke="#708090" stroke-width=".7" opacity=".22"/>
<text x="32" y="32" font-size="22" fill="#203040" text-anchor="start" font-weight="700">予約の確定と変更</text><text x="320" y="64" font-size="17" fill="#B85A18" text-anchor="middle" font-weight="500">確認待ちは予約確定ではない</text><path d="M40 89 L184 88 L185 183 L41 184 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M42 87 L186 90 L183 186 L39 183" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="112.5" y="140" font-size="23" fill="#203040" text-anchor="middle" font-weight="700">申請</text><path d="M52 170 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#203040" stroke-width=".8" opacity=".55" fill="none"/><path d="M248 89 L392 88 L393 183 L249 184 Z" fill="#FFFFFF" stroke="#708090" stroke-width="1.7" stroke-dasharray="6 4"/><path d="M250 87 L394 90 L391 186 L247 183" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="320.5" y="140" font-size="23" fill="#203040" text-anchor="middle" font-weight="700">確認待ち</text><path d="M260 170 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#708090" stroke-width=".8" opacity=".55" fill="none"/><path d="M456 89 L600 88 L601 183 L457 184 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M458 87 L602 90 L599 186 L455 183" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="528.5" y="140" font-size="23" fill="#267D75" text-anchor="middle" font-weight="700">確定</text><path d="M468 170 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#267D75" stroke-width=".8" opacity=".55" fill="none"/><path d="M191 135 Q216 132 241 135" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M399 135 Q424 132 449 135" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><text x="527" y="211" font-size="15" fill="#267D75" text-anchor="middle" font-weight="500">確定した予約だけ</text><path d="M530 220 C531 255 502 267 466 265 L347 265 Q322 265 321 192" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="423" y="249" font-size="18" fill="#267D75" text-anchor="middle" font-weight="700">日時を変更</text><text x="320" y="302" font-size="16" fill="#203040" text-anchor="middle" font-weight="500">変更申請は確認待ちへ戻る・自動承認なし</text>
</svg>