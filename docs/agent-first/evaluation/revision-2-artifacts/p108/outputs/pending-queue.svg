<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">結果未到着の並行作業</title><desc id="desc">案内文から表記確認と会場情報確認へ並行に分岐する。表記確認は完了、会場情報確認は結果待ち。まとめ役は両方が完了するまで公開しない。公開済みは0。</desc>
<style>text {font-family:'Noto Sans CJK JP',sans-serif;}</style>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rules" width="720" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H720" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern></defs>
<rect width="720" height="240" fill="#FFFFFF"/><rect width="720" height="240" fill="url(#rules)"/><path d="M14 8 L15 232" stroke="#708090" stroke-width=".7" opacity=".22"/>
