<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc">
<title id="title">返却場所への案内</title><desc id="desc">入口から返却確認台へ。破損なしなら現在空で利用可能な返却箱へ。破損ありなら相談窓口へ。</desc>
<style>text {font-family:'Noto Sans CJK JP',sans-serif;}</style>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rules" width="320" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H320" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern></defs>
<rect width="320" height="480" fill="#FFFFFF"/><rect width="320" height="480" fill="url(#rules)"/><path d="M14 8 L15 472" stroke="#708090" stroke-width=".7" opacity=".22"/>
<text x="24" y="34" font-size="21" fill="#203040" text-anchor="start" font-weight="700">返却場所への案内</text><path d="M72 63 L247 62 L248 115 L73 116 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M74 61 L249 64 L246 118 L71 115" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="160" y="96" font-size="21" fill="#203040" text-anchor="middle" font-weight="700">入口</text><path d="M160 122 Q157 138 160 151" fill="none" stroke="#203040" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink-arrow)"/><path d="M60 159 L259 158 L260 222 L61 223 Z" fill="#FFFFFF" stroke="#203040" stroke-width="1.7"/><path d="M62 157 L261 160 L258 225 L59 222" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="160" y="198" font-size="21" fill="#203040" text-anchor="middle" font-weight="700">返却確認台</text><path d="M113 229 Q111 250 89 253 L89 306" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><path d="M207 229 Q208 250 238 253 L238 306" fill="none" stroke="#B85A18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warning-arrow)"/><text x="80" y="286" font-size="17" fill="#267D75" text-anchor="middle" font-weight="700">破損なし</text><text x="240" y="286" font-size="17" fill="#B85A18" text-anchor="middle" font-weight="700">破損あり</text><path d="M24 315 L155 314 L156 426 L25 427 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M26 313 L157 316 L154 429 L23 426" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="90" y="345" font-size="18" fill="#203040" text-anchor="middle" font-weight="700">返却箱：空</text><path d="M65 363 L65 388 Q90 392 115 388 L115 363 M61 361 Q90 357 119 361" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="414" font-size="15" fill="#267D75" text-anchor="middle" font-weight="500">返却に使える</text><path d="M176 315 L295 314 L296 426 L177 427 Z" fill="#FFFFFF" stroke="#B85A18" stroke-width="1.7"/><path d="M178 313 L297 316 L294 429 L175 426" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="236" y="369" font-size="19" fill="#203040" text-anchor="middle" font-weight="700">相談窓口</text><path d="M218 397 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#B85A18" stroke-width=".8" opacity=".55" fill="none"/>
</svg>