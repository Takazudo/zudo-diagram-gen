<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
<title id="title">空席と保留中の席</title><desc id="desc">四席。A席は予約済み。B席とC席は空席で選択可能。D席は保留中で選択不可。</desc>
<style>text {font-family:'Noto Sans CJK JP',sans-serif;}</style>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#203040" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#267D75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="warning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B85A18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="rules" width="360" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5 H360" stroke="#708090" stroke-width=".7" opacity=".12"/></pattern></defs>
<rect width="360" height="240" fill="#FFFFFF"/><rect width="360" height="240" fill="url(#rules)"/><path d="M14 8 L15 232" stroke="#708090" stroke-width=".7" opacity=".22"/>
<text x="24" y="31" font-size="18" fill="#203040" text-anchor="start" font-weight="700">空席と保留中の席</text><path d="M24 56 L169 55 L170 128 L25 129 Z" fill="#FFFFFF" stroke="#174C66" stroke-width="1.7"/><path d="M26 54 L171 57 L168 131 L23 128" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="97" y="83" font-size="14" fill="#203040" text-anchor="middle" font-weight="700">A席：予約済み</text><text x="97" y="110" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">選択不可</text><path d="M33 121 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#174C66" stroke-width=".8" opacity=".55" fill="none"/><path d="M190 56 L335 55 L336 128 L191 129 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M192 54 L337 57 L334 131 L189 128" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="263" y="83" font-size="14" fill="#203040" text-anchor="middle" font-weight="700">B席：空席</text><text x="263" y="110" font-size="14" fill="#267D75" text-anchor="middle" font-weight="500">選択可能</text><path d="M232 118 Q263 120 294 118" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 148 L169 147 L170 220 L25 221 Z" fill="#FFFFFF" stroke="#267D75" stroke-width="1.7"/><path d="M26 146 L171 149 L168 223 L23 220" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="97" y="175" font-size="14" fill="#203040" text-anchor="middle" font-weight="700">C席：空席</text><text x="97" y="202" font-size="14" fill="#267D75" text-anchor="middle" font-weight="500">選択可能</text><path d="M66 210 Q97 212 128 210" fill="none" stroke="#267D75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 148 L335 147 L336 220 L191 221 Z" fill="#FFFFFF" stroke="#708090" stroke-width="1.7" stroke-dasharray="6 4"/><path d="M192 146 L337 149 L334 223 L189 220" fill="none" stroke="#708090" stroke-opacity=".4" stroke-width=".7"/><text x="263" y="175" font-size="14" fill="#203040" text-anchor="middle" font-weight="700">D席：保留中</text><text x="263" y="202" font-size="14" fill="#203040" text-anchor="middle" font-weight="500">選択不可</text><path d="M199 213 l8 -7 m1 8 l8 -7 m1 8 l7 -6" stroke="#708090" stroke-width=".8" opacity=".55" fill="none"/>
