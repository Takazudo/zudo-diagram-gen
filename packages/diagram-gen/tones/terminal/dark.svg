<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" data-tone="20" data-theme="dark" role="img" aria-labelledby="t20-title t20-desc">
<title id="t20-title">Terminal: Pattern and Text combine into a composition, exported as PNG</title>
<desc id="t20-desc">A pattern background and a text layer, shown separately at left, combine in the poster at center. The poster visibly contains both the pattern and MAKE SOMETHING text. A rightward connector indicates its PNG export. Monospace lettering, corner-bracket frames, spare orthogonal geometry, and phosphor colors on an inherently dark canvas. This is a vector diagram with terminal character, not a block of ASCII art.</desc>
<style>
svg[data-tone='20'] {--bg:#132123;--paper:#1A3033;--ink:#E2F6E5;--primary:#91E9B3;--secondary:#8FDBE8;--tertiary:#3C6264;font-family:'Courier New', Courier, monospace;}
svg[data-tone='20'][data-theme='dark'] {--bg:#081416;--paper:#12272B;--ink:#EDF9ED;--primary:#9CEBBA;--secondary:#90D9E7;--tertiary:#35565B;}
.t20-bg {fill:#081416;}
.t20-paper {fill:#12272B;}
.t20-ink {fill:#EDF9ED;}
.t20-primary {fill:#9CEBBA;}
.t20-secondary {fill:#90D9E7;}
.t20-tertiary {fill:#35565B;}
.t20-label {fill:#EDF9ED;font-size:27px;font-weight:600;text-anchor:middle;}
.t20-make {fill:#EDF9ED;font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:-1px;}
.t20-something {fill:#EDF9ED;font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:-.6px;}
.t20-line {fill:none;stroke:#EDF9ED;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.t20-bracket{fill:none;stroke:#9CEBBA;stroke-width:2;}.t20-route{fill:none;stroke:#9CEBBA;stroke-width:2.5;}.t20-label{font-weight:400;font-size:26px;letter-spacing:0;}
</style>
<defs>
