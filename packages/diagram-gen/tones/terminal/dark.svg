<path d="M241 283h39v-61h57" class="t20-route" marker-end="url(#t20-arrow)"/>
<rect x="356" y="65" width="212" height="270" fill="url(#t20-field)" opacity=".6"/>
<path d="M382 57h-34v34m0 218v34h34M542 57h34v34m0 218v34h-34" class="t20-bracket"/>
