 <path d="M29 28h5v5h-5Z" class="t20-secondary" opacity=".7"/>
</pattern>
<marker id="t20-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 6 4-6 4" fill="none" stroke="#9CEBBA" stroke-width="1.6"/></marker>
</defs>
<rect width="720" height="400" class="t20-bg"/>

<rect x="52" y="56" width="164" height="112" fill="url(#t20-field)"/>
