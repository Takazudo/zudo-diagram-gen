<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><title>予約状況の確認 — terminal</title><rect width="720" height="400" fill="{{palette:surface}}" data-palette-fill="surface"/><path d="M24 100V68H56M664 68H696V100M24 326V358H56M664 358H696V326" fill="none" stroke="{{palette:accent}}" data-palette-stroke="accent" stroke-width="2"/><path d="M40 86L48 94 40 102M58 102H84" stroke="{{palette:accent}}" data-palette-stroke="accent" fill="none"/><text x="24" y="44" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">予約状況の確認と次の手続き</text><text x="52" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">利用者</text><text x="275" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席</text><text x="520" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認待ち</text><text x="52" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席は未予約</text><text x="355" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認後に完了</text><path d="M32 373L44 353 56 373Z" fill="{{palette:warning}}" data-palette-fill="warning"/><text x="68" y="377" font-family="{{font:detail}}" font-size="{{scheme:typography.detail.fontSize}}" fill="{{palette:ink}}" data-palette-fill="ink">注意：予約内容を確認してから確定</text></svg>
