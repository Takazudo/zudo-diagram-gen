<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" data-tone="22" data-theme="dark" role="img" aria-labelledby="t22-title t22-desc">
<title id="t22-title">Transit wayfinding: Pattern and Text combine into a composition, exported as PNG</title>
<desc id="t22-desc">A pattern background and a text layer, shown separately at left, combine in the poster at center. The poster visibly contains both the pattern and MAKE SOMETHING text. A rightward connector indicates its PNG export. Thick routed lines, round station rings, clean transfer geometry, and bold wayfinding labels. Two named source branches join before the combined poster and one PNG destination.</desc>
<style>
svg[data-tone='22'] {--bg:#FAFBF8;--paper:#EEF2EF;--ink:#213D4A;--primary:#2777C7;--secondary:#DE8054;--tertiary:#A4B7AA;font-family:Arial, Helvetica, sans-serif;}
svg[data-tone='22'][data-theme='dark'] {--bg:#15242E;--paper:#213944;--ink:#F0F5EB;--primary:#80B9EF;--secondary:#F1AA7D;--tertiary:#668A88;}
.t22-bg {fill:#15242E;}
.t22-paper {fill:#213944;}
.t22-ink {fill:#F0F5EB;}
.t22-primary {fill:#80B9EF;}
.t22-secondary {fill:#F1AA7D;}
.t22-tertiary {fill:#668A88;}
.t22-label {fill:#F0F5EB;font-size:27px;font-weight:600;text-anchor:middle;}
.t22-make {fill:#F0F5EB;font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:-1px;}
.t22-something {fill:#F0F5EB;font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:-.6px;}
.t22-line {fill:none;stroke:#F0F5EB;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.t22-label{font-weight:800;font-size:28px;}.t22-make{font-weight:900;}
</style>
