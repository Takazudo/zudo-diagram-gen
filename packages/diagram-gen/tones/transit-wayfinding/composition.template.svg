<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><title>予約状況の確認 — transit-wayfinding</title><rect width="720" height="400" fill="{{palette:surface}}" data-palette-fill="surface"/><path d="M72 92H226Q248 92 248 114V180H480Q500 180 500 160V92H656" fill="none" stroke="{{palette:deep}}" data-palette-stroke="deep" stroke-width="10"/><circle cx="248" cy="180" r="11" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="4"/><text x="24" y="44" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">予約状況の確認と次の手続き</text><text x="52" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">利用者</text><text x="275" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席</text><text x="520" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認待ち</text><text x="52" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席は未予約</text><text x="355" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認後に完了</text><path d="M32 373L44 353 56 373Z" fill="{{palette:warning}}" data-palette-fill="warning"/><text x="68" y="377" font-family="{{font:detail}}" font-size="{{scheme:typography.detail.fontSize}}" fill="{{palette:ink}}" data-palette-fill="ink">注意：予約内容を確認してから確定</text></svg>
