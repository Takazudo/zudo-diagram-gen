<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><title>transit-wayfinding native primitives</title><defs>
<symbol id="person" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><circle cx="32" cy="16" r="9"/><path d="M13 54V45Q13 32 32 32T51 45V54" stroke-linecap="round"/></g></symbol>
<symbol id="pin" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><path d="M32 56V36" stroke-width="{{scheme:geometry.strokeWidths.connector}}"/><circle cx="32" cy="22" r="16"/><circle cx="32" cy="22" r="5" fill="{{palette:accent}}" data-palette-fill="accent"/></g></symbol>
<symbol id="slot-card" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><rect x="6" y="10" width="52" height="44" rx="{{scheme:geometry.radii.card}}"/><path d="M8 32H56" stroke="{{palette:accent}}" data-palette-stroke="accent" stroke-width="{{scheme:geometry.strokeWidths.connector}}"/><circle cx="22" cy="32" r="5" fill="{{palette:surface}}" data-palette-fill="surface"/><circle cx="44" cy="32" r="5" fill="{{palette:surface}}" data-palette-fill="surface"/></g></symbol>
<symbol id="empty-seat" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><path d="M15 10V37H49V48M15 37V55M46 48V55M18 27H48" stroke-linecap="round"/></g></symbol>
<symbol id="arrow" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><path d="M4 46H18Q28 46 28 36V24Q28 14 38 14H56M46 5L56 14 46 23" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round"/></g></symbol>
<symbol id="check" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><circle cx="32" cy="32" r="24"/><path d="M18 32L28 42 46 22" stroke="{{palette:accent}}" data-palette-stroke="accent" stroke-linecap="round"/></g></symbol>
<symbol id="clock" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="4" fill="{{palette:accent}}" data-palette-fill="accent"/><path d="M32 14V32L46 42"/></g></symbol>
