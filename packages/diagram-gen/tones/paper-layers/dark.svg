.t12-text {font-family:Georgia, 'Times New Roman', serif;fill:#E8ECE5;font-size:28px}
.t12-label {font-weight:600;text-anchor:middle}
.t12-make {font-weight:800;letter-spacing:1px;text-anchor:middle}
</style>
