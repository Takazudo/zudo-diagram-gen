<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-description">
<title id="kit-title">paper-layers — pilot semantic kit</title>
<desc id="kit-description">Original tone-native primitive inventory. A symbol is an object mark, not an assertion about the brief or user approval.</desc>
<defs>

<symbol id="paper-cut-motif" viewBox="0 0 200 120">{{texture:cut-motif}}</symbol>
<symbol id="paper-assembly" viewBox="0 0 200 120">
<path d="M12 9L185 5L192 109L17 115Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/>
<path d="M12 9L185 5L192 109L17 115Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
<path d="M21 4L184 13L178 116L15 109Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
<use href="#paper-cut-motif" x="25" y="13" width="148" height="94"/>
<path d="M79 25L184 21L185 96L77 100Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/>
<path d="M79 25L184 21L185 96L77 100Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
</symbol>
<symbol id="paper-cut-field" viewBox="0 0 300 100">{{texture:cut-field}}</symbol>
<symbol id="paper-assembly-wide" viewBox="0 0 300 100">
<path d="M12 8L285 4L290 91L17 96Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/>
<path d="M12 8L285 4L290 91L17 96Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
<path d="M21 3L283 12L279 94L15 87Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
<use href="#paper-cut-field" x="21" y="9" width="264" height="88"/>
<path d="M94 22L287 18L285 80L92 85Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/>
<path d="M94 22L287 18L285 80L92 85Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
</symbol>
<symbol id="person" viewBox="0 0 100 100">
<g transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"><path d="M22 86L26 58L43 47H58L76 57L81 86Z"/><circle cx="50" cy="25" r="{{scheme:geometry.radii.head}}"/></g><path d="M21 85L25 57L42 46H59L76 57L80 85Z" data-palette-fill="surface" fill="{{palette:surface}}"/><path d="M34 55L67 51L70 86L30 86Z" data-palette-fill="deep" fill="{{palette:deep}}"/><circle cx="50" cy="25" r="{{scheme:geometry.radii.head}}" data-palette-fill="accent" fill="{{palette:accent}}"/>
</symbol>
<symbol id="pin" viewBox="0 0 100 100">
<path d="M25 19L68 13L78 49L52 89L20 50Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/><path d="M25 19L68 13L78 49L52 89L20 50Z" data-palette-fill="accent" fill="{{palette:accent}}"/><path d="M38 27L61 25L63 44L37 46Z" data-palette-fill="surface" fill="{{palette:surface}}"/>
</symbol>
<symbol id="slot-card" viewBox="0 0 100 100">
<use href="#paper-assembly" x="1" y="12" width="98" height="80"/>
</symbol>
<symbol id="empty-seat" viewBox="0 0 100 100">
<g transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"><path d="M28 18L70 14L74 47L30 50ZM20 59L77 54L80 68L22 73ZM28 72H36V87H28ZM69 69H77V84H69Z"/></g><path d="M28 18L70 14L74 47L30 50Z" data-palette-fill="surface" fill="{{palette:surface}}"/><path d="M20 59L77 54L80 68L22 73Z" data-palette-fill="deep" fill="{{palette:deep}}"/><path d="M28 72H36V87H28ZM69 69H77V84H69Z" data-palette-fill="ink" fill="{{palette:ink}}"/>
</symbol>
<symbol id="arrow" viewBox="0 0 100 100">
<path d="M10 68C44 71 43 31 76 31" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}"/><path d="M73 19L91 31L72 43Z" data-palette-fill="ink" fill="{{palette:ink}}"/>
</symbol>
<symbol id="check" viewBox="0 0 100 100">
<path d="M14 49L27 38L45 57L73 20L86 30L47 81Z" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/><path d="M14 49L27 38L45 57L73 20L86 30L47 81Z" data-palette-fill="accent" fill="{{palette:accent}}"/>
</symbol>
<symbol id="clock" viewBox="0 0 100 100">
<circle cx="48" cy="48" r="33" transform="translate({{scheme:geometry.layers.shadow.dx}} {{scheme:geometry.layers.shadow.dy}})" opacity="{{scheme:geometry.layers.shadow.opacity}}" data-palette-fill="border" fill="{{palette:border}}"/><circle cx="48" cy="48" r="33" data-palette-fill="surface" fill="{{palette:surface}}"/><path d="M47 24L52 25L51 47L68 58L64 63L46 51Z" data-palette-fill="ink" fill="{{palette:ink}}"/><path d="M44 13L55 13L57 21L43 21Z" data-palette-fill="deep" fill="{{palette:deep}}"/>
</symbol>
</defs>
<use href="#person" x="30" y="40" width="100" height="100"/>
<text x="30" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">person</text>
<use href="#pin" x="204" y="40" width="100" height="100"/>
<text x="204" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">pin</text>
<use href="#slot-card" x="378" y="40" width="100" height="100"/>
<text x="378" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">slot-card</text>
<use href="#empty-seat" x="552" y="40" width="100" height="100"/>
<text x="552" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">empty-seat</text>
<use href="#arrow" x="30" y="210" width="100" height="100"/>
<text x="30" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">arrow</text>
<use href="#check" x="204" y="210" width="100" height="100"/>
<text x="204" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">check</text>
<use href="#clock" x="378" y="210" width="100" height="100"/>
<text x="378" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">clock</text>
<use href="#paper-assembly" x="546" y="218" width="150" height="90"/>
<text x="552" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">assembly</text>
</svg>
