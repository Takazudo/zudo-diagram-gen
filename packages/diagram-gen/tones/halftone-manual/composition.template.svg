<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="composition-title composition-desc"><title id="composition-title">担当者2名が予約状況を確認</title><desc id="composition-desc">Two participants check one shared reservation card and one unoccupied seat. Pending and complete are separate legend states; the clock is not a completion mark.</desc><rect x="0" y="0" width="640" height="360" fill="{{palette:surface}}" data-palette-fill="surface" /><rect x="210" y="89" width="229" height="140" fill="{{palette:ink}}" data-palette-fill="ink" /><rect x="204" y="83" width="229" height="140" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M208 85L428 217" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.detail}}"/><text x="30" y="48" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">担当者2名が予約状況を確認</text><text x="45" y="239" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">担当者2名</text><text x="207" y="252" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">共有スペースの予約状況を</text><text x="207" y="279" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">利用前に確認してください</text><text x="516" y="239" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席</text><text x="27" y="330" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">状態凡例</text><text x="306" y="330" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認待ち</text><text x="486" y="330" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認済み</text><text x="472" y="48" font-family="{{font:detail}}" font-size="{{scheme:typography.detail.fontSize}}" fill="{{palette:warning}}" data-palette-fill="warning">予約変更に注意</text></svg>
