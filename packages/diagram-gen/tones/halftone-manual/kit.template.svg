<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-desc"><title id="kit-title">halftone-manual native semantic kit</title><desc id="kit-desc">Firm monochrome keylines, picture-area dot screens and diagonal hatching; essential labels occupy clean knockout ground.</desc><defs><pattern id="dots" width="{{scheme:texture.frequency}}" height="{{scheme:texture.frequency}}" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.45" fill="{{palette:ink}}" data-palette-fill="ink" /></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="m-5 5 10-10M0 10 10 0m-5 15 10-10" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.detail}}"/></pattern><clipPath id="card-clip"><path d="M0 0H240V140H0Z"/></clipPath></defs>
<symbol id="person" viewBox="0 0 120 120"><circle cx="60" cy="28" r="{{scheme:geometry.radii.head}}" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M26 108V77Q26 53 60 53T94 77V108Z" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 54Q94 54 94 77V108H60Z" fill="url(#dots)"/></symbol>
<symbol id="pin" viewBox="0 0 120 120"><path d="M60 108C39 78 24 59 24 40A36 36 0 0 1 96 40C96 59 81 78 60 108Z" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 5A36 36 0 0 1 96 40C96 59 81 78 60 108Z" fill="url(#hatch)"/><circle cx="60" cy="40" r="12" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="slot-card" viewBox="0 0 240 140"><g clip-path="url(#card-clip)"><rect x="16" y="17" width="213" height="112" fill="{{palette:ink}}" data-palette-fill="ink" /><rect x="10" y="11" width="213" height="112" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M11 12H222V60L11 105Z" fill="url(#dots)"/><path d="M145 65L222 85V122H118Z" fill="url(#hatch)"/><circle cx="51" cy="48" r="23" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></g></symbol>
<symbol id="empty-seat" viewBox="0 0 120 120"><path d="M33 16H87V71H33ZM24 73H96V87H24ZM34 87V108M85 87V108" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><rect x="43" y="26" width="34" height="35" fill="url(#dots)"/></symbol>
<symbol id="arrow" viewBox="0 0 160 60"><path d="M9 24H118V12L151 30L118 48V36H9Z" fill="{{palette:ink}}" data-palette-fill="ink" /></symbol>
<symbol id="check" viewBox="0 0 120 120"><path d="M16 56L33 43L50 62L88 20L104 35L49 100Z" fill="{{palette:ink}}" data-palette-fill="ink" /></symbol>
<symbol id="clock" viewBox="0 0 120 120"><circle cx="65" cy="64" r="39" fill="{{palette:ink}}" data-palette-fill="ink" /><circle cx="59" cy="58" r="39" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M59 19A39 39 0 0 1 98 58H59Z" fill="url(#dots)"/><path d="M59 34V58L79 71" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>
