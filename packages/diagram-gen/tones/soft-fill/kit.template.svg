<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-description">
<title id="kit-title">soft-fill — pilot semantic kit</title>
<desc id="kit-description">Original tone-native primitive inventory. A symbol is an object mark, not an assertion about the brief or user approval.</desc>
<defs>

<symbol id="person" viewBox="0 0 100 100">
<circle cx="50" cy="24" r="{{scheme:geometry.radii.head}}" data-palette-fill="ink" fill="{{palette:ink}}"/><path d="M19 80V67C19 50 31 44 50 44S81 50 81 67V80Q81 88 72 88H28Q19 88 19 80Z" data-palette-fill="deep" fill="{{palette:deep}}"/>
</symbol>
<symbol id="pin" viewBox="0 0 100 100">
<path d="M50 90C44 90 20 54 20 35A30 30 0 0 1 80 35C80 54 56 90 50 90Z" data-palette-fill="accent" fill="{{palette:accent}}"/><circle cx="50" cy="35" r="11" data-palette-fill="surface" fill="{{palette:surface}}"/>
</symbol>
<symbol id="slot-card" viewBox="0 0 100 100">
<rect x="10" y="17" width="80" height="70" rx="{{scheme:geometry.radii.card}}" data-palette-fill="deep" fill="{{palette:deep}}"/><rect x="19" y="23" width="62" height="17" rx="8" data-palette-fill="accent" fill="{{palette:accent}}"/><path d="M27 55H53M27 69H69" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.detail}}" stroke-linecap="round"/>
</symbol>
<symbol id="empty-seat" viewBox="0 0 100 100">
<rect x="26" y="14" width="48" height="36" rx="16" data-palette-fill="deep" fill="{{palette:deep}}"/><rect x="18" y="59" width="64" height="15" rx="7" data-palette-fill="ink" fill="{{palette:ink}}"/><path d="M30 73V88M70 73V88" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round"/>
</symbol>
<symbol id="arrow" viewBox="0 0 100 100">
<path d="M12 67H32Q46 67 46 53V42Q46 30 62 30H72" fill="none" data-palette-stroke="deep" stroke="{{palette:deep}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round"/><path d="M71 17Q69 14 69 20V40Q69 46 73 43L89 33Q94 30 89 27Z" data-palette-fill="deep" fill="{{palette:deep}}"/>
</symbol>
<symbol id="check" viewBox="0 0 100 100">
<rect x="13" y="13" width="74" height="74" rx="{{scheme:geometry.radii.card}}" data-palette-fill="deep" fill="{{palette:deep}}"/><path d="M29 51L43 65L72 34" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="clock" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="37" data-palette-fill="deep" fill="{{palette:deep}}"/><circle cx="50" cy="50" r="29" data-palette-fill="surface" fill="{{palette:surface}}"/><path d="M50 29V50L66 62" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.detail}}" stroke-linecap="round"/><circle cx="50" cy="50" r="4" data-palette-fill="ink" fill="{{palette:ink}}"/>
</symbol>
</defs>
<use href="#person" x="30" y="40" width="100" height="100"/>
<text x="30" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">person</text>
<use href="#pin" x="204" y="40" width="100" height="100"/>
<text x="204" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">pin</text>
<use href="#slot-card" x="378" y="40" width="100" height="100"/>
<text x="378" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">slot-card</text>
<use href="#empty-seat" x="552" y="40" width="100" height="100"/>
<text x="552" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">empty-seat</text>
<use href="#arrow" x="30" y="210" width="100" height="100"/>
<text x="30" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">arrow</text>
<use href="#check" x="204" y="210" width="100" height="100"/>
<text x="204" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">check</text>
<use href="#clock" x="378" y="210" width="100" height="100"/>
<text x="378" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">clock</text>
</svg>
