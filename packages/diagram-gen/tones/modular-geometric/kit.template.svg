<symbol id="pin" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><circle cx="32" cy="24" r="19" fill="{{palette:deep}}" data-palette-fill="deep"/><path d="M24 40H40L32 59Z" fill="{{palette:accent}}" data-palette-fill="accent"/></g></symbol>
<symbol id="slot-card" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><rect x="6" y="8" width="26" height="26" fill="{{palette:accent}}" data-palette-fill="accent"/><path d="M32 8H58A26 26 0 0 1 32 34Z" fill="{{palette:deep}}" data-palette-fill="deep"/><circle cx="19" cy="47" r="11" fill="{{palette:deep}}" data-palette-fill="deep"/><rect x="34" y="36" width="24" height="22" fill="{{palette:ink}}" data-palette-fill="ink"/></g></symbol>
<symbol id="empty-seat" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><rect x="10" y="8" width="12" height="32" fill="{{palette:ink}}" data-palette-fill="ink"/><rect x="22" y="28" width="32" height="12" fill="{{palette:deep}}" data-palette-fill="deep"/><rect x="10" y="40" width="8" height="18" fill="{{palette:ink}}" data-palette-fill="ink"/><rect x="46" y="40" width="8" height="18" fill="{{palette:ink}}" data-palette-fill="ink"/></g></symbol>
<symbol id="arrow" viewBox="0 0 64 64"><g fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}"><rect x="4" y="27" width="34" height="10" fill="{{palette:ink}}" data-palette-fill="ink"/><path d="M38 12L60 32 38 52Z" fill="{{palette:accent}}" data-palette-fill="accent"/></g></symbol>
