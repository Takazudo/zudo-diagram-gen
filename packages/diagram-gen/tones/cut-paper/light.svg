.t17-tertiary {fill:#DFD8CA;}
.t17-label {fill:#27383D;font-size:27px;font-weight:600;text-anchor:middle;}
.t17-make {fill:#27383D;font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:-1px;}
.t17-something {fill:#27383D;font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:-.6px;}
.t17-line {fill:none;stroke:#27383D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.t17-label{fill:#27383D;}svg[data-tone='17'] > path.t17-ink{fill:#27383D;}
</style>
