<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" data-tone="17" data-theme="light" role="img" aria-labelledby="t17-title t17-desc">
<title id="t17-title">Cut paper: Pattern and Text combine into a composition, exported as PNG</title>
<desc id="t17-desc">A pattern background and a text layer, shown separately at left, combine in the poster at center. The poster visibly contains both the pattern and MAKE SOMETHING text. A rightward connector indicates its PNG export. Irregular cut silhouettes, offset paper edges, flat organic color fields, and a pasted text layer. Connectors feel cut by hand while keeping their direction explicit.</desc>
<style>
svg[data-tone='17'] {--bg:#F5F0E6;--paper:#FFEDB2;--ink:#27383D;--primary:#DC735C;--secondary:#5DACA2;--tertiary:#DFD8CA;--label:#27383D;--flow:#27383D;font-family:Arial, Helvetica, sans-serif;}
svg[data-tone='17'][data-theme='dark'] {--bg:#1D292B;--paper:#DCCDAC;--ink:#182D32;--primary:#DE816D;--secondary:#73B8AC;--tertiary:#3B4B4D;--label:#F4EDD9;--flow:#DCCDAC;}
