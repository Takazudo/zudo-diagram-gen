<svg xmlns="http://www.w3.org/2000/svg" id="t05" data-tone="05" data-theme="light" viewBox="0 0 720 400" role="img" aria-labelledby="t05-title t05-desc"><title id="t05-title">05 Editorial serif</title><desc id="t05-desc">A pattern background and a text layer combine into one composition, which can be exported as a PNG image.</desc><style>#t05{--paper:#f7f1e9;--ink:#47372c;--muted:#7f6a5b;--line:#c3b6a6;--accent:#a7523c;--soft:#ead8c6;--strong:#cc9f85;font-family:Arial,Helvetica,sans-serif;}#t05[data-theme="dark"]{--paper:#29201c;--ink:#efe2d2;--muted:#c7af97;--line:#76604e;--accent:#e1a07e;--soft:#51382c;--strong:#82604a;}</style><defs><pattern id="t05-pattern" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28L28 0M-7 7L7 -7M21 35L35 21" fill="none" stroke="var(--accent)" stroke-width="6"/></pattern></defs><rect x="0" y="0" width="720" height="400" rx="0" fill="var(--paper)" stroke="none" stroke-width="2" /><text x="48" y="53" font-size="28" fill="var(--ink)" font-weight="400" font-family="Georgia,serif" >Pattern</text><path d="M48 67H208" fill="none" stroke="var(--line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="83" width="162" height="91" rx="0" fill="var(--soft)" stroke="none" stroke-width="0" /><rect x="56" y="91" width="146" height="75" rx="0" fill="url(#t05-pattern)"/><text x="48" y="231" font-size="28" fill="var(--ink)" font-weight="400" font-family="Georgia,serif" >Text</text><path d="M48 245H208" fill="none" stroke="var(--line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="330" font-size="83" fill="var(--accent)" font-weight="400" font-family="Georgia,serif" >Aa</text><path d="M210 123 H246 Q284 123 284 162 V199" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M210 296 H246 Q284 296 284 258 V205" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path