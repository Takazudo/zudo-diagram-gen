<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-desc"><title id="kit-title">risograph-duo native semantic kit</title><desc id="kit-desc">Two offset spot passes with broad overlapping circles and sparse print grain. Labels are single-pass to preserve Japanese legibility.</desc><defs><pattern id="grain" width="{{scheme:texture.frequency}}" height="59" patternUnits="userSpaceOnUse"><g opacity="{{scheme:geometry.opacities.grain}}"><circle cx="5" cy="8" r="0.75" fill="{{palette:ink}}" data-palette-fill="ink" /><circle cx="22" cy="43" r="0.6" fill="{{palette:ink}}" data-palette-fill="ink" /><circle cx="47" cy="17" r="0.9" fill="{{palette:ink}}" data-palette-fill="ink" /><circle cx="56" cy="51" r="0.65" fill="{{palette:ink}}" data-palette-fill="ink" /><circle cx="34" cy="29" r="0.55" fill="{{palette:ink}}" data-palette-fill="ink" /></g></pattern><clipPath id="card-clip"><path d="M0 0H240V140H0Z"/></clipPath></defs>
<symbol id="person" viewBox="0 0 120 120"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><circle cx="60" cy="28" r="{{scheme:geometry.radii.head}}" fill="{{palette:accent}}" data-palette-fill="accent" /><path d="M25 107V78Q25 51 60 51T95 78V107Z" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><circle cx="60" cy="28" r="19" fill="{{palette:ink}}" data-palette-fill="ink" /><path d="M25 107V78Q25 51 60 51T95 78V107Z" fill="{{palette:ink}}" data-palette-fill="ink" /></g><path d="M25 107V78Q25 51 60 51T95 78V107Z" fill="url(#grain)"/></symbol>
<symbol id="pin" viewBox="0 0 120 120"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><path d="M60 108C40 77 23 60 23 40A37 37 0 0 1 97 40C97 60 80 77 60 108Z" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><path d="M60 108C40 77 23 60 23 40A37 37 0 0 1 97 40C97 60 80 77 60 108Z" fill="{{palette:ink}}" data-palette-fill="ink" /></g><circle cx="60" cy="41" r="12" fill="{{palette:surface}}" data-palette-fill="surface" /></symbol>
<symbol id="slot-card" viewBox="0 0 240 140"><g clip-path="url(#card-clip)"><rect x="13" y="15" width="213" height="112" fill="{{palette:accent}}" data-palette-fill="accent" /><rect x="10" y="12" width="213" height="112" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="92" cy="68" r="47" fill="{{palette:accent}}" data-palette-fill="accent" opacity=".88"/><circle cx="145" cy="68" r="47" fill="{{palette:ink}}" data-palette-fill="ink" opacity=".76"/><rect x="10" y="12" width="213" height="112" fill="url(#grain)"/></g></symbol>
<symbol id="empty-seat" viewBox="0 0 120 120"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><path d="M32 16H87V71H32ZM23 73H97V87H23ZM31 87H40V110H31ZM81 87H90V110H81Z" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><path d="M32 16H87V71H32ZM23 73H97V87H23ZM31 87H40V110H31ZM81 87H90V110H81Z" fill="{{palette:ink}}" data-palette-fill="ink" /></g><rect x="41" y="26" width="37" height="32" fill="{{palette:surface}}" data-palette-fill="surface" /></symbol>
<symbol id="arrow" viewBox="0 0 160 60"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><path d="M10 25H123V14L150 30L123 46V35H10Z" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><path d="M10 25H123V14L150 30L123 46V35H10Z" fill="{{palette:ink}}" data-palette-fill="ink" /></g></symbol>
<symbol id="check" viewBox="0 0 120 120"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><path d="M14 58L33 42L48 61L86 19L108 36L48 102Z" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><path d="M14 58L33 42L48 61L86 19L108 36L48 102Z" fill="{{palette:ink}}" data-palette-fill="ink" /></g></symbol>
<symbol id="clock" viewBox="0 0 120 120"><g transform="translate({{scheme:geometry.layers.offset.dx}} {{scheme:geometry.layers.offset.dy}})" opacity=".88"><circle cx="58" cy="57" r="39" fill="{{palette:accent}}" data-palette-fill="accent" /></g><g opacity=".76"><circle cx="58" cy="57" r="39" fill="{{palette:ink}}" data-palette-fill="ink" /></g><circle cx="58" cy="57" r="28" fill="{{palette:surface}}" data-palette-fill="surface" /><path d="M58 36V57L76 69" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>
