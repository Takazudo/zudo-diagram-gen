<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t16-title t16-desc" data-tone="16" data-theme="dark">
<title id="t16-title">16 — Risograph duo</title>
<desc id="t16-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. Two offset spot colors, visible overprint, broad circular motifs, and sparse print grain give the diagram a small-edition risograph character.</desc>
