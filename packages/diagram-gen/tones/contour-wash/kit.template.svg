<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-desc"><title id="kit-title">contour-wash native semantic kit</title><desc id="kit-desc">Precise open contours over broad translucent washes. Wash overlap is decoration, never an additional relation.</desc><defs><clipPath id="card-clip"><path d="M0 0H240V140H0Z"/></clipPath></defs>
<symbol id="person" viewBox="0 0 120 120"><circle cx="57" cy="55" r="44" fill="{{palette:deep}}" data-palette-fill="deep" opacity="{{scheme:geometry.opacities.wash}}"/><circle cx="60" cy="28" r="{{scheme:geometry.radii.head}}" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 105V75Q30 53 60 53T90 75V105" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="pin" viewBox="0 0 120 120"><circle cx="52" cy="44" r="36" fill="{{palette:accent}}" data-palette-fill="accent" opacity="{{scheme:geometry.opacities.wash}}"/><path d="M60 109C42 82 25 64 25 42A35 35 0 0 1 95 42C95 64 78 82 60 109Z" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="60" cy="42" r="12" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:accent}}" data-palette-stroke="accent" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="slot-card" viewBox="0 0 240 140"><g clip-path="url(#card-clip)"><circle cx="170" cy="63" r="54" fill="{{palette:deep}}" data-palette-fill="deep" opacity="{{scheme:geometry.opacities.wash}}"/><rect x="16" y="20" width="208" height="102" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" fill-opacity=".25" rx="{{scheme:geometry.radii.card}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 43H96M30 98H180" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.detail}}"/></g></symbol>
<symbol id="empty-seat" viewBox="0 0 120 120"><circle cx="66" cy="68" r="43" fill="{{palette:deep}}" data-palette-fill="deep" opacity="{{scheme:geometry.opacities.wash}}"/><path d="M33 20H85V69H33ZM25 70H93V82H25ZM34 82V108M84 82V108" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="arrow" viewBox="0 0 160 60"><path d="M12 33C55 5 88 56 144 26M132 17L144 26L134 38" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="check" viewBox="0 0 120 120"><circle cx="57" cy="65" r="42" fill="{{palette:deep}}" data-palette-fill="deep" opacity="{{scheme:geometry.opacities.wash}}"/><path d="M27 60L49 82L93 34" fill="none" stroke="{{palette:accent}}" data-palette-stroke="accent" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="clock" viewBox="0 0 120 120"><circle cx="53" cy="64" r="42" fill="{{palette:accent}}" data-palette-fill="accent" opacity="{{scheme:geometry.opacities.wash}}"/><circle cx="60" cy="59" r="37" fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:ink}}" data-palette-stroke="ink" fill-opacity=".2" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 33V60L82 72" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>
