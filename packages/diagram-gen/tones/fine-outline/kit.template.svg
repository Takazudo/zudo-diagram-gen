<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-description">
<title id="kit-title">fine-outline — pilot semantic kit</title>
<desc id="kit-description">Original tone-native primitive inventory. A symbol is an object mark, not an assertion about the brief or user approval.</desc>
<defs>

<symbol id="person" viewBox="0 0 100 100">
<g fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="25" r="{{scheme:geometry.radii.head}}"/><path d="M25 85V67C25 42 75 42 75 67V85M34 66V85M66 66V85"/></g>
</symbol>
<symbol id="pin" viewBox="0 0 100 100">
<path d="M50 87C39 72 25 52 25 34A25 25 0 0 1 75 34C75 52 61 72 50 87Z" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}"/><circle cx="50" cy="34" r="8" data-palette-fill="accent" fill="{{palette:accent}}"/>
</symbol>
<symbol id="slot-card" viewBox="0 0 100 100">
<rect x="12" y="20" width="76" height="62" rx="{{scheme:geometry.radii.card}}" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}"/><path d="M12 38H88M27 15V26M73 15V26M28 56H53M28 68H65" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linecap="round"/>
</symbol>
<symbol id="empty-seat" viewBox="0 0 100 100">
<path d="M29 51V19H71V51M23 56H77V69H23ZM29 69V88M71 69V88" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round"/>
</symbol>
<symbol id="arrow" viewBox="0 0 100 100">
<path d="M12 60H35Q48 60 48 46V40Q48 30 62 30H87M75 18L87 30L75 42" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="check" viewBox="0 0 100 100">
<path d="M18 53L40 75L83 26" fill="none" data-palette-stroke="accent" stroke="{{palette:accent}}" stroke-width="{{scheme:geometry.strokeWidths.connector}}" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="clock" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="34" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}"/><path d="M50 26V50L67 61M50 16V21M84 50H79M50 84V79M16 50H21" fill="none" data-palette-stroke="ink" stroke="{{palette:ink}}" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linecap="round"/>
</symbol>
</defs>
<use href="#person" x="30" y="40" width="100" height="100"/>
<text x="30" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">person</text>
<use href="#pin" x="204" y="40" width="100" height="100"/>
<text x="204" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">pin</text>
<use href="#slot-card" x="378" y="40" width="100" height="100"/>
<text x="378" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">slot-card</text>
<use href="#empty-seat" x="552" y="40" width="100" height="100"/>
<text x="552" y="170" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">empty-seat</text>
<use href="#arrow" x="30" y="210" width="100" height="100"/>
<text x="30" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">arrow</text>
<use href="#check" x="204" y="210" width="100" height="100"/>
<text x="204" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">check</text>
<use href="#clock" x="378" y="210" width="100" height="100"/>
<text x="378" y="340" font-family="{{font:label}}" font-size="{{scheme:typography.detail.fontSize}}" data-palette-fill="ink" fill="{{palette:ink}}">clock</text>
</svg>
