.t15-text {font-family:'Segoe Print', 'Comic Sans MS', 'Trebuchet MS', Arial, sans-serif;fill:#F0EEE0;font-size:28px}
.t15-label {font-weight:600;text-anchor:middle}
.t15-make {font-weight:800;letter-spacing:1px;text-anchor:middle}
</style>
