<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t15-title t15-desc" data-tone="15" data-theme="light">
<title id="t15-title">15 — Chalkboard</title>
<desc id="t15-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. Dry broken strokes, chalk dust, soft secondary contours, and warm chalk accents present the relationship as a compact blackboard lesson.</desc>
