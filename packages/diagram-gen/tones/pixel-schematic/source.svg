<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" data-tone="19" data-theme="light" role="img" aria-labelledby="t19-title t19-desc">
<title id="t19-title">Pixel schematic: Pattern and Text combine into a composition, exported as PNG</title>
<desc id="t19-desc">A pattern background and a text layer, shown separately at left, combine in the poster at center. The poster visibly contains both the pattern and MAKE SOMETHING text. A rightward connector indicates its PNG export. Stepped silhouettes, discrete grid blocks, hard raster-like edges, and chunky directional glyphs. Large real text remains readable instead of imitating microscopic pixels.</desc>
<style>
svg[data-tone='19'] {--bg:#F4F0E5;--paper:#FFFCEF;--ink:#292E36;--primary:#6978DF;--secondary:#F4A571;--tertiary:#B5D4A9;font-family:'Courier New', Courier, monospace;}
svg[data-tone='19'][data-theme='dark'] {--bg:#20252F;--paper:#343F4B;--ink:#FBF1D9;--primary:#929EF9;--secondary:#ECAE83;--tertiary:#93C0AB;}
.t19-bg {fill:var(--bg);}
.t19-paper {fill:var(--paper);}
.t19-ink {fill:var(--ink);}
.t19-primary {fill:var(--primary);}
.t19-secondary {fill:var(--secondary);}
.t19-tertiary {fill:var(--tertiary);}
.t19-label {fill:var(--ink);font-size:27px;font-weight:600;text-anchor:middle;}
.t19-make {fill:var(--ink);font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:-1px;}
.t19-something {fill:var(--ink);font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:-.6px;}
.t19-line {fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.t19-label{font-weight:700;letter-spacing:-1px;}
</style>
