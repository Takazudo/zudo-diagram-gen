<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t14-title t14-desc" data-tone="14" data-theme="dark">
<title id="t14-title">14 — Marker workshop</title>
<desc id="t14-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. Broad rounded marker lines, loose loop motifs, imperfect corners, and flat highlighter swipes give the diagram a lively workshop character.</desc>
