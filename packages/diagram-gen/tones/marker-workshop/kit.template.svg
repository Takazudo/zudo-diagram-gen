<symbol id="slot-card" viewBox="0 0 240 140"><path d="M12 20Q105 7 226 17L223 122Q124 130 10 120Z" fill="url(#loops)" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/><path d="M23 55L210 49L213 98L22 106Z" fill="{{palette:accent}}" data-palette-fill="accent" /></symbol>
