<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="kit-title kit-desc"><title id="kit-title">marker-workshop native semantic kit</title><desc id="kit-desc">Broad rounded marker paths with imperfect corners, loose loops and flat highlighter swipes.</desc><defs><pattern id="loops" width="{{scheme:texture.frequency}}" height="49" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="63" height="49" fill="{{palette:deep}}" data-palette-fill="deep" /><path d="M-7 34C-4 3 33 -5 39 15C46 43 17 46 15 24C13 8 48 0 63 17C80 35 52 53 48 32" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></pattern><clipPath id="card-clip"><path d="M8 8H226V122H8Z"/></clipPath></defs>
<symbol id="person" viewBox="0 0 120 120"><path d="M27 95Q58 87 98 94" fill="none" stroke="{{palette:deep}}" data-palette-stroke="deep" stroke-width="21"/><path d="M43 29C39 7 76 9 80 25C84 48 46 50 43 29ZM25 106L28 73Q62 46 95 75L93 106" fill="none" stroke="{{palette:ink}}" data-palette-stroke="ink" stroke-width="{{scheme:geometry.strokeWidths.outline}}" stroke-linejoin="round" stroke-linecap="round"/></symbol>
