.t11-text {font-family:Arial, Helvetica, sans-serif;fill:var(--ink);font-size:28px}
.t11-label {font-weight:600;text-anchor:middle}
.t11-make {font-weight:800;letter-spacing:1px;text-anchor:middle}
</style>
