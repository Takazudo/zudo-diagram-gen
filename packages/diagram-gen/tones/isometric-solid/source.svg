<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t11-title t11-desc" data-tone="11" data-theme="light">
<title id="t11-title">11 — Isometric solid</title>
<desc id="t11-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. Opaque extruded tiles, clearly separated facet colors, hard cast shadows, and bold circular pattern pieces turn inputs and outputs into tangible objects.</desc>
