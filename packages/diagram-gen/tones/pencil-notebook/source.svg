.t13-text {font-family:'Segoe Print', 'Comic Sans MS', 'Trebuchet MS', Arial, sans-serif;fill:var(--ink);font-size:28px}
.t13-label {font-weight:600;text-anchor:middle}
.t13-make {font-weight:800;letter-spacing:1px;text-anchor:middle}
</style>
