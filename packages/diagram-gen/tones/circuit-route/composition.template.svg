<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><title>予約状況の確認 — circuit-route</title><rect width="720" height="400" fill="{{palette:surface}}" data-palette-fill="surface"/><path d="M24 88H216V116M24 332H300V304M492 340H680V304" stroke="{{palette:border}}" data-palette-stroke="border" fill="none" stroke-width="3"/><g fill="{{palette:surface}}" data-palette-fill="surface" stroke="{{palette:border}}" data-palette-stroke="border" stroke-width="3"><circle cx="24" cy="88" r="5"/><circle cx="24" cy="332" r="5"/><circle cx="680" cy="304" r="5"/></g><text x="24" y="44" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">予約状況の確認と次の手続き</text><text x="52" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">利用者</text><text x="275" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席</text><text x="520" y="242" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認待ち</text><text x="52" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">空席は未予約</text><text x="355" y="308" font-family="{{font:label}}" font-size="{{scheme:typography.label.fontSize}}" font-weight="{{scheme:typography.label.fontWeight}}" fill="{{palette:ink}}" data-palette-fill="ink">確認後に完了</text><path d="M32 373L44 353 56 373Z" fill="{{palette:warning}}" data-palette-fill="warning"/><text x="68" y="377" font-family="{{font:detail}}" font-size="{{scheme:typogr