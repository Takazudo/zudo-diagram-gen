<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t10-title t10-desc" data-tone="10" data-theme="light">
<title id="t10-title">10 — Isometric wire</title>
<desc id="t10-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. Thin open contours describe projected planes. Dashed construction lines, repeated wire grids, and an orange registration edge reveal the layer geometry without solid volumes.</desc>
