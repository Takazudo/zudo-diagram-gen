<title id="t09-title">09 — Technical blueprint</title>
<desc id="t09-desc">A Pattern source and a Text source containing MAKE combine into a poster that visibly contains both. The poster is exported as PNG. A precise drafting grid, fine orthogonal connectors, registration crosses, and measurement leaders make the composition read as an engineered construction.</desc>
