<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" data-tone="21" data-theme="dark" role="img" aria-labelledby="t21-title t21-desc">
<title id="t21-title">Circuit route: Pattern and Text combine into a composition, exported as PNG</title>
<desc id="t21-desc">A pattern background and a text layer, shown separately at left, combine in the poster at center. The poster visibly contains both the pattern and MAKE SOMETHING text. A rightward connector indicates its PNG export. Consistent right-angle paths, circular ports, solder-pad-like junctions, and a restrained substrate palette. The routed paths describe the two input layers and the single exported result.</desc>
<style>
svg[data-tone='21'] {--bg:#EEF5EF;--paper:#FCFFFA;--ink:#263D40;--primary:#248777;--secondary:#C69B43;--tertiary:#B8D4C6;font-family:Arial, Helvetica, sans-serif;}
svg[data-tone='21'][data-theme='dark'] {--bg:#11262A;--paper:#18383C;--ink:#E4F3DF;--primary:#77C8AC;--secondary:#DCC078;--tertiary:#365B56;}
.t21-bg {fill:#11262A;}
.t21-paper {fill:#18383C;}
.t21-ink {fill:#E4F3DF;}
.t21-primary {fill:#77C8AC;}
.t21-secondary {fill:#DCC078;}
.t21-tertiary {fill:#365B56;}
.t21-label {fill:#E4F3DF;font-size:27px;font-weight:600;text-anchor:middle;}
.t21-make {fill:#E4F3DF;font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:-1px;}
.t21-something {fill:#E4F3DF;font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:-.6px;}
.t21-line {fill:none;stroke:#E4F3DF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.t21-route{fill:none;stroke:#77C8AC;stroke-width:3;stroke-linejoin:round;}.t21-knockout{paint-order:stroke;stroke:#18383C;stroke-width:8;stroke-linejoin:round;}.t21-label{font-weight:600;}
</style>
