  <rect class="pdc-selected" x="62.5" y="282.5" width="40" height="40"/>
  <text class="pdc-on-selected" x="82.5" y="312">A</text>
  <rect class="pdc-selected" x="127.5" y="282.5" width="40" height="40"/>
  <text class="pdc-on-selected" x="147.5" y="312">B</text>

  <text class="pdc-meta" x="273" y="177">1 remains</text>
  <path class="pdc-arrow" d="M247 207.5H434" marker-end="url(#pdc-arrowhead)"/>
  <text x="291" y="277">Move 2</text>
  <path class="pdc-arrow" d="M247 311H434" marker-end="url(#pdc-arrowhead)"/>

  <rect class="pdc-panel" x="444.5" y="124.5" width="243" height="109"/>
  <text x="460" y="161">Workbench</text>
  <path class="pdc-rule" d="M445 174.5H687"/>
  <rect class="pdc-node" x="462.5" y="184.5" width="39" height="39"/>
  <text class="pdc-node-text" x="482" y="214">C</text>

  <rect class="pdc-panel" x="444.5" y="253.5" width="243" height="109"/>
  <text x="460" y="289">Draft: Guide</text>
  <path class="pdc-rule" d="M445 299.5H687"/>
  <rect class="pdc-selected" x="462.5" y="310.5" width="39" height="39"/>
  <text class="pdc-on-selected" x="482" y="340">A</text>
  <rect class="pdc-selected" x="525.5" y="310.5" width="39" height="39"/>
  <text class="pdc-on-selected" x="545" y="340">B</text>
  <text class="pdc-meta" x="32" y="393">Workbench keeps the unselected change.</text>
</svg>
