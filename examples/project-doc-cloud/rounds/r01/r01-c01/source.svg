<svg xmlns="http://www.w3.org/2000/svg" id="pdc-svg" data-theme="light" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="pdc-title pdc-desc">
  <title id="pdc-title">Move two selected changes from Workbench into a named draft</title>
  <desc id="pdc-desc">Before collection, Workbench contains the unselected change C and selected changes A and B. After Move, the named draft Guide holds A and B, while Workbench still exists and retains C. The marks represent changes, not whole pages. This example assumes no additional dependencies or blockers.</desc>
  <!-- Prototype schematic. Source: zudolab/zudo-doc-cloud main 0bafaf39a278580f2f3118f972833b89347453ba. Default palette values and roles follow packages/zudo-doc-cloud/src/styles/tokens.css. Workflow follows doc/src/content/docs/spec/project-hierarchy.mdx.
       Renderer-compatible colors were computed, not guessed: OKLCH to OKLab to linear sRGB, then sRGB transfer and nearest 8-bit channels.
       Light source OKLCH: bg (.970151,0,0), surface (.943089,0,0), fg (.200193,0,0), mild (.40912,0,0), muted (.517303,0,0).
       Dark source OKLCH: bg (.150035,.00212,286.141497), surface (.19168,.001992,286.210302), fg (.900601,0,0), mild (.730779,.001145,197.131511), muted (.633429,0,0).
       Border-strong mixes 35% fg + 65% bg in OKLCH before conversion: light (.7006657,0,0) becomes #9e9e9e; dark (.4127331,.001378,286.141497) becomes #4b4b4c. Zero-chroma foreground hue is powerless in the dark mix.
       Hairline is the foreground at alpha .12, matching 12% foreground + transparent with premultiplied-alpha interpolation. -->
  <style>
    #pdc-svg { --pdc-bg:#f5f5f5; --pdc-surface:#ececec; --pdc-fg:#161616; --pdc-mild:#4a4a4a; --pdc-muted:#686868; --pdc-line:#9e9e9e; --pdc-hairline:rgba(22,22,22,.12); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    #pdc-svg[data-theme="dark"] { --pdc-bg:#0b0b0c; --pdc-surface:#141415; --pdc-fg:#dedede; --pdc-mild:#a7a8a8; --pdc-muted:#8a8a8a; --pdc-line:#4b4b4c; --pdc-hairline:rgba(222,222,222,.12); }
    #pdc-svg text { fill:var(--pdc-fg); font-size:26px; font-weight:500; }
    #pdc-svg .pdc-title { font-size:32px; font-weight:600; letter-spacing:-.65px; }
    #pdc-svg .pdc-page { fill:var(--pdc-bg); }
    #pdc-svg .pdc-panel { fill:var(--pdc-bg); stroke:var(--pdc-line); stroke-width:1; }
    #pdc-svg .pdc-wash { fill:var(--pdc-surface); }
    #pdc-svg .pdc-rule { fill:none; stroke:var(--pdc-hairline); stroke-width:1; }
    #pdc-svg .pdc-arrow { fill:none; stroke:var(--pdc-mild); stroke-width:1.75; }
    #pdc-svg .pdc-node { fill:var(--pdc-bg); stroke:var(--pdc-line); stroke-width:1; }
    #pdc-svg .pdc-selected { fill:var(--pdc-mild); stroke:var(--pdc-mild); stroke-width:1; }
    #pdc-svg .pdc-node-text { font-size:26px; text-anchor:middle; }
    #pdc-svg .pdc-on-selected { fill:var(--pdc-bg); font-size:26px; text-anchor:middle; }
    #pdc-svg .pdc-meta { fill:var(--pdc-mild); font-size:26px; font-weight:400; }
  </style>
  <defs><marker id="pdc-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="var(--pdc-mild)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="pdc-page" width="720" height="400"/>
  <text class="pdc-title" x="32" y="45">Collect selected changes into a draft</text>
  <text class="pdc-meta" x="32" y="98">Before</text>
  <text class="pdc-meta" x="444" y="98">After</text>

  <rect class="pdc-panel" x="32.5" y="124.5" width="207" height="219"/>
  <text x="48" y="161">Workbench</text>
  <path class="pdc-rule" d="M33 174.5H239"/>
  <rect class="pdc-node" x="63.5" y="186.5" width="43" height="43"/>
  <text class="pdc-node-text" x="85" y="217">C</text>
  <rect class="pdc-wash" x="48" y="247" width="175" height="81"/>
